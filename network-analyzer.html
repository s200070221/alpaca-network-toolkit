<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Network Analyzer Suite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦙</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;
  --border:#1e3a5f;--text:#e2e8f0;--text-dim:#64748b;--text-mid:#94a3b8;
  --accent:#00d4ff;--accent2:#7dd3fc;
}
:root[data-theme="light"],body[data-theme="light"]{
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#f8fafc;
  --border:#cbd5e1;--text:#1e293b;--text-dim:#475569;--text-mid:#64748b;
  --accent:#0090b8;--accent2:#0284c7;
}
body{font-family:'Noto Sans TC','IBM Plex Sans TC',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

/* ── Header ────────────────────────────────────────────────── */
.header{padding:28px 40px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{font-size:32px;line-height:1}
.logo-text h1{font-size:22px;font-weight:700;
  background:linear-gradient(90deg,#00d4ff,#7dd3fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-text p{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:2px}

.lang-bar{display:flex;gap:6px}
.lang-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  padding:5px 12px;font-size:11px;color:var(--text-dim);cursor:pointer;
  transition:border-color .15s,color .15s;font-family:inherit}
.lang-btn:hover,.lang-btn.active{border-color:var(--accent);color:var(--accent)}

/* ── Hero ──────────────────────────────────────────────────── */
.hero{padding:36px 40px 0;text-align:center}
.hero-sub{font-size:13px;color:var(--text-dim);margin-top:6px}

/* ── Cards grid ────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;padding:32px 40px;flex:1}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:24px;display:flex;flex-direction:column;gap:16px;
  transition:border-color .2s,transform .2s,box-shadow .2s;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--card-color,#00d4ff),transparent)}
.card:hover{border-color:var(--card-color,#00d4ff);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4)}

.card-icon{font-size:36px;line-height:1}
.card-title{font-size:16px;font-weight:700;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card-badge{font-size:11px;font-family:'JetBrains Mono',monospace;
  background:rgba(0,212,255,.12);color:var(--accent);border-radius:4px;padding:2px 6px}
.card-badge-experimental{background:rgba(245,158,11,.15);color:#f59e0b;margin-left:4px}
.card-desc{font-size:12px;color:var(--text-mid);line-height:1.7;flex:1}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-family:'JetBrains Mono',monospace;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;padding:2px 7px;color:var(--text-dim)}
.card-features{border-top:1px solid var(--border);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.feat{font-size:11px;color:var(--text-mid);display:flex;align-items:center;gap:4px}
.feat::before{content:'✓';color:var(--card-color,#00d4ff);font-size:10px;font-weight:700}

.card-open{margin-top:4px;background:linear-gradient(135deg,var(--card-color,#00d4ff) 0%,rgba(0,212,255,.6) 100%);
  border:none;border-radius:8px;padding:10px 0;font-size:12px;font-weight:600;
  color:#0a0e1a;cursor:pointer;font-family:inherit;
  transition:opacity .15s,transform .15s}
.card-open:hover{opacity:.9;transform:scale(.99)}

/* ── Footer ─────────────────────────────────────────────────── */
.footer{padding:16px 40px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.footer-note{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
.alpaca{opacity:.7;transition:opacity .2s;cursor:default;line-height:1}
.alpaca:hover{opacity:1}

/* ── Drop hint bar ──────────────────────────────────────────────── */
.drop-hint-bar{margin:0 40px 24px;border:1.5px dashed var(--border);border-radius:10px;
  padding:13px 20px;display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--text-dim);font-size:12px;cursor:pointer;
  transition:border-color .2s,background .2s,color .2s}
.drop-hint-bar:hover{border-color:var(--accent);background:rgba(0,212,255,.04);color:var(--text-mid)}
.drop-hint-bar .dhb-pick{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);
  color:var(--accent);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;
  font-family:inherit;transition:background .15s;flex-shrink:0}
.drop-hint-bar .dhb-pick:hover{background:rgba(0,212,255,.22)}
.drop-hint-hero{margin:18px 40px 0;padding:22px 20px;font-size:14px;flex-wrap:wrap}
.drop-hint-hero .dhb-pick{font-size:13px;padding:6px 16px}
.hero-steps{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin:14px 0 0;padding:0;font-size:12px;color:var(--text-mid);counter-reset:hs}
.hero-steps li{counter-increment:hs;display:flex;align-items:center;gap:6px}
.hero-steps li::before{content:counter(hs);display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(0,212,255,.15);color:var(--accent);font-weight:700;font-size:11px}
.card-actions{display:flex;gap:8px;margin-top:4px}
.card-actions .card-open{flex:1;margin-top:0}
.card-demo{background:transparent;border:1px solid var(--card-color,#00d4ff);color:var(--text-mid);border-radius:8px;padding:10px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.card-demo:hover{background:var(--surface2)}
.card-tags:not(.open) .tag:nth-of-type(n+11){display:none}
.tag-more{font-size:11px;background:none;border:1px dashed var(--border);border-radius:4px;padding:2px 7px;color:var(--accent);cursor:pointer;font-family:inherit}
@media(max-width:600px){.drop-hint-hero{margin:14px 16px 0}.hero{padding:24px 16px 0}}

/* ── Konami bounce ───────────────────────────────────────────────── */
@keyframes card-bounce{
  0%,100%{transform:translateY(0)}
  20%{transform:translateY(-14px)}
  50%{transform:translateY(-7px)}
  70%{transform:translateY(-11px)}
}
.card-bounce{animation:card-bounce .65s ease}

/* ── Alpaca parade ───────────────────────────────────────────────── */
@keyframes alpaca-run{from{transform:translateX(110vw)}to{transform:translateX(-110vw)}}
.alpaca-parade{position:fixed;bottom:24px;left:0;white-space:nowrap;
  font-size:30px;z-index:999;pointer-events:none;
  animation:alpaca-run 3.2s linear forwards}

/* ── Logo egg toast ──────────────────────────────────────────────── */
.egg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;cursor:pointer}
.egg-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--surface);border:1px solid var(--accent);border-radius:14px;
  padding:28px 36px;z-index:1001;min-width:300px;text-align:center;
  box-shadow:0 0 40px rgba(0,212,255,.25);pointer-events:none}
.egg-toast-icon{font-size:36px;margin-bottom:10px}
.egg-toast-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:18px}
.egg-stat-row{display:flex;justify-content:space-between;align-items:center;
  gap:20px;margin:7px 0;font-size:12px}
.egg-stat-val{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700}
.egg-toast-hint{margin-top:18px;font-size:10px;color:var(--text-dim);
  font-family:'JetBrains Mono',monospace}

/* ── Notice bar ─────────────────────────────────────────────────── */
.notice{margin:16px 40px 0;padding:8px 16px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);
  border-radius:8px;font-size:12px;color:#fbbf24;text-align:center;
  font-family:'JetBrains Mono',monospace;line-height:1.5}

/* ── Phase 4 第 17 項：hub 顯示 config_anonymizer 最近處理摘要 ─────────────────── */
.recent-anon-card{margin:0 40px 8px;padding:12px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;font-size:12px}
.recent-anon-title{font-weight:600;color:var(--text-dim,#94a3b8);margin-bottom:6px}
.recent-anon-item{color:var(--text);padding:2px 0}
.recent-anon-empty{color:var(--text-dim,#94a3b8)}

.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 16px}
.gl-item>summary{cursor:pointer;color:var(--text);font-weight:600;padding:3px 0}
.gl-item>div{color:var(--text-dim,#94a3b8);line-height:1.6;padding:2px 0 6px 14px}
/* ── Klingon lang btn ────────────────────────────────────────────── */
#lang-klingon{border-color:#c0392b;color:#e74c3c}
#lang-klingon:hover,#lang-klingon.active{border-color:#e74c3c;color:#ff6b6b;
  box-shadow:0 0 8px rgba(231,76,60,.4)}
/* ── Easter egg lang btns ────────────────────────────────────────── */
#lang-pirate{border-color:#b45309;color:#f59e0b}
#lang-pirate:hover,#lang-pirate.active{border-color:#f59e0b;color:#fcd34d;box-shadow:0 0 8px rgba(245,158,11,.4)}
#lang-leet{border-color:#047857;color:#10b981}
#lang-leet:hover,#lang-leet.active{border-color:#10b981;color:#6ee7b7;box-shadow:0 0 8px rgba(16,185,129,.4)}
#lang-emoji{border-color:#7c3aed;color:#a78bfa}
#lang-emoji:hover,#lang-emoji.active{border-color:#a78bfa;color:#c4b5fd;box-shadow:0 0 8px rgba(167,139,250,.4)}
#lang-uwu{border-color:#be185d;color:#f472b6}
#lang-uwu:hover,#lang-uwu.active{border-color:#f472b6;color:#fbcfe8;box-shadow:0 0 8px rgba(244,114,182,.4)}
#lang-bureau{border-color:#475569;color:#94a3b8}
#lang-bureau:hover,#lang-bureau.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.4)}
#lang-cat{border-color:#c2410c;color:#fb923c}
#lang-cat:hover,#lang-cat.active{border-color:#fb923c;color:#fdba74;box-shadow:0 0 8px rgba(251,146,60,.4)}
#lang-bean{border-color:#b45309;color:#4ade80}
#lang-bean:hover,#lang-bean.active{border-color:#fbbf24;color:#bbf7d0;box-shadow:0 0 8px rgba(74,222,128,.4)}
#lang-alpaca{border-color:#92400e;color:#fcd34d}
#lang-alpaca:hover,#lang-alpaca.active{border-color:#fcd34d;color:#fef3c7;box-shadow:0 0 8px rgba(252,211,77,.4)}#lang-yanse{border-color:#64748b;color:#94a3b8}#lang-yanse:hover,#lang-yanse.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.3)}#lang-wuxia{border-color:#7f1d1d;color:#fca5a5}#lang-wuxia:hover,#lang-wuxia.active{border-color:#fca5a5;color:#fecaca;box-shadow:0 0 8px rgba(252,165,165,.4)}
/* ── Lang egg triggers ───────────────────────────────────────────── */
.lang-egg{opacity:.25;cursor:pointer;font-size:14px;padding:2px 3px;
  user-select:none;transition:opacity .2s}
.lang-egg:hover{opacity:.7}

/* ── Qapla toast ─────────────────────────────────────────────────── */
.qapla-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:#1a0a0a;border:1px solid #e74c3c;border-radius:10px;
  padding:12px 24px;z-index:2000;font-size:13px;color:#ff6b6b;
  font-family:'JetBrains Mono',monospace;white-space:nowrap;pointer-events:none;
  box-shadow:0 0 20px rgba(231,76,60,.4);
  animation:qapla-in .3s ease,qapla-out .4s ease 2s forwards}
@keyframes qapla-in{from{opacity:0;top:0}to{opacity:1;top:24px}}
@keyframes qapla-out{to{opacity:0;top:0}}

/* ── Missing card ────────────────────────────────────────────────── */
.card-missing{opacity:.55;cursor:default}
.card-missing:hover{border-color:var(--border)!important;transform:none!important;box-shadow:none!important}
.card-warn{margin-top:4px;padding:9px 12px;
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);
  border-radius:8px;font-size:11px;color:#fbbf24;text-align:center;
  font-family:'JetBrains Mono',monospace}

@media(max-width:600px){
  .header,.cards,.hero,.footer{padding-left:20px;padding-right:20px}
  /* 手機版（2026-09-29，UC）：語言／彩蛋圖示列換行，避免主題與工具選單按鈕被推出畫面 */
  .header{flex-wrap:wrap;gap:10px}
  .lang-bar{flex-wrap:wrap}
  .notice{margin-left:20px;margin-right:20px}
  .cards{grid-template-columns:1fr}
}
.global-tip{position:fixed;display:none;z-index:99999;pointer-events:none;background:#1e2035;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:7px 11px;font-size:11px;line-height:1.6;max-width:260px;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 14px rgba(0,0,0,.45);font-weight:400;font-family:inherit;text-transform:none;letter-spacing:0}
/* ── Drop Overlay ─────────────────────────────────────────── */
.drop-overlay{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:rgba(10,14,26,.92);backdrop-filter:blur(6px)}
.drop-overlay.active{display:flex}
.drop-box{border:2px dashed #00d4ff;border-radius:16px;padding:40px 60px;text-align:center;color:#fff;font-size:18px;pointer-events:none;animation:drop-pulse 1.5s ease-in-out infinite}
.drop-box small{display:block;font-size:12px;opacity:.5;margin-top:8px}
@keyframes drop-pulse{0%,100%{border-color:#00d4ff}50%{border-color:#4ade80}}
.drop-result-chip{font-size:15px;padding:10px 24px;border-radius:10px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;text-align:center}
.drop-vendor-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:#0d1b2a;border:1px solid #00d4ff;color:#00d4ff;margin-left:6px}
.drop-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.da-primary{padding:9px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#00d4ff,#4ade80);color:#000;font-weight:700;font-size:13px;cursor:pointer}
.da-secondary{padding:9px 20px;border-radius:8px;border:1px solid #a78bfa;background:none;color:#a78bfa;font-size:13px;cursor:pointer}
.da-secondary:hover{background:#a78bfa;color:#000}
.da-primary:hover{opacity:.85}
.drop-manual-btn{font-size:11px;color:#64748b;cursor:pointer;border:none;background:none;text-decoration:underline dotted;padding:0}
.drop-manual-btn:hover{color:#e2e8f0}
.drop-choices{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
.drop-choices.open{display:flex}
.drop-choices button{padding:7px 16px;border-radius:8px;font-size:12px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer}
.drop-choices button:hover{border-color:#00d4ff;color:#00d4ff}
.drop-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;line-height:1;z-index:1}
.drop-close:hover{color:#e2e8f0}
/* ── 拖放結果除錯面板（task 2，2026-09-23 新增）：預設收合，避免洗版 ─────────── */
.drop-debug-toggle{font-size:11px;color:#64748b;cursor:pointer;border:none;background:none;text-decoration:underline dotted;padding:0}
.drop-debug-toggle:hover{color:#e2e8f0}
.drop-debug-panel{display:none;max-width:520px;width:100%;text-align:left;background:#0d1b2a;border:1px solid #334155;border-radius:10px;padding:10px 14px;font-size:12px;color:#cbd5e1}
.drop-debug-panel.open{display:block}
.drop-debug-panel .ddp-label{font-weight:600;color:#94a3b8;margin:6px 0 4px}
.drop-debug-panel .ddp-label:first-child{margin-top:0}
.drop-debug-panel pre{white-space:pre-wrap;word-break:break-all;background:#020617;border-radius:6px;padding:8px;margin:0;font-family:'JetBrains Mono',monospace;font-size:11px;max-height:160px;overflow:auto}
@media print{
  .header,.cards{page-break-inside:avoid}
  .upload-actions,.lang-bar,.drop-zone{display:none!important}
  body{background:#fff!important;color:#000!important}
  .card{border:1px solid #ccc;box-shadow:none}
  @page{margin:1.5cm}
}
</style>
<script src="toolkit-version.js"></script>
</head>

<header class="header" id="topbar">
  <div class="logo" id="logo-btn" style="cursor:pointer" title="">
    <div class="logo-icon">🌐</div>
    <div class="logo-text">
      <h1 id="h-suite" class="tb-title">Network Analyzer Suite</h1>
      <p id="h-sub">Pure JS · 零伺服器 · 單檔執行</p>
    </div>
  </div>
  <div class="lang-bar lang-switcher">
    <button class="lang-btn active" data-lang="zhTW" onclick="setLang('zhTW')">繁中</button>
    <button class="lang-btn"        data-lang="en"   onclick="setLang('en')">EN</button>
    <button class="lang-btn"        data-lang="ja"   onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" id="lang-klingon" data-lang="tlh"    onclick="setLang('tlh')"    style="display:none">Qo'noS</button>
    <button class="lang-btn" id="lang-pirate"  data-lang="pirate" onclick="setLang('pirate')" style="display:none">☠ Arr</button>
    <button class="lang-btn" id="lang-leet"    data-lang="leet"   onclick="setLang('leet')"   style="display:none">1337</button>
    <button class="lang-btn" id="lang-emoji"   data-lang="emoji"  onclick="setLang('emoji')"  style="display:none">🌈</button>
    <button class="lang-btn" id="lang-uwu"    data-lang="uwu"   onclick="setLang('uwu')"   style="display:none">UwU</button>
    <button class="lang-btn" id="lang-bureau" data-lang="bureau" onclick="setLang('bureau')" style="display:none">公文</button>
    <button class="lang-btn" id="lang-cat"    data-lang="cat"    onclick="setLang('cat')"    style="display:none">nyaa</button>
    <button class="lang-btn" id="lang-bean"   data-lang="bean"   onclick="setLang('bean')"   style="display:none">🥕🫛🌽</button><button class="lang-btn" id="lang-alpaca" data-lang="alpaca" onclick="setLang('alpaca')" style="display:none">🦙咩</button><button class="lang-btn" id="lang-yanse" data-lang="yanse" onclick="setLang('yanse')" style="display:none">😮‍💨 算了</button><button class="lang-btn" id="lang-wuxia" data-lang="wuxia" onclick="setLang('wuxia')" style="display:none">武林</button>
    <span class="lang-egg" id="egg-pirate" title="">⚓</span>
    <span class="lang-egg" id="egg-leet"   title="">💾</span>
    <span class="lang-egg" id="egg-emoji"  title="">🌈</span>
    <span class="lang-egg" id="egg-uwu"    title="">🐾</span>
    <span class="lang-egg" id="egg-bureau" title="">📋</span>
    <span class="lang-egg" id="egg-cat"    title="">🐱</span>
    <span class="lang-egg" id="egg-bean"   title="">🫛</span><span class="lang-egg" id="egg-alpaca">🦙</span><span class="lang-egg" id="egg-yanse">😮‍💨</span><span class="lang-egg" id="egg-wuxia">⚔️</span>
    <button id="theme-btn" onclick="toggleTheme()" title="切換明/暗模式" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 8px;margin-left:auto;line-height:1">☀️</button>
    <button id="tools-nav-btn" onclick="toggleToolsNav(event)" title="切換工具" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 8px;margin-left:6px;line-height:1">🧭</button>

籤、哪些不帶標籤，比 trunk 更有彈性。",'gl.svi':"VLAN 的三層介面（如 Vlan-interface10、interface Vlan10），設定 IP 後成為該 VLAN 的閘道。",'gl.lacp':"把多條實體連線綁成一條邏輯連線（Port-channel、Bridge-Aggregation、LAG），增加頻寬與備援；LACP 是兩端自動協商的協定，static 則不協商。",'gl.vrrp':"讓兩台以上設備共用一個虛擬閘道 IP，主設備故障時由備援接手，終端不需改設定。HSRP 是 Cisco 的同類協定。",'gl.stack':"把多台交換器堆疊成一台來管理，共用一份設定與一個管理位址；各廠牌名稱不同。",'gl.mlag':"兩台獨立的交換器對下游提供同一組鏈路聚合，任一台故障時連線不中斷；兩台各自保有獨立設定，與堆疊不同。",'gl.stp':"生成樹協定，自動阻斷二層迴圈。BPDU Guard 讓接終端的埠一收到交換器訊息就關閉，防止有人私接交換器造成迴圈。",'gl.snoop':"二層防護：DHCP Snooping 只允許信任埠回應 DHCP，DAI 檢查 ARP 是否與租約相符，IP Source Guard 限制埠只能用分配到的位址。",'gl.dot1x':"802.1X 要求接上埠的設備先通過帳號或憑證驗證；Port Security 限制每個埠可學到的 MAC 數量，超過時依設定封鎖或告警。",'gl.acl':"存取控制清單，依來源、目的、協定與埠決定允許或拒絕封包，套用在介面或 VLAN 的進出方向。",'gl.ospf':"動態路由協定。OSPF 用於內部網路，依區域（area）交換路由；BGP 用於不同自治系統（AS）之間，例如與電信業者或資料中心互連。",'gl.lldp':"設備向相鄰設備廣播自己的名稱與埠號，用來整理實體連線與拓樸圖。",'gl.syslog':"Syslog 是設備送出 log 的通用格式（RFC3164、RFC5424）；CEF 是常見的資安事件格式，常包在 Syslog 裡傳送。",'gl.beaconing':"主機以固定間隔反覆連到同一個外部位址，可能是惡意程式定時回報指揮主機；也可能是正常的更新或監控程式，需人工確認。",'gl.ioc':"入侵指標，如已知惡意 IP、網域或檔案雜湊。匯入情資清單後，工具會比對 log 中出現的值；比對只在本機進行。",'gl.mitre':"整理攻擊手法的公開知識庫，每種手法有編號（如 T1558.003）。問題清單會標出對應編號，方便查找說明與處置方式。",'gl.kerberoast':"針對 Windows 網域 Kerberos 的密碼破解手法：攻擊者取得以服務帳號或未要求預先驗證帳號密碼加密的票證，再離線暴力破解；常見訊號是 RC4 加密的票證要求。",'gl.sigma':"通用的偵測規則格式（YAML），可在不同 log 平台共用。log 工具可匯入部分語法作為自訂規則。",'gl.deid':"把設定或 log 中的 IP、主機名稱、帳號、密碼等換成假值後再分享；對照表記錄真假值的對應，留在自己手上，日後可把回覆內容還原。",'gl.golden':"自訂「設定必須包含／不可包含」的規則，逐台檢查是否符合公司標準，例如必須設定 NTP、不可開啟 HTTP 管理。",'hero.step1':"拖放或選擇設定檔／log",'hero.step2':"自動判斷該用哪個工具",'hero.step3':"在瀏覽器內看結果，資料不會上傳",'hub.demo':"看範例",'hub.tags_more':"全部 {n} 種",'hub.tags_less':"收合",'egg.smelly_tea':"（遞過來一杯）只有冰紅茶，可以嗎？",'egg.smelly_roof':"我家有個屋頂，要不要上去曬一下？",'egg.smelly_yarimasu':"做得不錯嘛（やりますねぇ）",'hs.col_history':"歷次",'egg.all_a':"🦙🏆 全部設備都是 A 級！羊駝宣布今天提早下班",'egg.comeback':"🦙 逆轉勝！{name} 從 {old} 分衝到 {new} 分",'egg.vendor_cloudflare':"Cloudflare 的橘色雲，擋在網站前面當門神，被質詢的請求要先證明自己不是機器人",'hs.col_trend':"與上次比較",'hs.trend_label':"趨勢",'hs.trend_score':"分數 {old} → {new}（{delta}）",'hs.trend_issues':"問題 {old} → {   en:{'egg.vendor_ldap':"The company's address-book keeper — every app asks it who you are and whether your password is right (389 plain, 636 encrypted)",'drop.found':"🔍 Detected {vendor} config",'drop.found_tool':"🔍 Looks like input for \"{tool}\"",'gl.vdom_n':"VDOM / vsys",'gl.zone_n':"Zone",'gl.shadow_n':"Shadowed rule",'gl.anyany_n':"Any-any",'gl.nat_n':"NAT / VIP",'gl.hitcount_n':"Hit count",'gl.health_n':"Health score",'gl.vlan_n':"VLAN",'gl.access_n':"Access port",'gl.trunk_n':"Trunk port / Native VLAN",'gl.hybrid_n':"Hybrid port",'gl.svi_n':"SVI",'gl.lacp_n':"LACP",'gl.vrrp_n':"VRRP / HSRP",'gl.stack_n':"Stack (IRF / StackWise / VSF)",'gl.mlag_n':"MLAG / vPC / VLT",'gl.stp_n':"STP / BPDU Guard",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL",'gl.ospf_n':"OSPF / BGP",'gl.lldp_n':"LLDP",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing",'gl.ioc_n':"IOC / Threat intel",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma",'gl.deid_n':"De-identification / mapping table",'gl.golden_n':"Golden baseline",'nav.glossary':"📖 Glossary",'gl.title':"📖 Glossary",'gl.search':"Search terms, e.g. LACP, shadowed, beaconing",'gl.intro':"Plain-language explanations of terms used across the tools; click a term to expand.",'gl.empty':"No matching terms",'gl.vdom':"Splits one firewall into several independent virtual firewalls, each with its own interfaces, rules and routes (FortiGate: VDOM, Palo Alto: vsys). Results are compared per VDOM.",'gl.zone':"Groups interfaces into security zones (trust, untrust, DMZ…); rules are written from a source zone to a destination zone instead of per interface.",'gl.shadow':"Rules are matched top-down; a rule below a broader (or identical) rule can never be hit and is shadowed. It can usually be removed or reordered.",'gl.anyany':"An allow rule whose source, destination and service are all \"any\" — effectively no filtering, and the most common high-risk audit finding.",'gl.nat':"Address translation. Source NAT lets internal hosts go out with a public address; destination NAT (VIP, port forwarding) maps a public address/port to an internal host. Queries can take destination NAT into account.",'gl.hitcount':"How many times traffic matched each rule, counted by the device. Config files do not contain it, so paste the device output separately; rules that stay at 0 are cleanup candidates.",'gl.health':"A 0–100 score and A–F grade computed by deducting points per audit finding (10/5/3 for high/medium/low, at most three findings per check). Use it to track improvement; it does not certify a device as secure.",'gl.vlan':"Splits one switch into several isolated layer-2 segments identified by a VLAN ID (1–4094).",'gl.access':"A port in a single VLAN whose frames carry no VLAN tag; usually connects end devices such as PCs and printers.",'gl.trunk':"A port that carries several VLANs with tagged frames, typically between switches. The native VLAN is the one sent untagged on the trunk and must match on both ends.",'gl.hybrid':"A port mode on Comware, Ruijie, Planet and others that lets you choose per VLAN whether frames are tagged or untagged — more flexible than trunk.",'gl.svi':"The layer-3 interface of a VLAN (e.g. Vlan-interface10, interface Vlan10); with an IP address it becomes the VLAN gateway.",'gl.lacp':"Bundles several physical links into one logical link (Port-channel, Bridge-Aggregation, LAG) for bandwidth and redundancy. LACP negotiates between both ends; static mode does not.",'gl.vrrp':"Lets two or more devices share a virtual gateway IP so a backup takes over when the primary fails, without changing end devices. HSRP is the Cisco equivalent.",'gl.stack':"Combines several switches into one managed unit with a single config and management address; each vendor uses its own name.",'gl.mlag':"Two independent switches present one link aggregation to downstream devices so the link survives either switch failing. Unlike a stack, each switch keeps its own config.",'gl.stp':"Spanning Tree Protocol blocks layer-2 loops automatically. BPDU Guard shuts an edge port as soon as it receives switch BPDUs, preventing loops from rogue switches.",'gl.snoop':"Layer-2 protections: DHCP Snooping only trusts DHCP replies from trusted ports, DAI checks ARP against leases, and IP Source Guard limits a port to its assigned address.",'gl.dot1x':"802.1X requires a device to authenticate (account or certificate) before the port opens; Port Security limits how many MAC addresses a port may learn and blocks or alerts when exceeded.",'gl.acl':"Access control list: allows or denies packets by source, destination, protocol and port, applied inbound or outbound on an interface or VLAN.",'gl.ospf':"Dynamic routing protocols. OSPF is used inside a network and exchanges routes per area; BGP runs between autonomous systems (AS), e.g. with ISPs or between data centers.",'gl.lldp':"Devices advertise their name and port to directly connected neighbors; used to map physical links and draw topology.",'gl.syslog':"Syslog is the common format devices use to send logs (RFC3164, RFC5424); CEF is a widely used security event format often carried inside syslog.",'gl.beaconing':"A host repeatedly contacting the same external address at regular intervals — possibly malware checking in with its command server, or a normal updater/monitor; needs review.",'gl.ioc':"Indicators of compromise such as known-bad IPs, domains or file hashes. After you import an intel list, the tool matches it against values in the logs, locally only.",'gl.mitre':"A public knowledge base of attack techniques, each with an ID (e.g. T1558.003). The issue list shows the matching IDs so you can look up details and responses.",'gl.kerberoast':"Attacks on Windows domain Kerberos: the attacker obtains tickets encrypted with a service account (or an account without pre-authentication) password and cracks them offline. RC4-encrypted ticket requests are a common sign.",'gl.sigma':"A generic detection rule format (YAML) shared across log platforms. The log tool can import a subset as custom rules.",'gl.deid':"Replaces IPs, hostnames, accounts, passwords and similar values with fake ones before sharing. The mapping table records real-to-fake pairs; keep it yourself to restore replies later.",'gl.golden':"Your own rules for what a config must or must not contain, checked device by device against company standards — e.g. NTP must be set, HTTP management must be off.",'hero.step1':"Drop or pick a config / log file",'hero.step2':"The right tool is picked automatically",'hero.step3':"See results in your browser — nothing is uploaded",'hub.demo':"Try sample",'hub.tags_more':"All {n}",'hub.tags_less':"Show less",'egg.smelly_tea':"(hands you a glass) We only had iced tea — is that okay?",'egg.smelly_roof':"So, there's a rooftop at my place… want to go up and get some sun?",'egg.smelly_yarimasu':"Not bad at all (yarimasu nee)",'hs.col_history':"History",'egg.all_a':"🦙🏆 Every device is grade A! The alpaca declares an early finish today",'egg.comeback':"🦙 What a comeback! {name} went from {old} to {new}",'egg.vendor_cloudflare':"Cloudflare's orange cloud stands guard in front of the site — challenged requests must first prove they're not robots",'hs.col_trend':"Change since last run",'hs.trend_label':"Trend",'hs.trend_score':"score {old} → {new} ({delta})",'hs.trend_issues':"issues {old} → {new} ({delta})",'ach.title':"🏆 Alpaca achievements",'ach.unlocked':"🏆 Achievement unlocked: {name}",'ach.first':"First steps",'ach.first_desc':"Used any analysis tool",'ach.all5':"All-round alpaca",'ach.all5_desc':"Used all five tools: firewall, switch, log, anonymizer and generator",'ach.night':"Night owl",'ach.night_desc':"Still analyzing between midnight and 5 a.m.",'ach.weekend':"Weekend warrior",'ach.weekend_desc':"Working on devices over the weekend",'ach.clean':"Model student",'ach.clean_desc':"A device got grade A in the health summary",'egg.april_fools':"🦙 April Fools' Day: every config has been switched to alpaca-friendly mode (just kidding)",'egg.smelly':"Does an easter egg this smelly really need to exist?",'egg.vendor_oci':"The door list on Oracle Cloud subnets — security lists cover a whole subnet, NSGs cover individual VNICs, and both only list what may pass",'egg.vendor_k8snetpol':"Each namespace's door list in the cluster — it only says who may come in, and anything not listed is turned away from the pods it names",'egg.vendor_haproxy':"The load balancer's usher — which server each guest got, how many milliseconds they waited, and whether the doorman turned them away (PR--)",'egg.vendor_duo':"The second doorbell on your phone — when a push you didn't start shows up, it raises its hand and shouts \"fraud!\"",'egg.vendor_k8saudit':"The camera at the cluster's API door — records who read a Secret, who exec'd into a pod and who quietly changed a role binding",'egg.vendor_openvpn':"The open-source VPN's old doorman — which inside address went to whom, who fumbled the password, whose certificate expired, all written down",'egg.vendor_strongswan':"The IPsec tunnel receptionist — both sides state their IDs before entry, and remote guests get a virtual IP on the way in",'egg.vendor_freeradius':"The authentication counter shared by switches and access points — every Login OK and Login incorrect goes in the book",'egg.vendor_gcpfwpolicy':"Google Cloud's newer network-wide rulebook — when it can't decide, it just says goto_next and lets the next level worry about it",'egg.vendor_azfwpolicy':"The rulebook keeper at Azure's front gate — DNAT first, then network rules, application rules last, and the smallest priority number always speaks first",'egg.vendor_cloudfw':"Two guards at the cloud gates — the AWS one speaks in Suricata rules, the Azure one keeps network rules, application rules and threat intel in three separate ledgers",'egg.vendor_squid':"The grand old proxy — every line starts with a Unix timestamp, and every blocked URL gets stamped TCP_DENIED",'egg.vendor_winfw':"Every Windows PC's own doorman — keeps no diary by default, but once switched on, writes every dropped SYN into pfirewall.log",'egg.vendor_linuxauth':"The Linux host's front-desk logbook — who used a password, who used a key, who kept mistyping, and whose identity sudo borrowed",'egg.vendor_gcpfw':"Google's butler with one rulebook for the whole VPC — lowest number asks first, deny wins a tie, and anything unwritten is blocked coming in but allowed going out",'egg.vendor_awsnacl':"AWS's guard at the subnet door — checks rules from the lowest number up, has no memory so even return traffic gets checked again, and the last rule is always the asterisk deny",'egg.vendor_ise':"The doorman at every switch port — plug in and it first asks who you are; no matching certificate or MAC and you're sent to the guest area",'egg.vendor_dhcp':"The office's door-number clerk — hands every newcomer an IP, notes the MAC and hostname, and takes the number back when they leave",'egg.vendor_dns':"The internet's directory-assistance operator — notes who asked for which name, and whether that number even exists",'egg.vendor_cloudaudit':"The auditor for Azure and GCP — who changed a role assignment, who deleted diagnostic settings, who touched a firewall rule, all on the books",'egg.vendor_s3':"The S3 bucket's door clerk — logs who did every GET and PUT and from where, and writes AccessDenied for the ones turned away",'egg.vendor_cef':"ArcSight's veteran clerk — every report is a seven-part CEF:0| memo with the details stuffed into the extension",'egg.vendor_leef':"QRadar's personal interpreter — looks a lot like CEF, but won't talk unless the fields are tab-separated",'egg.vendor_syslog':"The data center's most senior postman — carries letters from RFC3164 to RFC5424 and never reads what's inside",'egg.vendor_json':"The holds-anything storage box — every vendor names fields its own way, so you never know which level the IP hides in",'egg.vendor_winevent':"Windows' duty logger — a 4625 means someone mistyped a password again, and even clearing the audit log leaves a 1102 behind",'egg.vendor_sysmon':"Undercover agent from Sysinternals — who launched what, who touched lsass, who edited a Run key, all in the Operational channel",'egg.vendor_weblog':"The website's sign-in book — Apache, Nginx and IIS each keep their own format; lots of 401s and 403s means someone is knocking",'egg.vendor_suricata':"Open-source IDS patrol — one EVE JSON line per event, handing over the sid whenever a packet looks suspicious",'egg.vendor_zeek':"The quiet network scribe — conn, dns, http and files neatly filed, and every connection gets a uid",'egg.vendor_falcon':"CrowdStrike's falcon circling over endpoints — catches credential theft and brings back the MITRE tactic too",'egg.vendor_defender':"Microsoft 365's gatekeeper — one incident carries several alerts, and it honestly marks FalsePositive when it's wrong",'egg.vendor_amp':"The endpoint guard formerly known as AMP — notes the SHA-256 of anything suspicious and quarantines it on the spot",'egg.vendor_cloudtrail':"AWS's accountant — books every API call, and makes a big entry when someone stops CloudTrail or deletes a key",'egg.vendor_elb':"The load balancer's mailroom — Classic, ALB and NLB take turns, even timing the TLS handshake",'egg.vendor_gcp':"Google Cloud's traffic observer — VPC Flow Logs only watch; firewall rule logs are the ones that write DENIED",'egg.vendor_cloudauth':"Front desk for Entra ID, Okta and Google Workspace — every sign-in gets asked: right password? MFA done? which country?",'egg.vendor_umbrella':"Cloud guard at the DNS door — checks the list before you even connect, and simply answers Blocked",'egg.vendor_netgearsmart':"Same surname as the M4300 but a different family — it solemnly opens with SYSTEM CONFIG FILE ::= BEGIN, then the whole thing is barely sixty lines",'ws.title':"Workspace bundle",'ws.desc':"Export   ja:{'egg.vendor_ldap':"会社全体の名簿係。どのアプリもアカウントとパスワードの確認はまずここに聞く（389 は平文、636 は暗号化）",'drop.found':"🔍 {vendor} の設定を検出しました",'drop.found_tool':"🔍 「{tool}」で扱える内容と判定しました",'gl.vdom_n':"VDOM / vsys（仮想ファイアウォール）",'gl.zone_n':"ゾーン（Zone）",'gl.shadow_n':"シャドウされたルール",'gl.anyany_n':"Any-any ルール",'gl.nat_n':"NAT / VIP（アドレス変換）",'gl.hitcount_n':"ヒット数（Hit count）",'gl.health_n':"健全性スコア",'gl.vlan_n':"VLAN",'gl.access_n':"アクセスポート",'gl.trunk_n':"トランクポート／ネイティブ VLAN",'gl.hybrid_n':"ハイブリッドポート",'gl.svi_n':"SVI（VLAN インターフェース）",'gl.lacp_n':"LACP（リンクアグリゲーション）",'gl.vrrp_n':"VRRP / HSRP（冗長ゲートウェイ）",'gl.stack_n':"スタック（IRF / StackWise / VSF）",'gl.mlag_n':"MLAG / vPC / VLT",'gl.stp_n':"STP / BPDU Guard",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / ポートセキュリティ",'gl.acl_n':"ACL（アクセスリスト）",'gl.ospf_n':"OSPF / BGP（動的ルーティング）",'gl.lldp_n':"LLDP",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"ビーコニング（Beaconing）",'gl.ioc_n':"IOC / 脅威情報",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma ルール",'gl.deid_n':"匿名化／対応表",'gl.golden_n':"ゴールデンベースライン",'nav.glossary':"📖 用語集",'gl.title':"📖 用語集",'gl.search':"用語を検索（例：LACP、シャドウ、beaconing）",'gl.intro':"各ツールでよく使う用語のやさしい説明です。用語をクリックで展開します。",'gl.empty':"該当する用語がありません",'gl.vdom':"1 台のファイアウォールを独立した複数の仮想ファイアウォールに分割する機能。FortiGate では VDOM、Palo Alto では vsys と呼びます。分析は VDOM ごとに行います。",'gl.zone':"インターフェースをセキュリティゾーン（trust・untrust・DMZ など）にまとめ、ルールは「送信元ゾーン→宛先ゾーン」で記述します。",'gl.shadow':"ルールは上から順に照合されるため、より広い（または同じ）ルールの下にあるルールは一致することがなく、シャドウされています。削除か順序変更を検討します。",'gl.anyany':"送信元・宛先・サービスがすべて any の許可ルール。実質的にフィルタリングがなく、監査で最もよく指摘される高リスク項目です。",'gl.nat':"アドレス変換。送信元 NAT は内部アドレスを外部アドレスで通信させ、宛先 NAT（VIP・ポート転送）は外部アドレスとポートを内部ホストへ転送します。照会では宛先 NAT を考慮できます。",'gl.hitcount':"各ルールにトラフィックが一致した回数（機器側の統計）。設定ファイルには含まれないため機器の出力を別途貼り付けます。長期間 0 のルールは整理候補です。",'gl.health':"監査結果ごとに減点して算出する 0～100 点と A～F 評価（高・中・低リスクで 10・5・3 点、1 項目あたり最大 3 件）。改善の追跡用で、安全性を保証するものではありません。",'gl.vlan':"1 台のスイッチ上に互いに分離されたレイヤー 2 セグメントを作る仕組み。VLAN ID（1～4094）で区別します。",'gl.access':"1 つの VLAN だけに属し、タグなしでフレームを送受信するポート。PC やプリンターなどの端末を接続します。",'gl.trunk':"複数の VLAN をタグ付きで運ぶポート。主にスイッチ間で使います。ネイティブ VLAN は trunk 上でタグなしで送られる VLAN で、両端で一致させる必要があります。",'gl.hybrid':"Comware・Ruijie・Planet などのポートモード。VLAN ごとにタグ付き／タグなしを指定でき、trunk より柔軟です。",'gl.svi':"VLAN のレイヤー 3 インターフェース（Vlan-interface10、interface Vlan10 など）。IP を設定するとその VLAN のゲートウェイになります。",'gl.lacp':"複数の物理リンクを 1 本の論理リンク（Port-channel・Bridge-Aggregation・LAG）に束ね、帯域と冗長性を高めます。LACP は両端で自動ネゴシエーションし、static はしません。",'gl.vrrp':"複数の機器で仮想ゲートウェイ IP を共有し、主機器の障害時にバックアップが引き継ぎます。端末側の設定変更は不要です。HSRP は Cisco の同種プロトコルです。",'gl.stack':"複数のスイッチを 1 台として管理する仕組み。設定と管理アドレスを共有し、ベンダーごとに名称が異なります。",'gl.mlag':"独立した 2 台のスイッチが下流機器に 1 つのリンクアグリゲーションを提供し、どちらかが故障しても通信を維持します。スタックと異なり設定はそれぞれ独立です。",'gl.stp':"スパニングツリープロトコル。レイヤー 2 ループを自動的に遮断します。BPDU Guard は端末用ポートで BPDU を受信すると即座にポートを停止し、不正なスイッチ接続によるループを防ぎます。",'gl.snoop':"レイヤー 2 の防御機能。DHCP Snooping は信頼ポートからの DHCP 応答のみ許可し、DAI は ARP をリース情報と照合し、IP Source Guard はポートで使える IP を割り当て済みのものに限定します。",'gl.dot1x':"802.1X はポートに接続した機器にアカウントや証明書による認証を求めます。Port Security はポートで学習できる MAC アドレス数を制限し、超過時に遮断または警告します。",'gl.acl':"アクセスコントロールリスト。送信元・宛先・プロトコル・ポートでパケットを許可／拒否し、インターフェースや VLAN の入出力方向に適用します。",'gl.ospf':"動的ルーティングプロトコル。OSPF は組織内でエリア単位に経路を交換し、BGP は自律システム（AS）間、たとえば ISP やデータセンター間で使います。",'gl.lldp':"機器が隣接機器に自分の名前とポート番号を通知するプロトコル。物理接続やトポロジー図の整理に使います。",'gl.syslog':"Syslog は機器がログを送る一般的な形式（RFC3164・RFC5424）、CEF はよく使われるセキュリティイベント形式で、Syslog に包んで送られることが多いです。",'gl.beaconing':"ホストが一定間隔で同じ外部アドレスに繰り返し接続する挙動。マルウェアの C2 通信の可能性もあれば正常な更新・監視の場合もあり、確認が必要です。",'gl.ioc':"侵害の痕跡（既知の悪性 IP・ドメイン・ファイルハッシュなど）。脅威情報リストを取り込むとログ内の値と照合します。照合はローカルのみで行います。",'gl.mitre':"攻撃手法を整理した公開ナレッジベース。手法ごとに ID（例：T1558.003）があり、問題一覧に対応する ID を表示します。",'gl.kerberoast':"Windows ドメインの Kerberos を狙うパスワード解析手法。サービスアカウント（または事前認証不要のアカウント）のパスワードで暗号化されたチケットを入手し、オフラインで解読します。RC4 暗号のチケット要求がよくある兆候です。",'gl.sigma':"ログ基盤をまたいで使える汎用の検知ルール形式（YAML）。ログツールでは一部の構文をカスタムルールとして取り込めます。",'gl.deid':"設定やログの IP・ホスト名・アカウント・パスワードなどを偽の値に置き換えてから共有します。対応表は実値と偽値の対応を記録したもので、手元に保管して後で復元に使います。",'gl.golden':"設定に「必ず含む／含んではならない」内容を独自に定義し、機器ごとに ンサーの郵便室。Classic、ALB、NLB が交代で現れ、TLS ハンドシェイクの時間まで記録",'egg.vendor_gcp':"Google Cloud の通信観測員。VPC Flow Logs は見るだけ、DENIED と書くのはファイアウォールルールのログ",'egg.vendor_cloudauth':"Entra ID・Okta・Google Workspace の受付。ログインのたびに「パスワードは正しい？MFA は？どの国から？」と確認",'egg.vendor_umbrella':"DNS の入口に立つクラウド警備員。接続前にリストを確認し、ダメなら Blocked と一言",'egg.vendor_netgearsmart':"M4300 と同じ苗字でも別の家の弟分。冒頭で SYSTEM CONFIG FILE ::= BEGIN と厳かに宣言するのに、中身は 60 行ちょっと",'ws.title':"ワークスペースのまとめ",'ws.desc':"各ツールがこのブラウザに保存している設定（ログの絞り込み条件とカスタムルール、受容リスク、命名ルール、期限キーワード、ゴールデンテンプレート、監査ワークシート、健全性履歴など）を 1 つのファイルに書き出し、PC の移行や引き継ぎ時にまとめて復元します。",'ws.export':"ワークスペースを書き出す",'ws.import':"ワークスペースを復元",'ws.include_content':"設定内容を含む項目も含める：ジェネレーターのテンプレートと下書き（IP、アカウント、パスワードを含む可能性あり）、添付ファイル",'ws.attach':"添付ファイル（匿名化対応表、ログのベースラインなど）：",'ws.attach_hint':"対応表には元の IP やホスト名などの機密情報が含まれます。信頼できる経路でのみ受け渡してください",'ws.exported':"設定 {n} 件、添付ファイル {a} 件を書き出しました",'ws.empty':"このブラウザには書き出せる設定がまだありません",'ws.invalid':"ワークスペースファイルではないか、形式が正しくありません",'ws.preview':"ワークスペースファイル（{time}）：設定 {n} 件、添付ファイル {a} 件。復元すると次の項目を上書きします：",'ws.restore':"復元する",'ws.restored':"設定 {n} 件を復元しました。各ツールを開き直すと反映されます",'ws.attach_dl':"添付ファイル（ダウンロードして対応するツールで読み込み）：",'ws.skipped':"不明または形式が正しくない {n} 件をスキップしました",'ws.group_settings':"設定",'ws.group_history':"履歴",'ws.group_content':"設定内容",'ws.tool_common':"共通",'egg.vendor_efos':"Broadcom チップ育ちの FASTPATH 一族の古株。NetApp クラスタースイッチとして呼ばれることが多く、LAG まで 1/1 という番地に住んでいる",'egg.vendor_tnsr':"pfSense の兄弟で VPP データプレーンに住む高速派。ACL はインターフェースに掛けて一つずつ照合、VPF は許可しなかったものをすべて遮断",'egg.vendor_voss':"Avaya 生まれで Extreme に嫁いだ Fabric 派 — VLAN には必ず I-SID、キャンパス全体を SPB 一本で走らせる",'egg.vendor_wlc':"AP の群れをまとめる交換台 — どの SSID にもまず聞く：暗号化は？PMF は？",'egg.vendor_h3cfw':"Comware の本家育ち — どのルールもまずゾーンを聞く：Trust から来て Untrust へ行くの？",'egg.vendor_h3c':"HPE と同じ流れをくむ Comware の本家 — コマンドはまったく同じなのに、新機能はいつも先に届く",'egg.vendor_meraki':"クラウドのダッシュボードに住む緑の門番 — 保存ボタンはなく、API に聞けばルール一覧を丸ごと渡してくれる",'egg.vendor_awplus':"日本生まれの堅実派 — コマンドは IOS 風なのにポート名は port1.0.1、範囲指定で一気に設定できる",'egg.vendor_cumulus':"Linux の上着を着たデータセンタースイッチ — 設定は YAML、ポ s a public address/port to an internal host. Queries can take destination NAT into account. Qapla'!",'gl.hitcount':"How many times traffic matched each rule, counted by the device. Config files do not contain it, so paste the device output separately; rules that stay at 0 are cleanup candidates. Qapla'!",'gl.health':"A 0–100 score and A–F grade computed by deducting points per audit finding (10/5/3 for high/medium/low, at most three findings per check). Use it to track improvement; it does not certify a device as secure. Qapla'!",'gl.vlan':"Splits one switch into several isolated layer-2 segments identified by a VLAN ID (1–4094). Qapla'!",'gl.access':"A port in a single VLAN whose frames carry no VLAN tag; usually connects end devices such as PCs and printers. Qapla'!",'gl.trunk':"A port that carries several VLANs with tagged frames, typically between switches. The native VLAN is the one sent untagged on the trunk and must match on both ends. Qapla'!",'gl.hybrid':"A port mode on Comware, Ruijie, Planet and others that lets you choose per VLAN whether frames are tagged or untagged — more flexible than trunk. Qapla'!",'gl.svi':"The layer-3 interface of a VLAN (e.g. Vlan-interface10, interface Vlan10); with an IP address it becomes the VLAN gateway. Qapla'!",'gl.lacp':"Bundles several physical links into one logical link (Port-channel, Bridge-Aggregation, LAG) for bandwidth and redundancy. LACP negotiates between both ends; static mode does not. Qapla'!",'gl.vrrp':"Lets two or more devices share a virtual gateway IP so a backup takes over when the primary fails, without changing end devices. HSRP is the Cisco equivalent. Qapla'!",'gl.stack':"Combines several switches into one managed unit with a single config and management address; each vendor uses its own name. Qapla'!",'gl.mlag':"Two independent switches present one link aggregation to downstream devices so the link survives either switch failing. Unlike a stack, each switch keeps its own config. Qapla'!",'gl.stp':"Spanning Tree Protocol blocks layer-2 loops automatically. BPDU Guard shuts an edge port as soon as it receives switch BPDUs, preventing loops from rogue switches. Qapla'!",'gl.snoop':"Layer-2 protections: DHCP Snooping only trusts DHCP replies from trusted ports, DAI checks ARP against leases, and IP Source Guard limits a port to its assigned address. Qapla'!",'gl.dot1x':"802.1X requires a device to authenticate (account or certificate) before the port opens; Port Security limits how many MAC addresses a port may learn and blocks or alerts when exceeded. Qapla'!",'gl.acl':"Access control list: allows or denies packets by source, destination, protocol and port, applied inbound or outbound on an interface or VLAN. Qapla'!",'gl.ospf':"Dynamic routing protocols. OSPF is used inside a network and exchanges routes per area; BGP runs between autonomous systems (AS), e.g. with ISPs or between data centers. Qapla'!",'gl.lldp':"Devices advertise their name and port to directly connected neighbors; used to map physical links and draw topology. Qapla'!",'gl.syslog':"Syslog is the common format devices use to send logs (RFC3164, RFC5424); CEF is a widely used security event format often carried inside syslog. Qapla'!",'gl.beaconing':"A host repeatedly contacting the same external address at regular intervals — possibly malware checking in with its command server, or a normal updater/monitor; needs review. Qapla'!",'gl.ioc':"Indicators of compromise such as known-bad IPs, domains or file hashes. After you import an intel list, the tool matches it against values in the logs, locally only. Qapla'!",'gl.mitre':"A public knowledge base of attack techniques, each with an ID (e.g. T1558.003). The issue list shows the matching IDs so you can look up details and responses. Qapla'!",'gl.kerberoast':"Attacks on Windows domain Kerberos: the attacker obtains tickets encrypted with a service account (or an account without pre-authentication) password and cracks them offline. RC4-encrypted ti   pirate:{'egg.vendor_ldap':"Th' ship's roster keeper — every mate's name an' secret word be checked here",'drop.found':"🔍 Spotted {vendor} rigging, arr",'drop.found_tool':"🔍 This cargo belongs to \"{tool}\", matey",'gl.vdom_n':"VDOM / vsys",'gl.zone_n':"Zone",'gl.shadow_n':"Shadowed rule",'gl.anyany_n':"Any-any",'gl.nat_n':"NAT / VIP",'gl.hitcount_n':"Hit count",'gl.health_n':"Health score",'gl.vlan_n':"VLAN",'gl.access_n':"Access port",'gl.trunk_n':"Trunk port / Native VLAN",'gl.hybrid_n':"Hybrid port",'gl.svi_n':"SVI",'gl.lacp_n':"LACP",'gl.vrrp_n':"VRRP / HSRP",'gl.stack_n':"Stack (IRF / StackWise / VSF)",'gl.mlag_n':"MLAG / vPC / VLT",'gl.stp_n':"STP / BPDU Guard",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL",'gl.ospf_n':"OSPF / BGP",'gl.lldp_n':"LLDP",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing",'gl.ioc_n':"IOC / Threat intel",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma",'gl.deid_n':"De-identification / mapping table",'gl.golden_n':"Golden baseline",'nav.glossary':"📖 Word Chest",'gl.title':"📖 Pirate's Word Chest",'gl.search':"Search the chest, matey (LACP, shadowed…)",'gl.intro':"Words o' the seven seas, explained plain. Click to open, arr!",'gl.empty':"No such word in the chest, arr",'gl.vdom':"Arr: Splits one firewall into several independent virtual firewalls, each with its own interfaces, rules and routes (FortiGate: VDOM, Palo Alto: vsys). Results are compared per VDOM.",'gl.zone':"Arr: Groups interfaces into security zones (trust, untrust, DMZ…); rules are written from a source zone to a destination zone instead of per interface.",'gl.shadow':"Arr: Rules are matched top-down; a rule below a broader (or identical) rule can never be hit and is shadowed. It can usually be removed or reordered.",'gl.anyany':"Arr: An allow rule whose source, destination and service are all \"any\" — effectively no filtering, and the most common high-risk audit finding.",'gl.nat':"Arr: Address translation. Source NAT lets internal hosts go out with a public address; destination NAT (VIP, port forwarding) maps a public address/port to an internal host. Queries can take destination NAT into account.",'gl.hitcount':"Arr: How many times traffic matched each rule, counted by the device. Config files do not contain it, so paste the device output separately; rules that stay at 0 are cleanup candidates.",'gl.health':"Arr: A 0–100 score and A–F grade computed by deducting points per audit finding (10/5/3 for high/medium/low, at most three findings per check). Use it to track improvement; it does not certify a device as secure.",'gl.vlan':"Arr: Splits one switch into several isolated layer-2 segments identified by a VLAN ID (1–4094).",'gl.access':"Arr: A port in a single VLAN whose frames carry no VLAN tag; usually connects end devices such as PCs and printers.",'gl.trunk':"Arr: A port that carries several VLANs with tagged frames, typically between switches. The native VLAN is the one sent untagged on the trunk and must match on both ends.",'gl.hybrid':"Arr: A port mode on Comware, Ruijie, Planet and others that lets you choose per VLAN whether frames are tagged or untagged — more flexible than trunk.",'gl.svi':"Arr: The layer-3 interface of a VLAN (e.g. Vlan-interface10, interface Vlan10); with an IP address it becomes the VLAN gateway.",'gl.lacp':"Arr: Bundles several physical links into one logical link (Port-channel, Bridge-Aggregation, LAG) for bandwidth and redundancy. LACP negotiates between both ends; static mode does not.",'gl.vrrp':"Arr: Lets two or more devices share a virtual gateway IP so a backup takes over when the primary fails, without changing end devices. HSRP is the Cisco equivalent.",'gl.stack':"Arr: Combines several switches into one managed unit with a single config and management address; each vendor uses its own name.",'gl.mlag':"Arr: Two independent switches present one link aggregation to downstream devices so the link survives either switch failing. Unlike a stack, each switch keeps its own config.",'gl.stp':"Arr: Spanning Tree Protocol blocks layer-2 loops automatically. BPDU Guard shuts an edge port as soon as it receives switch BPDUs, preventing loops from rogue switches.",'gl.snoop':"Arr: Layer-2 protections: DHCP Snooping only trusts DHCP replies from trusted ports, DAI checks ARP against leases, and IP Source Guard limits a port to its assigned address.",'gl.dot1x':"Arr: 802.1X requires a device to authenticate (account or certificate) before the port opens; Port Security limits how many MAC addresses a port may learn and blocks or alerts when exceeded.",'gl.acl':"Arr: Access control list: allows or denies packets by source, destination, protocol and port, applied inbound or outbound on an interface or VLAN.",'gl.ospf':"Arr: Dynamic routing protocols. OSPF is used inside a network and exchanges routes per area; BGP runs between autonomous systems (AS), e.g. with ISPs or between data centers.",'gl.lldp':"Arr: Devices advertise their name and port to directly connected neighbors; used to map physical links and draw topology.",'gl.syslog':"Arr: Syslog is the common format devices use to send logs (RFC3164, RFC5424); CEF is a widely used security event format often carried inside syslog.",'gl.beaconing':"Arr: A host repeatedly contacting the same external address at regular intervals — possibly malware checking in with its command server, or a normal updater/monitor; needs review.",'gl.ioc':"Arr: Indicators of compromise such as known-bad IPs, domains or file hashes. After you import an intel list, the tool matches it against values in the logs, locally only.",'gl.mitre':"Arr: A public knowledge base of attack techniques, each with an ID (e.g. T1558.003). The issue list shows the matching IDs so you can look up details and responses.",'gl.kerberoast':"Arr: Attacks on Windows domain Kerberos: the attacker obtains tickets encrypted with a service account (or an account without pre-authentication) password and cracks them offline. RC4-encrypted ticket requests are a common sign.",'gl.sigma':"Arr: A generic detection rule format (YAML) shared across log platforms. The log tool can import a subset as custom rules.",'gl.deid':"Arr: Replaces IPs, hostnames, accounts, passwords and similar values with fake ones before sharing. The mapping table records real-to-fake pairs; keep it yourself to restore replies later.",'gl.golden':"Arr: Your own rules for what a config must or must not contain, checked device by device against company standards — e.g. NTP must be set, HTTP management must be off.",'hero.step1':"Toss yer config or log aboard",'hero.step2':"We pick the right ship fer ye",'hero.step3':"Read the loot right here — nothin' leaves port",'hub.demo':"Peek at a sample",'hub.tags_more':"All {n} flags",'hub.tags_less':"Stow 'em",'egg.smelly_tea':"(slides ye a mug) Only iced tea in the galley, matey — that do?",'egg.smelly_roof':"Me house has a rooftop deck, savvy… fancy catchin' some sun?",'egg.smelly_yarimasu':"Well done, ye scallywag (yarimasu nee)",'hs.col_history':"Ship's log",'egg.all_a':"🦙🏆 Every ship scores an A! Shore leave for the whole crew, arrr",'egg.comeback':"🦙 What a comeback! {name} climbed from {old} to {new}",'egg.vendor_cloudflare':"Cloudflare's orange cloud guards the harbor — any ship it challenges must prove it ain't a clockwork crew",'hs.col_trend':"Since last voyage",'hs.trend_label':"Wind",'hs.trend_score':"booty {old} → {new} ({delta})",'hs.trend_issues':"leaks {old} → {new} ({delta})",'ach.title':"🏆 Alpaca booty",'ach.unlocked':"🏆 Arr, ye earned: {name}",'ach.first':"First steps",'ach.first_desc':"Used any analysis tool",'ach.all5':"All-round alpaca",'ach.all5_desc':"Used all five tools: firewall, switch, log, anonymizer and generator",'ach.night':"Night watch",'ach.night_desc':"Still analyzing between midnight and 5 a.m.",'ach.weekend':"Weekend warrior",'ach.weekend_desc':"Working on devices over the   emoji:{'egg.vendor_ldap':"📒👥🔑 389🔓 636🔒",'drop.found':"🔍 ✅ {vendor} 📄",'drop.found_tool':"🔍 ➡️ {tool}",'gl.vdom_n':"VDOM / vsys",'gl.zone_n':"Zone",'gl.shadow_n':"Shadowed rule",'gl.anyany_n':"Any-any",'gl.nat_n':"NAT / VIP",'gl.hitcount_n':"Hit count",'gl.health_n':"Health score",'gl.vlan_n':"VLAN",'gl.access_n':"Access port",'gl.trunk_n':"Trunk port / Native VLAN",'gl.hybrid_n':"Hybrid port",'gl.svi_n':"SVI",'gl.lacp_n':"LACP",'gl.vrrp_n':"VRRP / HSRP",'gl.stack_n':"Stack (IRF / StackWise / VSF)",'gl.mlag_n':"MLAG / vPC / VLT",'gl.stp_n':"STP / BPDU Guard",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL",'gl.ospf_n':"OSPF / BGP",'gl.lldp_n':"LLDP",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing",'gl.ioc_n':"IOC / Threat intel",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma",'gl.deid_n':"De-identification / mapping table",'gl.golden_n':"Golden baseline",'nav.glossary':"📖🔤",'gl.title':"📖🔤",'gl.search':"🔍 LACP / 🌑 / 📡",'gl.intro':"💬➡️🙂 👆📂",'gl.empty':"🤷",'gl.vdom':"💡 Splits one firewall into several independent virtual firewalls, each with its own interfaces, rules and routes (FortiGate: VDOM, Palo Alto: vsys). Results are compared per VDOM.",'gl.zone':"💡 Groups interfaces into security zones (trust, untrust, DMZ…); rules are written from a source zone to a destination zone instead of per interface.",'gl.shadow':"💡 Rules are matched top-down; a rule below a broader (or identical) rule can never be hit and is shadowed. It can usually be removed or reordered.",'gl.anyany':"💡 An allow rule whose source, destination and service are all \"any\" — effectively no filtering, and the most common high-risk audit finding.",'gl.nat':"💡 Address translation. Source NAT lets internal hosts go out with a public address; destination NAT (VIP, port forwarding) maps a public address/port to an internal host. Queries can take destination NAT into account.",'gl.hitcount':"💡 How many times traffic matched each rule, counted by the device. Config files do not contain it, so paste the device output separately; rules that stay at 0 are cleanup candidates.",'gl.health':"💡 A 0–100 score and A–F grade computed by deducting points per audit finding (10/5/3 for high/medium/low, at most three findings per check). Use it to track improvement; it does not certify a device as secure.",'gl.vlan':"💡 Splits one switch into several isolated layer-2 segments identified by a VLAN ID (1–4094).",'gl.access':"💡 A port in a single VLAN whose frames carry no VLAN tag; usually connects end devices such as PCs and printers.",'gl.trunk':"💡 A port that carries several VLANs with tagged frames, typically between switches. The native VLAN is the one sent untagged on the trunk and must match on both ends.",'gl.hybrid':"💡 A port mode on Comware, Ruijie, Planet and others that lets you choose per VLAN whether frames are tagged or untagged — more flexible than trunk.",'gl.svi':"💡 The layer-3 interface of a VLAN (e.g. Vlan-interface10, interface Vlan10); with an IP address it becomes the VLAN gateway.",'gl.lacp':"💡 Bundles several physical links into one logical link (Port-channel, Bridge-Aggregation, LAG) for bandwidth and redundancy. LACP negotiates between both ends; static mode does not.",'gl.vrrp':"💡 Lets two or more devices share a virtual gateway IP so a backup takes over when the primary fails, without changing end devices. HSRP is the Cisco equivalent.",'gl.stack':"💡 Combines several switches into one managed unit with a single config and management address; each vendor uses its own name.",'gl.mlag':"💡 Two independent switches present one link aggregation to downstream devices so the link survives either switch failing. Unlike a stack, each switch keeps its own config.",'gl.stp':"💡 Spanning Tree Protocol blocks layer-2 loops automatically. BPDU Guard shuts an edge port as soon as it receives switch BPDUs, preventing loops from rogue switches.",'gl.snoop':"💡 Layer-2 protections: DHCP Snooping only trusts DHCP replies from trusted ports, DAI checks ARP against leases, and IP Source Guard limits a port to its assigned address.",'gl.dot1x':"💡 802.1X requires a device to authenticate (account or certificate) before the port opens; Port Security limits how many MAC addresses a port may learn and blocks or alerts when exceeded.",'gl.acl':"💡 Access control list: allows or denies packets by source, destination, protocol and port, applied inbound or outbound on an interface or VLAN.",'gl.ospf':"💡 Dynamic routing protocols. OSPF is used inside a network and exchanges routes per area; BGP runs between autonomous systems (AS), e.g. with ISPs or between data centers.",'gl.lldp':"💡 Devices advertise their name and port to directly connected neighbors; used to map physical links and draw topology.",'gl.syslog':"💡 Syslog is the common format devices use to send logs (RFC3164, RFC5424); CEF is a widely used security event format often carried inside syslog.",'gl.beaconing':"💡 A host repeatedly contacting the same external address at regular intervals — possibly malware checking in with its command server, or a normal updater/monitor; needs review.",'gl.ioc':"💡 Indicators of compromise such as known-bad IPs, domains or file hashes. After you import an intel list, the tool matches it against values in the logs, locally only.",'gl.mitre':"💡 A public knowledge base of attack techniques, each with an ID (e.g. T1558.003). The issue list shows the matching IDs so you can look up details and responses.",'gl.kerberoast':"💡 Attacks on Windows domain Kerberos: the attacker obtains tickets encrypted with a service account (or an account without pre-authentication) password and cracks them offline. RC4-encrypted ticket requests are a common sign.",'gl.sigma':"💡 A generic detection rule format (YAML) shared across log platforms. The log tool can import a subset as custom rules.",'gl.deid':"💡 Replaces IPs, hostnames, accounts, passwords and similar values with fake ones before sharing. The mapping table records real-to-fake pairs; keep it yourself to restore replies later.",'gl.golden':"💡 Your own rules for what a config must or must not contain, checked device by device against company standards — e.g. NTP must be set, HTTP management must be off.",'hero.step1':"📂➡️",'hero.step2':"🤖🔍🧰",'hero.step3':"📊🖥️🔒",'hub.demo':"👀🧪",'hub.tags_more':"➕{n}",'hub.tags_less':"🔼",'egg.smelly_tea':"🧊🍵❓🙂",'egg.smelly_roof':"🏠⬆️☀️😎❓",'egg.smelly_yarimasu':"👍😏 やりますねぇ",'hs.col_history':"📜",'egg.all_a':"🦙🏆🅰️🅰️🅰️🎉",'egg.comeback':"🦙📈 {name} {old}➡️{new} 🔥",'egg.vendor_cloudflare':"🟠☁️🛡️🌐 · 🤖❓",'hs.col_trend':"📈📉",'hs.trend_label':"📈",'hs.trend_score':"💯 {old} → {new} ({delta})",'hs.trend_issues':"⚠️ {old} → {new} ({delta})",'ach.title':"🏆🦙",'ach.unlocked':"🏆✨ {name}",'ach.first':"First steps",'ach.first_desc':"Used any analysis tool",'ach.all5':"All-round alpaca",'ach.all5_desc':"Used all five tools: firewall, switch, log, anonymizer and generator",'ach.night':"Night owl",'ach.night_desc':"Still analyzing between midnight and 5 a.m.",'ach.weekend':"Weekend warrior",'ach.weekend_desc':"Working on devices over the weekend",'ach.clean':"Model student",'ach.clean_desc':"A device got grade A in the health summary",'egg.april_fools':"🦙🃏📅4️⃣/1️⃣😜",'egg.smelly':"🥚💨🤢❓🤔",'egg.vendor_oci':"🔴☁️📋✅",'egg.vendor_k8snetpol':"☸️📋✅🚫",'egg.vendor_haproxy':"⚖️🚦📒",'egg.vendor_duo':"📱🔔✅🚨",'egg.vendor_k8saudit':"☸️📹🔐📦",'egg.vendor_openvpn':"🔐🚇📝🎟️",'egg.vendor_strongswan':"🛡️🤝🪪🌐",'egg.vendor_freeradius':"📡🪪✅❌",'egg.vendor_gcpfwpolicy':"☁️📖⏭️",'egg.vendor_azfwpolicy':"☁️📜1️⃣DNAT2️⃣🌐3️⃣🧩",'egg.vendor_cloudfw':"☁️🧱🦁📒📒📒",'egg.vendor_squid':"🦑🌐⏱️🚫",'egg.vendor_winfw':"🪟🧱🚫📝",'egg.vendor_linuxauth':"🐧🚪🔑📝🦸",'egg.vendor_gcpfw':"☁️📖🔢⬇️🚫✅",'egg.vendor_awsnacl':"🚪🔢🔁⭐🚫",'egg.vendor_ise':"🔌🚪👮❓🪪",'egg.vendor_dhcp':"🚪🔢➡️💻📝🔙",'egg.vendor_dns':"📒☎️🌐❓➡️📍",'egg.vendor_cloudaudit':"☁️📒 👑🔑 · 🧱✏️ · 🗑️📡",'egg.vendor_s3':"🪣📒 GET PUT 👤🌐 · ⛔ AccessDenied",'egg.vendor_cef':"📜 CEF:0| 7️⃣ · 📎 mware、Ruijie、Planet 等廠牌的埠模式，可分別指定哪些 VLAN 帶標籤、哪些不帶標籤，比 trunk 更有彈性。",'gl.svi':"釋義：VLAN 的三層介面（如 Vlan-interface10、interface Vlan10），設定 IP 後成為該 VLAN 的閘道。",'gl.lacp':"釋義：把多條實體連線綁成一條邏輯連線（Port-channel、Bridge-Aggregation、LAG），增加頻寬與備援；LACP 是兩端自動協商的協定，static 則不協商。",'gl.vrrp':"釋義：讓兩台以上設備共用一個虛擬閘道 IP，主設備故障時由備援接手，終端不需改設定。HSRP 是 Cisco 的同類協定。",'gl.stack':"釋義：把多台交換器堆疊成一台來管理，共用一份設定與一個管理位址；各廠牌名稱不同。",'gl.mlag':"釋義：兩台獨立的交換器對下游提供同一組鏈路聚合，任一台故障時連線不中斷；兩台各自保有獨立設定，與堆疊不同。",'gl.stp':"釋義：生成樹協定，自動阻斷二層迴圈。BPDU Guard 讓接終端的埠一收到交換器訊息就關閉，防止有人私接交換器造成迴圈。",'gl.snoop':"釋義：二層防護：DHCP Snooping 只允許信任埠回應 DHCP，DAI 檢查 ARP 是否與租約相符，IP Source Guard 限制埠只能用分配到的位址。",'gl.dot1x':"釋義：802.1X 要求接上埠的設備先通過帳號或憑證驗證；Port Security 限制每個埠可學到的 MAC 數量，超過時依設定封鎖或告警。",'gl.acl':"釋義：存取控制清單，依來源、目的、協定與埠決定允許或拒絕封包，套用在介面或 VLAN 的進出方向。",'gl.ospf':"釋義：動態路由協定。OSPF 用於內部網路，依區域（area）交換路由；BGP 用於不同自治系統（AS）之間，例如與電信業者或資料中心互連。",'gl.lldp':"釋義：設備向相鄰設備廣播自己的名稱與埠號，用來整理實體連線與拓樸圖。",'gl.syslog':"釋義：Syslog 是設備送出 log 的通用格式（RFC3164、RFC5424）；CEF 是常見的資安事件格式，常包在 Syslog 裡傳送。",'gl.beaconing':"釋義：主機以固定間隔反覆連到同一個外部位址，可能是惡意程式定時回報指揮主機；也可能是正常的更新或監控程式，需人工確認。",'gl.ioc':"釋義：入侵指標，如已知惡意 IP、網域或檔案雜湊。匯入情資清單後，工具會比對 log 中出現的值；比對只在本機進行。",'gl.mitre':"釋義：整理攻擊手法的公開知識庫，每種手法有編號（如 T1558.003）。問題清單會標出對應編號，方便查找說明與處置方式。",'gl.kerberoast':"釋義：針對 Windows 網域 Kerberos 的密碼破解手法：攻擊者取得以服務帳號或未要求預先驗證帳號密碼加密的票證，再離線暴力破解；常見訊號是 RC4 加密的票證要求。",'gl.sigma':"釋義：通用的偵測規則格式（YAML），可在不同 log 平台共用。log 工具可匯入部分語法作為自訂規則。",'gl.deid':"釋義：把設定或 log 中的 IP、主機名稱、帳號、密碼等換成假值後再分享；對照表記錄真假值的對應，留在自己手上，日後可把回覆內容還原。",'gl.golden':"釋義：自訂「設定必須包含／不可包含」的規則，逐台檢查是否符合公司標準，例如必須設定 NTP、不可開啟 HTTP 管理。",'hero.step1':"檢附設定檔或 log",'hero.step2':"由本處自動分案至承辦工具",'hero.step3':"於本機瀏覽器內核閱，資料不外送",'hub.demo':"調閱範本",'hub.tags_more':"全部 {n} 項",'hub.tags_less':"收合附件",'egg.smelly_tea':"經查本單位茶水間僅存冰紅茶一項，是否可以，請示",'egg.smelly_roof':"本單位頂樓開放日照作業，是否前往，請於簽呈內勾選",'egg.smelly_yarimasu':"經查辦理情形良好，予以肯定（やりますねぇ）",'hs.col_history':"歷次考評",'egg.all_a':"🦙🏆 本次考評全數設備評定 A 級，准予今日提早下班",'egg.comeback':"🦙 {name} 考評由 {old} 分提升至 {new} 分，予以嘉獎",'egg.vendor_cloudflare':"本單位於網站前端設置橘色雲門禁，受質詢之請求應先檢附非機器人證明"   cat:{'egg.vendor_ldap':"記得每隻貓名字和暗號的名冊管理員喵",'drop.found':"🔍 聞到 {vendor} 設定的味道了喵",'drop.found_tool':"🔍 這個要給「{tool}」喵~",'gl.vdom_n':"VDOM / vsys（虛擬防火牆）",'gl.zone_n':"Zone（安全區域）",'gl.shadow_n':"遮蔽規則（Shadowed rule）",'gl.anyany_n':"Any-any 全開規則",'gl.nat_n':"NAT / VIP（位址轉換）",'gl.hitcount_n':"規則命中數（Hit count）",'gl.health_n':"健康度分數",'gl.vlan_n':"VLAN",'gl.access_n':"Access 埠",'gl.trunk_n':"Trunk 埠／Native VLAN",'gl.hybrid_n':"Hybrid 埠",'gl.svi_n':"SVI（VLAN 介面）",'gl.lacp_n':"LACP（鏈路聚合）",'gl.vrrp_n':"VRRP / HSRP（備援閘道）",'gl.stack_n':"堆疊（IRF / StackWise / VSF）",'gl.mlag_n':"MLAG / vPC / VLT（跨機聚合）",'gl.stp_n':"STP / BPDU Guard（生成樹）",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL（存取控制清單）",'gl.ospf_n':"OSPF / BGP（動態路由）",'gl.lldp_n':"LLDP（鄰居探索）",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing（定時回連）",'gl.ioc_n':"IOC / 威脅情資",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma 規則",'gl.deid_n':"去識別化／對照表",'gl.golden_n':"黃金基準線",'nav.glossary':"📖 喵喵小辭典",'gl.title':"📖 喵喵小辭典",'gl.search':"搜尋術語喵（LACP、遮蔽…）",'gl.intro':"常見名詞的白話說明，點一下就展開喵~",'gl.empty':"找不到喵",'gl.vdom':"把一台防火牆切成多個彼此獨立的虛擬防火牆，各有自己的介面、規則與路由；FortiGate 稱 VDOM，Palo Alto 稱 vsys。分析結果會依 VDOM 分開比對。喵~",'gl.zone':"把介面分組成安全區域（如 trust、untrust、DMZ），規則以「來源區域→目的區域」撰寫，而不是逐一指定介面。喵~",'gl.shadow':"規則由上往下比對，若上方已有一條涵蓋範圍更大（或相同）的規則，下方這條永遠不會命中，稱為被遮蔽。通常可刪除或調整順序。喵~",'gl.anyany':"來源、目的與服務都是「全部」的允許規則，等於整段不設防，是稽核最常列出的高風險項目。喵~",'gl.nat':"位址轉換。來源 NAT 讓內部位址以對外位址上網；目的 NAT（VIP、埠轉送）把對外位址與埠轉給內部主機。查詢時可勾選考慮目的 NAT。喵~",'gl.hitcount':"設備統計每條規則被流量命中的次數。設定檔本身不含，需另外貼上設備輸出；長期為 0 的規則可考慮清理。喵~",'gl.health':"依稽核發現扣分得到的 0～100 分與 A～F 等級；高、中、低風險每筆分別扣 10、5、3 分，單一檢查最多扣三筆。用來追蹤改善，不代表設備絕對安全。喵~",'gl.vlan':"在同一台交換器上切出多個彼此隔離的二層網段，以 VLAN ID（1～4094）區分。喵~",'gl.access':"只屬於一個 VLAN 的埠，封包不帶 VLAN 標籤，通常接電腦、印表機等終端設備。喵~",'gl.trunk':"同時承載多個 VLAN 的埠，封包帶 VLAN 標籤，常用於交換器之間；Native VLAN 是 trunk 上不帶標籤傳送的那個 VLAN，兩端需一致。喵~",'gl.hybrid':"Comware、Ruijie、Planet 等廠牌的埠模式，可分別指定哪些 VLAN 帶標籤、哪些不帶標籤，比 trunk 更有彈性。喵~",'gl.svi':"VLAN 的三層介面（如 Vlan-interface10、interface Vlan10），設定 IP 後成為該 VLAN 的閘道。喵~",'gl.lacp':"把多條實體連線綁成一條邏輯連線（Port-channel、Bridge-Aggregation、LAG），增加頻寬與備援；LACP 是兩端自動協商的協定，static 則不協商。喵~",'gl.vrrp':"讓兩台以上設備共用一個虛擬閘道 IP，主設備故障時由備援接手，終端不需改設定。HSRP 是 Cisco 的同類協定。喵~",'gl.stack':"把多台交換器堆疊成一台來管理，共用一份設定與一個管理位址；各廠牌名稱不同。喵~",'gl.mlag':"兩台獨立的交換器對下游提供同一組鏈路聚合，任一台故障時連線不中斷；兩台各自保有獨立設定，與堆疊不同。喵~",'gl.stp':"生成樹協定，自動阻斷二層迴圈。BPDU Guard 讓接終端的埠一收到交換器訊息就關閉，防止有人私接交換器造成迴圈。喵~",'gl.snoop':"二層防護：DHCP Snooping 只允許信任埠回應 DHCP，DAI 檢查 ARP 是否與租約相符，IP Source Guard 限制埠只能用分配到的位址。喵~",'gl.dot1x':"802.1X 要求接上埠的設備先通過帳號或憑證驗證；Port Security 限制每個埠可學到的 MAC 數量，超過時依設定封鎖或告警。喵~",'gl.acl':"存取控制清單，依來源、目的、協定與埠決定允許或拒絕封包，套用在介面或 VLAN 的進出方向。喵~",'gl.ospf':"動態路由協定。OSPF 用於內部網路，依區域（area）交換路由；BGP 用於不同自治系統（AS）之間，例如與電信業者或資料中心互連。喵~",'gl.lldp':"設備向相鄰設備廣播自己的名稱與埠號，用來整理實體連線與拓樸圖。喵~",'gl.syslog':"Syslog 是設備送出 log 的通用格式（RFC3164、RFC5424）；CEF 是常見的資安事件格式，常包在 Syslog 裡傳送。喵~",'gl.beaconing':"主機以固定間隔反覆連到同一個外部位址，可能是惡意程式定時回報指揮主機；也可能是正常的更新或監控程式，需人工確認。喵~",'gl.ioc':"入侵指標，如已知惡意 IP、網域或檔案雜湊。匯入情資清單後，工具會比對 log 中出現的值；比對只在本機進行。喵~",'gl.mitre':"整理攻擊手法的公開知識庫，每種手法有編號（如 T1558.003）。問題清單會標出對應編號，方便查找說明與處置方式。喵~",'gl.kerberoast':"針對 Windows 網域 Kerberos 的密碼破解手法：攻擊者取得以服務帳號或未要求預先驗證帳號密碼加密的票證，再離線暴力破解；常見訊號是 RC4 加密的票證要求。喵~",'gl.sigma':"通用的偵測規則格式（YAML），可在不同 log 平台共用。log 工具可匯入部分語法作為自訂規則。喵~",'gl.deid':"把設定或 log 中的 IP、主機名稱、帳號、密碼等換成假值後再分享；對照表記錄真假值的對應，留在自己手上，日後可把回覆內容還原。喵~",'gl.golden':"自訂「設定必須包含／不可包含」的規則，逐台檢查是否符合公司標準，例如必須設定 NTP、不可開啟 HTTP 管理。喵~",'hero.step1':"把檔案叼過來放下",'hero.step2':"本喵自己挑工具",'hero.step3':"在這裡看結果，不會叼出去喵~",'hub.demo':"看範例喵",'hub.tags_more':"全部 {n} 種喵",'hub.tags_less':"收起來喵",'egg.smelly_tea':"（推過來一杯）只有冰紅茶喵，可以嗎喵？",'egg.smelly_roof':"我家有屋頂喵，要不要一起上去曬太陽喵？",'egg.smelly_yarimasu':"做得不錯喵（やりますねぇ）",'hs.col_history':"以前的分數",'egg.all_a':"🦙🏆 全部都是 A 級喵！今天可以早點回家睡午覺喵",'egg.comeback':"🦙 逆轉勝喵！{name} 從 {old} 分跳到 {new} 分",'egg.vendor_cloudflare':"Cloudflare 的橘色雲朵，像橘貓一樣趴在網站門口，可疑的請求要先證明自己不是機器人喵",'hs.col_trend':"跟上次比喵",'hs.trend_label':"趨勢喵",'hs.trend_score':"分數 {old} → {new}（{delta}）喵",'hs.t   bean:{'egg.vendor_ldap':"🫘記得每顆豆子名字的名冊豆",'drop.found':"🫛 偵測到 {vendor} 設定 🥕",'drop.found_tool':"🫛 交給「{tool}」處理 🥕",'gl.vdom_n':"VDOM / vsys（虛擬防火牆）",'gl.zone_n':"Zone（安全區域）",'gl.shadow_n':"遮蔽規則（Shadowed rule）",'gl.anyany_n':"Any-any 全開規則",'gl.nat_n':"NAT / VIP（位址轉換）",'gl.hitcount_n':"規則命中數（Hit count）",'gl.health_n':"健康度分數",'gl.vlan_n':"VLAN",'gl.access_n':"Access 埠",'gl.trunk_n':"Trunk 埠／Native VLAN",'gl.hybrid_n':"Hybrid 埠",'gl.svi_n':"SVI（VLAN 介面）",'gl.lacp_n':"LACP（鏈路聚合）",'gl.vrrp_n':"VRRP / HSRP（備援閘道）",'gl.stack_n':"堆疊（IRF / StackWise / VSF）",'gl.mlag_n':"MLAG / vPC / VLT（跨機聚合）",'gl.stp_n':"STP / BPDU Guard（生成樹）",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL（存取控制清單）",'gl.ospf_n':"OSPF / BGP（動態路由）",'gl.lldp_n':"LLDP（鄰居探索）",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing（定時回連）",'gl.ioc_n':"IOC / 威脅情資",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma 規則",'gl.deid_n':"去識別化／對照表",'gl.golden_n':"黃金基準線",'nav.glossary':"📖 🫛 豆豆小辭典",'gl.title':"📖 🫛 豆豆小辭典",'gl.search':"🥕 搜尋術語（LACP、遮蔽…）",'gl.intro':"🫛 常見名詞白話說明，點術語展開 🥕",'gl.empty':"🫛 找不到 🥕",'gl.vdom':"🫛 把一台防火牆切成多個彼此獨立的虛擬防火牆，各有自己的介面、規則與路由；FortiGate 稱 VDOM，Palo Alto 稱 vsys。分析結果會依 VDOM 分開比對。 🥕",'gl.zone':"🫛 把介面分組成安全區域（如 trust、untrust、DMZ），規則以「來源區域→目的區域」撰寫，而不是逐一指定介面。 🥕",'gl.shadow':"🫛 規則由上往下比對，若上方已有一條涵蓋範圍更大（或相同）的規則，下方這條永遠不會命中，稱為被遮蔽。通常可刪除或調整順序。 🥕",'gl.anyany':"🫛 來源、目的與服務都是「全部」的允許規則，等於整段不設防，是稽核最常列出的高風險項目。 🥕",'gl.nat':"🫛 位址轉換。來源 NAT 讓內部位址以對外位址上網；目的 NAT（VIP、埠轉送）把對外位址與埠轉給內部主機。查詢時可勾選考慮目的 NAT。 🥕",'gl.hitcount':"🫛 設備統計每條規則被流量命中的次數。設定檔本身不含，需另外貼上設備輸出；長期為 0 的規則可考慮清理。 🥕",'gl.health':"🫛 依稽核發現扣分得到的 0～100 分與 A～F 等級；高、中、低風險每筆分別扣 10、5、3 分，單一檢查最多扣三筆。用來追蹤改善，不代表設備絕對安全。 🥕",'gl.vlan':"🫛 在同一台交換器上切出多個彼此隔離的二層網段，以 VLAN ID（1～4094）區分。 🥕",'gl.access':"🫛 只屬於一個 VLAN 的埠，封包不帶 VLAN 標籤，通常接電腦、印表機等終端設備。 🥕",'gl.trunk':"🫛 同時承載多個 VLAN 的埠，封包帶 VLAN 標籤，常用於交換器之間；Native VLAN 是 trunk 上不帶標籤傳送的那個 VLAN，兩端需一致。 🥕",'gl.hybrid':"🫛 Comware、Ruijie、Planet 等廠牌的埠模式，可分別指定哪些 VLAN 帶標籤、哪些不帶標籤，比 trunk 更有彈性。 🥕",'gl.svi':"🫛 VLAN 的三層介面（如 Vlan-interface10、interface Vlan10），設定 IP 後成為該 VLAN 的閘道。 🥕",'gl.lacp':"🫛 把多條實體連線綁成一條邏輯連線（Port-channel、Bridge-Aggregation、LAG），增加頻寬與備援；LACP 是兩端自動協商的協定，static 則不協商。 🥕",'gl.vrrp':"🫛 讓兩台以上設備共用一個虛擬閘道 IP，主設備故障時由備援接手，終端不需改設定。HSRP 是 Cisco 的同類協定。 🥕",'gl.stack':"🫛 把多台交換器堆疊成一台來管理，共用一份設定與一個管理位址；各廠牌名稱不同。 🥕",'gl.mlag':"🫛 兩台獨立的交換器對下游提供同一組鏈路聚合，任一台故障時連線不中斷；兩台各自保有獨立設定，與堆疊不同。 🥕",'gl.stp':"🫛 生成樹協定，自動阻斷二層迴圈。BPDU Guard 讓接終端的埠一收到交換器訊息就關閉，防止有人私接交換器造成迴圈。 🥕",'gl.snoop':"🫛 二層防護：DHCP Snooping 只允許信任埠回應 DHCP，DAI 檢查 ARP 是否與租約相符，IP Source Guard 限制埠只能用分配到的位址。 🥕",'gl.dot1x':"🫛 802.1X 要求接上埠的設備先通過帳號或憑證驗證；Port Security 限制每個埠可學到的 MAC 數量，超過時依設定封鎖或告警。 🥕",'gl.acl':"🫛 存取控制清單，依來源、目的、協定與埠決定允許或拒絕封包，套用在介面或 VLAN 的進出方向。 🥕",'gl.ospf':"🫛 動態路由協定。OSPF 用於內部網路，依區域（area）交換路由；BGP 用於不同自治系統（AS）之間，例如與電信業者或資料中心互連。 🥕",'gl.lldp':"🫛 設備向相鄰設備廣播自己的名稱與埠號，用來整理實體連線與拓樸圖。 🥕",'gl.syslog':"🫛 Syslog 是設備送出 log 的通用格式（RFC3164、RFC5424）；CEF 是常見的資安事件格式，常包在 Syslog 裡傳送。 🥕",'gl.beaconing':"🫛 主機以固定間隔反覆連到同一個外部位址，可能是惡意程式定時回報指揮主機；也可能是正常的更新或監控程式，需人工確認。 🥕",'gl.ioc':"🫛 入侵指標，如已知惡意 IP、網域或檔案雜湊。匯入情資清單後，工具會比對 log 中出現的值；比對只在本機進行。 🥕",'gl.mitre':"🫛 整理攻擊手法的公開知識庫，每種手法有編號（如 T1558.003）。問題清單會標出對應編號，方便查找說明與處置方式。 🥕",'gl.kerberoast':"🫛 針對 Windows 網域 Kerberos 的密碼破解手法：攻擊者取得以服務帳號或未要求預先驗證帳號密碼加密的票證，再離線暴力破解；常見訊號是 RC4 加密的票證要求。 🥕",'gl.sigma':"🫛 通用的偵測規則格式（YAML），可在不同 log 平台共用。log 工具可匯入部分語法作為自訂規則。 🥕",'gl.deid':"🫛 把設定或 log 中的 IP、主機名稱、帳號、密碼等換成假值後再分享；對照表記錄真假值的對應，留在自己手上，日後可把回覆內容還原。 🥕",'gl.golden':"🫛 自訂「設定必須包含／不可包含」的規則，逐台檢查是否符合公司標準，例如必須設定 NTP、不可開啟 HTTP 管理。 🥕",'hero.step1':"把種子（檔案）撒進來",'hero.step2':"自動分到對的菜圃",'hero.step3':"就地收成，不外送 🌱",'hub.demo':"看示範田",'hub.tags_more':"全部 {n} 個品種",'hub.tags_less':"收起來",'egg.smelly_tea':"🫘（遞過來一杯）只有冰紅茶，沒有豆漿，可以嗎？",'egg.smelly_roof':"🫘我家屋頂曬著一整片豆子，要不要上去一起曬？",'egg.smelly_yarimasu':"🫘做得不錯嘛，豆有你的（やりますねぇ）",'hs.col_history':"歷次收成",'egg.all_a':"🦙🏆 整片豆田都是 A 級好豆！今天提早收工",'egg.comeback':"🦙 逆轉勝！{name} 從 {old} 分長到 {new} 分",'egg.vendor_cloudflare':"🫘 Cloudflare 的橘色雲飄在豆田前，可疑的豆子要先證明自己不是假豆",'hs.col_trend':"🫘 跟上一莢比",'hs.trend_   alpaca:{'egg.vendor_ldap':"幫全牧場羊駝點名、核對暗號的名冊管理員",'drop.found':"🔍 羊駝認出這是 {vendor} 設定咩",'drop.found_tool':"🔍 羊駝覺得這該給「{tool}」咩",'gl.vdom_n':"VDOM / vsys（虛擬防火牆）",'gl.zone_n':"Zone（安全區域）",'gl.shadow_n':"遮蔽規則（Shadowed rule）",'gl.anyany_n':"Any-any 全開規則",'gl.nat_n':"NAT / VIP（位址轉換）",'gl.hitcount_n':"規則命中數（Hit count）",'gl.health_n':"健康度分數",'gl.vlan_n':"VLAN",'gl.access_n':"Access 埠",'gl.trunk_n':"Trunk 埠／Native VLAN",'gl.hybrid_n':"Hybrid 埠",'gl.svi_n':"SVI（VLAN 介面）",'gl.lacp_n':"LACP（鏈路聚合）",'gl.vrrp_n':"VRRP / HSRP（備援閘道）",'gl.stack_n':"堆疊（IRF / StackWise / VSF）",'gl.mlag_n':"MLAG / vPC / VLT（跨機聚合）",'gl.stp_n':"STP / BPDU Guard（生成樹）",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL（存取控制清單）",'gl.ospf_n':"OSPF / BGP（動態路由）",'gl.lldp_n':"LLDP（鄰居探索）",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing（定時回連）",'gl.ioc_n':"IOC / 威脅情資",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma 規則",'gl.deid_n':"去識別化／對照表",'gl.golden_n':"黃金基準線",'nav.glossary':"📖 羊駝小辭典",'gl.title':"📖 羊駝小辭典",'gl.search':"搜尋術語咩（LACP、遮蔽…）",'gl.intro':"羊駝幫你把術語講白話，點一下展開咩",'gl.empty':"羊駝也不知道這個咩",'gl.vdom':"把一台防火牆切成多個彼此獨立的虛擬防火牆，各有自己的介面、規則與路由；FortiGate 稱 VDOM，Palo Alto 稱 vsys。分析結果會依 VDOM 分開比對。咩",'gl.zone':"把介面分組成安全區域（如 trust、untrust、DMZ），規則以「來源區域→目的區域」撰寫，而不是逐一指定介面。咩",'gl.shadow':"規則由上往下比對，若上方已有一條涵蓋範圍更大（或相同）的規則，下方這條永遠不會命中，稱為被遮蔽。通常可刪除或調整順序。咩",'gl.anyany':"來源、目的與服務都是「全部」的允許規則，等於整段不設防，是稽核最常列出的高風險項目。咩",'gl.nat':"位址轉換。來源 NAT 讓內部位址以對外位址上網；目的 NAT（VIP、埠轉送）把對外位址與埠轉給內部主機。查詢時可勾選考慮目的 NAT。咩",'gl.hitcount':"設備統計每條規則被流量命中的次數。設定檔本身不含，需另外貼上設備輸出；長期為 0 的規則可考慮清理。咩",'gl.health':"依稽核發現扣分得到的 0～100 分與 A～F 等級；高、中、低風險每筆分別扣 10、5、3 分，單一檢查最多扣三筆。用來追蹤改善，不代表設備絕對安全。咩",'gl.vlan':"在同一台交換器上切出多個彼此隔離的二層網段，以 VLAN ID（1～4094）區分。咩",'gl.access':"只屬於一個 VLAN 的埠，封包不帶 VLAN 標籤，通常接電腦、印表機等終端設備。咩",'gl.trunk':"同時承載多個 VLAN 的埠，封包帶 VLAN 標籤，常用於交換器之間；Native VLAN 是 trunk 上不帶標籤傳送的那個 VLAN，兩端需一致。咩",'gl.hybrid':"Comware、Ruijie、Planet 等廠牌的埠模式，可分別指定哪些 VLAN 帶標籤、哪些不帶標籤，比 trunk 更有彈性。咩",'gl.svi':"VLAN 的三層介面（如 Vlan-interface10、interface Vlan10），設定 IP 後成為該 VLAN 的閘道。咩",'gl.lacp':"把多條實體連線綁成一條邏輯連線（Port-channel、Bridge-Aggregation、LAG），增加頻寬與備援；LACP 是兩端自動協商的協定，static 則不協商。咩",'gl.vrrp':"讓兩台以上設備共用一個虛擬閘道 IP，主設備故障時由備援接手，終端不需改設定。HSRP 是 Cisco 的同類協定。咩",'gl.stack':"把多台交換器堆疊成一台來管理，共用一份設定與一個管理位址；各廠牌名稱不同。咩",'gl.mlag':"兩台獨立的交換器對下游提供同一組鏈路聚合，任一台故障時連線不中斷；兩台各自保有獨立設定，與堆疊不同。咩",'gl.stp':"生成樹協定，自動阻斷二層迴圈。BPDU Guard 讓接終端的埠一收到交換器訊息就關閉，防止有人私接交換器造成迴圈。咩",'gl.snoop':"二層防護：DHCP Snooping 只允許信任埠回應 DHCP，DAI 檢查 ARP 是否與租約相符，IP Source Guard 限制埠只能用分配到的位址。咩",'gl.dot1x':"802.1X 要求接上埠的設備先通過帳號或憑證驗證；Port Security 限制每個埠可學到的 MAC 數量，超過時依設定封鎖或告警。咩",'gl.acl':"存取控制清單，依來源、目的、協定與埠決定允許或拒絕封包，套用在介面或 VLAN 的進出方向。咩",'gl.ospf':"動態路由協定。OSPF 用於內部網路，依區域（area）交換路由；BGP 用於不同自治系統（AS）之間，例如與電信業者或資料中心互連。咩",'gl.lldp':"設備向相鄰設備廣播自己的名稱與埠號，用來整理實體連線與拓樸圖。咩",'gl.syslog':"Syslog 是設備送出 log 的通用格式（RFC3164、RFC5424）；CEF 是常見的資安事件格式，常包在 Syslog 裡傳送。咩",'gl.beaconing':"主機以固定間隔反覆連到同一個外部位址，可能是惡意程式定時回報指揮主機；也可能是正常的更新或監控程式，需人工確認。咩",'gl.ioc':"入侵指標，如已知惡意 IP、網域或檔案雜湊。匯入情資清單後，工具會比對 log 中出現的值；比對只在本機進行。咩",'gl.mitre':"整理攻擊手法的公開知識庫，每種手法有編號（如 T1558.003）。問題清單會標出對應編號，方便查找說明與處置方式。咩",'gl.kerberoast':"針對 Windows 網域 Kerberos 的密碼破解手法：攻擊者取得以服務帳號或未要求預先驗證帳號密碼加密的票證，再離線暴力破解；常見訊號是 RC4 加密的票證要求。咩",'gl.sigma':"通用的偵測規則格式（YAML），可在不同 log 平台共用。log 工具可匯入部分語法作為自訂規則。咩",'gl.deid':"把設定或 log 中的 IP、主機名稱、帳號、密碼等換成假值後再分享；對照表記錄真假值的對應，留在自己手上，日後可把回覆內容還原。咩",'gl.golden':"自訂「設定必須包含／不可包含」的規則，逐台檢查是否符合公司標準，例如必須設定 NTP、不可開啟 HTTP 管理。咩",'hero.step1':"把檔案丟進草料槽",'hero.step2':"羊駝自己挑工具",'hero.step3':"就地嚼完，不會吐出去 🦙",'hub.demo':"看羊駝示範",'hub.tags_more':"全部 {n} 種草",'hub.tags_less':"收起來",'egg.smelly_tea':"（羊駝遞過來一杯）只有冰紅茶-aca，可以嗎咩？",'egg.smelly_roof':"我家有個屋頂-aca，要不要上去曬曬毛咩？",'egg.smelly_yarimasu':"做得不錯-aca（やりますねぇ）",'hs.col_history':"歷次",'egg.all_a':"🦙🏆 全部設備都是 A 級-aca！羊駝今天提早去吃草",'egg.comeback':"🦙 逆轉勝-aca！{name} 從 {old} 分衝到 {new} 分",'egg.vendor_cloudflare':"Cloudflare 的橘色雲飄在牧場門口，可疑的訪客要先證明自己不是機器人-aca",'hs.col_trend':"🦙 跟上次比",'hs.trend_label':"🦙 趨勢",'hs.trend_score':"羊駝分數 {old} → {new}（{delta}）",'hs.trend_issue （IRF / StackWise / VSF）",'gl.mlag_n':"MLAG / vPC / VLT（跨機聚合）",'gl.stp_n':"STP / BPDU Guard（生成樹）",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL（存取控制清單）",'gl.ospf_n':"OSPF / BGP（動態路由）",'gl.lldp_n':"LLDP（鄰居探索）",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing（定時回連）",'gl.ioc_n':"IOC / 威脅情資",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma 規則",'gl.deid_n':"去識別化／對照表",'gl.golden_n':"黃金基準線",'nav.glossary':"📖 術語（自己查）",'gl.title':"📖 術語……自己查吧",'gl.search':"搜一下啦（LACP、遮蔽…）",'gl.intro':"反正就是一些名詞的說明，點開來看，算了",'gl.empty':"沒有，就沒有",'gl.vdom':"把一台防火牆切成多個彼此獨立的虛擬防火牆，各有自己的介面、規則與路由；FortiGate 稱 VDOM，Palo Alto 稱 vsys。分析結果會依 VDOM 分開比對。……大概就這樣",'gl.zone':"把介面分組成安全區域（如 trust、untrust、DMZ），規則以「來源區域→目的區域」撰寫，而不是逐一指定介面。……大概就這樣",'gl.shadow':"規則由上往下比對，若上方已有一條涵蓋範圍更大（或相同）的規則，下方這條永遠不會命中，稱為被遮蔽。通常可刪除或調整順序。……大概就這樣",'gl.anyany':"來源、目的與服務都是「全部」的允許規則，等於整段不設防，是稽核最常列出的高風險項目。……大概就這樣",'gl.nat':"位址轉換。來源 NAT 讓內部位址以對外位址上網；目的 NAT（VIP、埠轉送）把對外位址與埠轉給內部主機。查詢時可勾選考慮目的 NAT。……大概就這樣",'gl.hitcount':"設備統計每條規則被流量命中的次數。設定檔本身不含，需另外貼上設備輸出；長期為 0 的規則可考慮清理。……大概就這樣",'gl.health':"依稽核發現扣分得到的 0～100 分與 A～F 等級；高、中、低風險每筆分別扣 10、5、3 分，單一檢查最多扣三筆。用來追蹤改善，不代表設備絕對安全。……大概就這樣",'gl.vlan':"在同一台交換器上切出多個彼此隔離的二層網段，以 VLAN ID（1～4094）區分。……大概就這樣",'gl.access':"只屬於一個 VLAN 的埠，封包不帶 VLAN 標籤，通常接電腦、印表機等終端設備。……大概就這樣",'gl.trunk':"同時承載多個 VLAN 的埠，封包帶 VLAN 標籤，常用於交換器之間；Native VLAN 是 trunk 上不帶標籤傳送的那個 VLAN，兩端需一致。……大概就這樣",'gl.hybrid':"Comware、Ruijie、Planet 等廠牌的埠模式，可分別指定哪些 VLAN 帶標籤、哪些不帶標籤，比 trunk 更有彈性。……大概就這樣",'gl.svi':"VLAN 的三層介面（如 Vlan-interface10、interface Vlan10），設定 IP 後成為該 VLAN 的閘道。……大概就這樣",'gl.lacp':"把多條實體連線綁成一條邏輯連線（Port-channel、Bridge-Aggregation、LAG），增加頻寬與備援；LACP 是兩端自動協商的協定，static 則不協商。……大概就這樣",'gl.vrrp':"讓兩台以上設備共用一個虛擬閘道 IP，主設備故障時由備援接手，終端不需改設定。HSRP 是 Cisco 的同類協定。……大概就這樣",'gl.stack':"把多台交換器堆疊成一台來管理，共用一份設定與一個管理位址；各廠牌名稱不同。……大概就這樣",'gl.mlag':"兩台獨立的交換器對下游提供同一組鏈路聚合，任一台故障時連線不中斷；兩台各自保有獨立設定，與堆疊不同。……大概就這樣",'gl.stp':"生成樹協定，自動阻斷二層迴圈。BPDU Guard 讓接終端的埠一收到交換器訊息就關閉，防止有人私接交換器造成迴圈。……大概就這樣",'gl.snoop':"二層防護：DHCP Snooping 只允許信任埠回應 DHCP，DAI 檢查 ARP 是否與租約相符，IP Source Guard 限制埠只能用分配到的位址。……大概就這樣",'gl.dot1x':"802.1X 要求接上埠的設備先通過帳號或憑證驗證；Port Security 限制每個埠可學到的 MAC 數量，超過時依設定封鎖或告警。……大概就這樣",'gl.acl':"存取控制清單，依來源、目的、協定與埠決定允許或拒絕封包，套用在介面或 VLAN 的進出方向。……大概就這樣",'gl.ospf':"動態路由協定。OSPF 用於內部網路，依區域（area）交換路由；BGP 用於不同自治系統（AS）之間，例如與電信業者或資料中心互連。……大概就這樣",'gl.lldp':"設備向相鄰設備廣播自己的名稱與埠號，用來整理實體連線與拓樸圖。……大概就這樣",'gl.syslog':"Syslog 是設備送出 log 的通用格式（RFC3164、RFC5424）；CEF 是常見的資安事件格式，常包在 Syslog 裡傳送。……大概就這樣",'gl.beaconing':"主機以固定間隔反覆連到同一個外部位址，可能是惡意程式定時回報指揮主機；也可能是正常的更新或監控程式，需人工確認。……大概就這樣",'gl.ioc':"入侵指標，如已知惡意 IP、網域或檔案雜湊。匯入情資清單後，工具會比對 log 中出現的值；比對只在本機進行。……大概就這樣",'gl.mitre':"整理攻擊手法的公開知識庫，每種手法有編號（如 T1558.003）。問題清單會標出對應編號，方便查找說明與處置方式。……大概就這樣",'gl.kerberoast':"針對 Windows 網域 Kerberos 的密碼破解手法：攻擊者取得以服務帳號或未要求預先驗證帳號密碼加密的票證，再離線暴力破解；常見訊號是 RC4 加密的票證要求。……大概就這樣",'gl.sigma':"通用的偵測規則格式（YAML），可在不同 log 平台共用。log 工具可匯入部分語法作為自訂規則。……大概就這樣",'gl.deid':"把設定或 log 中的 IP、主機名稱、帳號、密碼等換成假值後再分享；對照表記錄真假值的對應，留在自己手上，日後可把回覆內容還原。……大概就這樣",'gl.golden':"自訂「設定必須包含／不可包含」的規則，逐台檢查是否符合公司標準，例如必須設定 NTP、不可開啟 HTTP 管理。……大概就這樣",'hero.step1':"把檔案丟進來",'hero.step2':"它自己會挑工具",'hero.step3':"結果在這看，反正也沒人要偷",'hub.demo':"看範例吧",'hub.tags_more':"全部 {n} 種",'hub.tags_less':"收起來",'egg.smelly_tea':"只有冰紅茶，琥珀色的那種，可以嗎？",'egg.smelly_roof':"屋頂上的陽光是金色的，要不要上去曬成小麥色？",'egg.smelly_yarimasu':"做得不錯嘛，金色的（やりますねぇ）",'hs.col_history':"歷次",'egg.all_a':"🦙🏆 全部綠燈，全部 A 級",'egg.comeback':"🦙 由紅轉綠：{name} 從 {old} 分到 {new} 分",'egg.vendor_cloudflare':"Cloudflare 色：雲朵橘，擋在網站前面",'hs.col_trend':"🎨 與上次比較",'hs.trend_label':"📈 趨勢",'hs.trend_score':"分數 {old} → {new}（{delta}）",'hs.trend_issues':"紅燈 {old} → {new}（{delta}）",'ach.title':"🏆 加班證明",'ach.unlocked':"🏆 恭喜（？）解鎖：{name}",'ach.first':"初來乍到",'ach.first_desc':"用過任一分析工具",'ach.all5':"全能羊駝",'ach.all5_desc':"防火牆、交換器、log、去識別化、產生器五個工具都用過",'ach.night':"睡不著的人",'ach.night_desc':"凌晨 0～5 點還在分析",'ach.weekend':"沒有週末的人",'ach.weekend_desc':"週末還在處理設備",'ach.clean':"模範生",'ach.clean_desc':"綜合健檢有一台拿到 A 級",'egg.april_fools':"🦙 愚人節。設定沒被改，該加的班也沒少，這才是最大的玩笑
