  wuxia:{'egg.vendor_ldap':"武林名冊總管，各派弟子身分暗號皆在此核驗",'drop.found':"🔍 認出此乃 {vendor} 門派之設定",'drop.found_tool':"🔍 此物當交「{tool}」處置",'gl.vdom_n':"VDOM / vsys（虛擬防火牆）",'gl.zone_n':"Zone（安全區域）",'gl.shadow_n':"遮蔽規則（Shadowed rule）",'gl.anyany_n':"Any-any 全開規則",'gl.nat_n':"NAT / VIP（位址轉換）",'gl.hitcount_n':"規則命中數（Hit count）",'gl.health_n':"健康度分數",'gl.vlan_n':"VLAN",'gl.access_n':"Access 埠",'gl.trunk_n':"Trunk 埠／Native VLAN",'gl.hybrid_n':"Hybrid 埠",'gl.svi_n':"SVI（VLAN 介面）",'gl.lacp_n':"LACP（鏈路聚合）",'gl.vrrp_n':"VRRP / HSRP（備援閘道）",'gl.stack_n':"堆疊（IRF / StackWise / VSF）",'gl.mlag_n':"MLAG / vPC / VLT（跨機聚合）",'gl.stp_n':"STP / BPDU Guard（生成樹）",'gl.snoop_n':"DHCP Snooping / DAI / IPSG",'gl.dot1x_n':"802.1X / Port Security",'gl.acl_n':"ACL（存取控制清單）",'gl.ospf_n':"OSPF / BGP（動態路由）",'gl.lldp_n':"LLDP（鄰居探索）",'gl.syslog_n':"Syslog / CEF",'gl.beaconing_n':"Beaconing（定時回連）",'gl.ioc_n':"IOC / 威脅情資",'gl.mitre_n':"MITRE ATT&CK",'gl.kerberoast_n':"Kerberoasting / AS-REP Roasting",'gl.sigma_n':"Sigma 規則",'gl.deid_n':"去識別化／對照表",'gl.golden_n':"黃金基準線",'nav.glossary':"📖 江湖術語秘笈",'gl.title':"📖 江湖術語秘笈",'gl.search':"搜尋招式名稱（LACP、遮蔽…）",'gl.intro':"此秘笈載有各派常見術語之解說，點選即可參悟。",'gl.empty':"秘笈中查無此招",'gl.vdom':"心法：把一台防火牆切成多個彼此獨立的虛擬防火牆，各有自己的介面、規則與路由；FortiGate 稱 VDOM，Palo Alto 稱 vsys。分析結果會依 VDOM 分開比對。",'gl.zone':"心法：把介面分組成安全區域（如 trust、untrust、DMZ），規則以「來源區域→目的區域」撰寫，而不是逐一指定介面。",'gl.shadow':"心法：規則由上往下比對，若上方已有一條涵蓋範圍更大（或相同）的規則，下方這條永遠不會命中，稱為被遮蔽。通常可刪除或調整順序。",'gl.anyany':"心法：來源、目的與服務都是「全部」的允許規則，等於整段不設防，是稽核最常列出的高風險項目。",'gl.nat':"心法：位址轉換。來源 NAT 讓內部位址以對外位址上網；目的 NAT（VIP、埠轉送）把對外位址與埠轉給內部主機。查詢時可勾選考慮目的 NAT。",'gl.hitcount':"心法：設備統計每條規則被流量命中的次數。設定檔本身不含，需另外貼上設備輸出；長期為 0 的規則可考慮清理。",'gl.health':"心法：依稽核發現扣分得到的 0～100 分與 A～F 等級；高、中、低風險每筆分別扣 10、5、3 分，單一檢查最多扣三筆。用來追蹤改善，不代表設備絕對安全。",'gl.vlan':"心法：在同一台交換器上切出多個彼此隔離的二層網段，以 VLAN ID（1～4094）區分。",'gl.access':"心法：只屬於一個 VLAN 的埠，封包不帶 VLAN 標籤，通常接電腦、印表機等終端設備。",'gl.trunk':"心法：同時承載多個 VLAN 的埠，封包帶 VLAN 標籤，常用於交換器之間；Native VLAN 是 trunk 上不帶標籤傳送的那個 VLAN，兩端需一致。",'gl.hybrid':"心法：Comware、Ruijie、Planet 等廠牌的埠模式，可分別指定哪些 VLAN 帶標籤、哪些不帶標籤，比 trunk 更有彈性。",'gl.svi':"心法：VLAN 的三層介面（如 Vlan-interface10、interface Vlan10），設定 IP 後成為該 VLAN 的閘道。",'gl.lacp':"心法：把多條實體連線綁成一條邏輯連線（Port-channel、Bridge-Aggregation、LAG），增加頻寬與備援；LACP 是兩端自動協商的協定，static 則不協商。",'gl.vrrp':"心法：讓兩台以上設備共用一個虛擬閘道 IP，主設備故障時由備援接手，終端不需改設定。HSRP 是 Cisco 的同類協定。",'gl.stack':"心法：把多台交換器堆疊成一台來管理，共用一份設定與一個管理位址；各廠牌名稱不同。",'gl.mlag':"心法：兩台獨立的交換器對下游提供同一組鏈路聚合，任一台故障時連線不中斷；兩台各自保有獨立設定，與堆疊不同。",'gl.stp':"心法：生成樹協定，自動阻斷二層迴圈。BPDU Guard 讓接終端的埠一收到交換器訊息就關閉，防止有人私接交換器造成迴圈。",'gl.snoop':"心法：二層防護：DHCP Snooping 只允許信任埠回應 DHCP，DAI 檢查 ARP 是否與租約相符，IP Source Guard 限制埠只能用分配到的位址。",'gl.dot1x':"心法：802.1X 要求接上埠的設備先通過帳號或憑證驗證；Port Security 限制每個埠可學到的 MAC 數量，超過時依設定封鎖或告警。",'gl.acl':"心法：存取控制清單，依來源、目的、協定與埠決定允許或拒絕封包，套用在介面或 VLAN 的進出方向。",'gl.ospf':"心法：動態路由協定。OSPF 用於內部網路，依區域（area）交換路由；BGP 用於不同自治系統（AS）之間，例如與電信業者或資料中心互連。",'gl.lldp':"心法：設備向相鄰設備廣播自己的名稱與埠號，用來整理實體連線與拓樸圖。",'gl.syslog':"心法：Syslog 是設備送出 log 的通用格式（RFC3164、RFC5424）；CEF 是常見的資安事件格式，常包在 Syslog 裡傳送。",'gl.beaconing':"心法：主機以固定間隔反覆連到同一個外部位址，可能是惡意程式定時回報指揮主機；也可能是正常的更新或監控程式，需人工確認。",'gl.ioc':"心法：入侵指標，如已知惡意 IP、網域或檔案雜湊。匯入情資清單後，工具會比對 log 中出現的值；比對只在本機進行。",'gl.mitre':"心法：整理攻擊手法的公開知識庫，每種手法有編號（如 T1558.003）。問題清單會標出對應編號，方便查找說明與處置方式。",'gl.kerberoast':"心法：針對 Windows 網域 Kerberos 的密碼破解手法：攻擊者取得以服務帳號或未要求預先驗證帳號密碼加密的票證，再離線暴力破解；常見訊號是 RC4 加密的票證要求。",'gl.sigma':"心法：通用的偵測規則格式（YAML），可在不同 log 平台共用。log 工具可匯入部分語法作為自訂規則。",'gl.deid':"心法：把設定或 log 中的 IP、主機名稱、帳號、密碼等換成假值後再分享；對照表記錄真假值的對應，留在自己手上，日後可把回覆內容還原。",'gl.golden':"心法：自訂「設定必須包含／不可包含」的規則，逐台檢查是否符合公司標準，例如必須設定 NTP、不可開啟 HTTP 管理。",'hero.step1':"呈上卷宗或記錄",'hero.step2':"自會擇定對應心法",'hero.step3':"結果當場現形，不出本門",'hub.demo':"觀摩演武",'hub.tags_more':"全部 {n} 派",'hub.tags_less':"收起",'egg.smelly_tea':"（奉上一盞）寒舍僅有冰鎮紅茶，閣下將就可否？",'egg.smelly_roof':"寒舍頂上有一方屋頂，閣下可願隨在下登高曬日？",'egg.smelly_yarimasu':"好身手（やりますねぇ）",'hs.col_history':"歷次比武",'egg.all_a':"🦙🏆 各派盡皆甲等，今日可早早收劍歸山",'egg.comeback':"🦙 絕地反擊！{name} 功力自 {old} 躍至 {new}",'egg.vendor_cloudflare':"Cloudflare 橘雲鎮守山門，凡受盤查之來客，須先證明非傀儡機關",'hs.col_trend':"較前番比武",'hs.trend_label':"功力消長",'hs.trend_score':"功力 {old} // ── tr / setLang ───────────────────────────────────────────────────
let _lang = 'zhTW';
function tr(k){
  if(_lang==='leet'){const s=LANG.en[k]||LANG.zhTW[k]||k;return s.replace(/a/gi,'4').replace(/e/gi,'3').replace(/i/gi,'1').replace(/o/gi,'0').replace(/s/gi,'5').replace(/t/gi,'7').replace(/l/gi,'|');}
  if(_lang==='uwu'){const s=LANG.en[k]||LANG.zhTW[k]||k;return s.replace(/r/g,'w').replace(/R/g,'W').replace(/l/g,'w').replace(/L/g,'W').replace(/th/g,'d').replace(/Th/g,'D').replace(/n([aeiou])/g,'ny$1').replace(/N([AEIOU])/g,'Ny$1');}
  if(_lang==='cat'){const d=LANG.cat&&LANG.cat[k];if(d)return d;const base=LANG.zhTW[k]||LANG.en[k]||k;return base+(/[一-鿿]$/.test(base)?'喵~':' nyaa~');}
  if(_lang==='bean'){const d=LANG.bean&&LANG.bean[k];if(d)return d;const base=LANG.en[k]||LANG.zhTW[k]||k;const vg=['🥕','🫛','🌽'];return base.split('').map(c=>c===' '?' ':vg[c.charCodeAt(0)%3]).join('');}
  return (LANG[_lang]||LANG.zhTW)[k]||LANG.en[k]||k;
}

function tip(key, label) {
  const t = tr(key);
  if (!t || t === key) return label;
  return `<span data-tip="${t.replace(/"/g,'&quot;')}">${label}<sup style="font-size:8px;opacity:.45;margin-left:2px;cursor:help">ⓘ</sup></span>`;
}
// 語言偏好跨工具共用（2026-09-29，PB）：共用 localStorage key 'cw_lang'（比照主題 'cw_theme'），
// 只記住三種正式語言；彩蛋語言需各工具各自解鎖，不跨工具帶入。未存過時依瀏覽器語言決定
function loadLangPref() {
  try { const v = localStorage.getItem('cw_lang'); if (v === 'zhTW' || v === 'en' || v === 'ja') return v; } catch (e) {}
  const n = ((typeof navigator !== 'undefined' && navigator.language) || '').toLowerCase();
  return n.indexOf('ja') === 0 ? 'ja' : (n.indexOf('zh') === 0 || !n ? 'zhTW' : 'en');
}
// 無障礙（UE，2026-09-29 新增）：沒有可存取名稱的輸入欄位，自動關聯到緊鄰的標籤——前一個兄弟元素是
// 沒有 for 的 <label> 時補 for；是 <span> 時以 aria-labelledby 指向它（語言切換後名稱跟著更新）。
// 已有 label／aria／title／placeholder（瀏覽器本身會當名稱）者不動。各工具各自一份，不跨檔引用
function autoLabelControls() {
  var n = 0;
  document.querySelectorAll('input:not([type=hidden]):not([type=file]),select,textarea').forEach(function (el) {
    if (el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || el.title || el.placeholder || el.closest('label')) return;
    if (el.id && document.querySelector('label[for="' + el.id + '"]')) return;
    var lb = el.previousElementSibling;
    if (!lb || !/^(LABEL|SPAN)$/.test(lb.tagName) || lb.querySelector('input,select,textarea')) return;
    if (lb.tagName === 'LABEL' && !lb.htmlFor && el.id) { lb.htmlFor = el.id; return; }
    if (!lb.id) lb.id = 'auto-lbl-' + (++n);
    el.setAttribute('aria-labelledby', lb.id);
  });
}
function saveLangPref(code) {
  if (code === 'zhTW' || code === 'en' || code === 'ja') { try { localStorage.setItem('cw_lang', code); } catch (e) {} }
}

const GLOSSARY = [['vdom', 'VDOM / vsys'], ['zone', 'Zone'], ['shadow', 'Shadowed rule'], ['anyany', 'Any-any'], ['nat', 'NAT / VIP'], ['hitcount', 'Hit count'], ['health', 'Health score'], ['vlan', 'VLAN'], ['access', 'Access port'], ['trunk', 'Trunk port / Native VLAN'], ['hybrid', 'Hybrid port'], ['svi', 'SVI'], ['lacp', 'LACP'], ['vrrp', 'VRRP / HSRP'], ['stack', 'Stack (IRF / StackWise / VSF)'], ['mlag', 'MLAG / vPC / VLT'], ['stp', 'STP / BPDU Guard'], ['snoop', 'DHCP Snooping / DAI / IPSG'], ['dot1x', '802.1X / Port Security'], ['acl', 'ACL'], ['ospf', 'OSPF / BGP'], ['lldp', 'LLDP'], ['syslog', 'Syslog / CEF'], ['beaconing', 'Beaconing'], ['ioc', 'IOC / Threat intel'], ['mitre', 'MITRE ATT&CK'], ['kerberoast', 'Kerberoasting / AS-REP Roasting'], ['sigma', 'Sigma'], ['deid', 'De-identification / mapping table'], ['golden', 'Golden baseline']];
function _glEsc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderGlossary() {
  const box = document.getElementById('gl-list');
  if (!box) return;
  const q = (document.getElementById('gl-search').value || '').trim().toLowerCase();
  // 搜尋同時比對英文名稱、目前語言的名稱與說明
  const items = GLOSSARY.filter(([id, name]) => !q || (name + ' ' + tr('gl.' + id + '_n') + ' ' + tr('gl.' + id)).toLowerCase().includes(q));
  box.innerHTML = items.length
    ? items.map(([id, name]) => `<details class="gl-item" id="gl-${id}"${q ? ' open' : ''}><summary>${_glEsc(tr('gl.' + id + '_n'))}</summary><div>${_glEsc(tr('gl.' + id))}</div></details>`).join('')
    : `<div class="recent-anon-empty">${_glEsc(tr('gl.empty'))}</div>`;
}
// 由網址 #glossary 或 #gl-<id> 開啟（其他工具導覽面板的連結）
function openGlossary() {
  const card = document.getElementById('glossary');
  if (!card) return;
  const m = /^#gl-([a-z0-9]+)$/.exec(location.hash);
  const search = document.getElementById('gl-search');
  // 指定的術語被目前搜尋條件過濾掉時，先清除搜尋
  if (m && !document.getElementById('gl-' + m[1]) && search.value) { search.value = ''; renderGlossary(); }
  const el = m && document.getElementById('gl-' + m[1]);
  if (el) el.open = true;
  setTimeout(() => (el || card).scrollIntoView({ block: 'start' }), 0);
}
window.addEventListener('hashchange', () => { if (/^#gl/.test(location.hash)) openGlossary(); });

const _missing = new Set();
const TIP_KEY = { fw:'fw_analyzer', sw:'sw_analyzer', ca:'cfg_anon', gen:'gen', log:'log_analyzer' };

function renderCards() {
  const wrap = document.getElementById('cards');
  wrap.innerHTML = TOOLS.map(t => {
    const miss = _missing.has(t.id);
    return `
    <div class="card${miss ? ' card-missing' : ''}" style="--card-color:${t.color}"${miss ? '' : ` onclick="openTool('${t.href}')"`}>
      <div class="card-icon">${t.icon}</div>
      <div>
        <div class="card-title">
          ${tip('tip.' + (TIP_KEY[t.id] || 'cfg_anon'), tr(t.id + '.title'))}
          <span class="card-badge">${tr(t.id + '.badge')}</span>
          ${t.experimental ? `<span class="card-badge card-badge-experimental">${tr('suite.experimental')}</span>` : ''}
        </div>
      </div>
      <p class="card-desc">${tr(t.id + '.desc')}</p>
      <div class="card-tags">
        ${t.vendors.map(v => {
          const label = v.startsWith('$') ? tr(v.slice(1)) : v;
          const slug = VENDOR_PERSONA_KEY[v];
          const persona = slug ? tr('egg.vendor_' + slug) : '';
          return persona ? `<span class="tag" data-tip="${persona.replace(/"/g,'&quot;')}">${label}</span>` : `<span class="tag">${label}</span>`;
        }).join('')}
        ${t.vendors.length > 10 ? `<button class="tag-more" onclick="event.stopPropagation();_toggleTags(this)">${tr('hub.tags_more').replace('{n}', t.vendors.length)}</button>` : ''}
      </div>
      <div class="card-features">
        ${t.features.map(f => `<span class="feat">${tr(f)}</span>`).join('')}
      </div>
      ${miss
        ? `<div class="card-warn">⚠ ${tr('warn.missing')}</div>`
        : `<div class="card-actions"><button class="card-open">${tr('suite.open')}</button><button class="card-demo" onclick="event.stopPropagation();openTool('${t.href}?demo=1')">${tr('hub.demo')}</button></div>`}
    </div>`;
  }).join('');
}

function openTool(href) { window.open(href, '_blank'); }
function _toggleTags(btn) {
  const box = btn.parentElement, open = box.classList.toggle('open');
  btn.textContent = open ? tr('hub.tags_less') : tr('hub.tags_more').replace('{n}', box.querySelectorAll('.tag').length);
}

async function checkFiles() {
  if (location.protocol === 'file:') {
    document.getElementById('h-notice').style.display = 'none';
    renderCards();
    return;
  }
  await Promise.all(TOOLS.map(async t => {
    try {
      const r = await fetch(t.href, { method: 'HEAD' });
      if (!r.ok) _missing.add(t.id);
    } catch { _missing.add(t.id); }
  }));
  renderCards();
  document.getElementById('h-notice').style.display = _missing.size === 0 ? 'none' : '';
}

  // EdgeSwitch／Extreme／Alcatel／Brocade／Juniper 移植慣例，皆 vendor:null（不掛廠牌徽章，交由
  // switch_analyzer 自己的 detectVendor() 做真正的廠牌判定）。FortiSwitch 判斷式須排在上方 idx:0
  // 的 FortiGate 防火牆判斷式（`config firewall policy|config vdom`）之後——已滿足，因為此區塊本來
  // 就在所有 idx:0 判斷式之後才會走到，真正的 FortiGate 匯出檔會被前面的判斷式先攔截 return。
  if (/^config system global/m.test(t) || /^config switch physical-port/m.test(t) || /^config router ospf/m.test(t)) return {idx:1, vendor:null};

  // Planet Technology SGS-6341 系列：switch_analyzer 已支援解析（見 switch-analyzer-core.js
  // detectVendor()），但這份獨立維護的簡化偵測規則從未同步補上。訊號逐字移植自該處三重弱訊號
  // 組合（hostname + "ethernet 1/0/5" 命名〔ethernet 與 slot/port 間有空格，與 Dell OS10
  // 無空格版本不同〕+ switchport mode），且必須排在下方 Ruijie 判斷式之前——Ruijie 判斷式含
  // 通用的 "switchport mode hybrid" 弱訊號，會提前攔截含 hybrid 介面的 Planet 設定檔
  // （2026-09 全功能審查發現，比照原始碼同一個踩坑教訓）
  if (/^hostname\s+\S+/m.test(t) && /^interface\s+ethernet\s+\d+\/\d+\/\d+/m.test(t) && /^\s*switchport mode\s+(trunk|access|hybrid)/m.test(t)) return {idx:1, vendor:null};
  if (/^interface\s+AggregatePort\s*\d+/im.test(t) || /switchport mode hybrid/m.test(t) || /^switch virtual domain\s+\d+/m.test(t) || /\bRGOS\b/i.test(t) || /^rldp\b/im.test(t) || /^nfpp\s*$/im.test(t)) return {idx:1, vendor:null};
  // 2026-08-09 稽核修復：此廣義 fallback 規則（僅認泛用關鍵字，不掛廠牌徽章）原本排在
  // NX-OS／ProCurve／Comware 等專屬判斷式之前，若一份 NX-OS 或 ProCurve 設定檔恰好在前
  // 8000 字內同時含這些泛用關鍵字，會被提前攔截導致徽章顯示不精準（仍會正確路由到 switch
  // 工具，只是拖放提示看不到正確的廠牌人格徽章）；移到所有專屬廠牌判斷式之後
  if (/spanning-tree|interface\s+(GigabitEthernet|FastEthernet|TenGigabitEthernet)/i.test(t)) return {idx:1, vendor:null};
  return null;
}

// 2026-07-24 修復既有隱患：真實設定檔（尤其含大量位址/服務物件的 FortiGate 匯出）可能達數 MB，
// 超過瀏覽器單一來源 localStorage 容量上限（多數瀏覽器 5-10MB）時 setItem() 會拋出

// 2026-09 資安審查修復：window.open() 若被瀏覽器彈出視窗攔截會回傳 null，此時目標分頁不會開啟、
// 也不會有任何程式碼去讀取並清除剛寫入的 key，導致明碼設定內容無限期留在 localStorage（這是「放棄
// 交接流程」最常見的真實觸發情境）。補上偵測：write 成功但視窗開不成時，立刻清掉剛寫入的 key 並提示。
// keepOverlay（2026-09-24 新增）：多檔清單逐檔開啟時為 true，開完一個檔案不關閉拖放層，
// 讓使用者繼續開下一個；單檔流程不傳，行為不變
function _dispatchWithPending(toolIdx, vendor, keepOverlay) {
  if (!_dropPending) return;
  let wrote = false;
  try {
    localStorage.setItem('_netAnalyzer_pending', JSON.stringify({
      name: _dropPending.name, text: _dropPending.text, ts: Date.now(), vendor: vendor || null
    }));
    wrote = true;
  } catch(e) { alert(tr('drop.pending_too_large')); }
  const w = window.open(TOOLS[toolIdx].href, '_blank');
  if (wrote && !w) { localStorage.removeItem('_netAnalyzer_pending'); alert(tr('drop.popup_blocked')); }
  if (!keepOverlay) setTimeout(() => document.getElementById('drop-overlay').classList.remove('active'), 350);
  _dropPending = null;
  return !!(wrote && w);
}

// 2026-09 資安審查修復：本頁自己在載入時也順手清掉「已過期」的交接 key——使用者若曾經拖放
// 過檔案但流程中斷（例如上面的彈出視窗攔截偵測補上之前就已發生過的舊資料、或其他分頁開了但
// 使用者沒有理它），繞回首頁時不需要專屬處理程序也能清掉殘留，縮小明碼內容的曝險窗口。本頁本身
// 是這些 key 的生產端、不消費任何一個，故只做過期即清，不讀取 .text 內容。
(function(){
  var TTL = {_netAnalyzer_pending:10000, _netAnalyzer_anonThenOpen:30000, _netAnalyzer_anonResult:30000, _netAnalyzer_swParsedModel:30000, _netAnalyzer_fwQuery:30000, _netAnalyzer_swPortQuery:30000, _netAnalyzer_route:30000};
  // 瀏覽器封鎖儲存區時 localStorage 存取本身會丟錯，整段包起來避免中斷後續腳本
  try {
    Object.keys(TTL).forEach(function(k){
      var raw = localStorage.getItem(k);
      if (!raw) return;
      try {
        var d = JSON.parse(raw);
        if (Date.now() - d.ts > TTL[k]) localStorage.removeItem(k);
      } catch(e) { localStorage.removeItem(k); }
    });
  } catch(e) {}
})();

function computeAchievements(activity, summaries, knownTools) {
  const tools = new Set(knownTools || []);
  (activity || []).forEach(a => { if (ACH_TOOLS.includes(a.tool)) tools.add(a.tool); });
  const ids = new Set();
  if (tools.size) ids.add('first');
  if (ACH_TOOLS.every(t => tools.has(t))) ids.add('all5');
  (activity || []).forEach(a => {
    if (!a.ts) return;

// 只支援不壓縮與 deflate，加密／zip64／其他壓縮方式丟出錯誤，該檔視為讀不到
async function _readZipEntries(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('zipFormat');
  const count = dv.getUint16(eocd + 10, true), cdOff = dv.getUint32(eocd + 16, true);
  if (count === 0xffff || cdOff === 0xffffffff) throw new Error('zip64');
  const out = [];
  let p = cdOff;
  for (let n = 0; n < count; n++) {
    if (p + 46 > buf.length || dv.getUint32(p, true) !== 0x02014b50) throw new Error('zipFormat');
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), loff = dv.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(buf.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if (name.endsWith('/') || /(^|\/)__MACOSX\//.test(name) || /(^|\/)\._/.test(name)) continue;
    if (flags & 1) throw new Error('zipEncrypted');
    if (csize === 0xffffffff || loff === 0xffffffff) throw new Error('zip64');
    const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
    const data = buf.subarray(start, start + csize);
    let bytes;
    if (method === 0) bytes = data;
    else if (method === 8) bytes = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else throw new Error('zipMethod');
    out.push({ name, bytes });
  }
  return out;
}
// 拖放檔案展開成 [{name,text}]：zip 內每個檔案各一筆（名稱「壓縮檔/內部路徑」），.gz 解壓後名稱去掉 .gz
async function _readDropEntries(file) {
  const label = n => String(n).replace(/\.gz$/i, '');
  const buf = new Uint8Array(await file.arrayBuffer());
  if (!(buf.length >= 4 && buf[0] === 0x50 && buf[1] === 0x4b && buf[2] === 0x03 && buf[3] === 0x04)) return [{ name: label(file.name), text: await _decodeBytes(buf) }];
  const out = [];
  for (const e of await _readZipEntries(buf)) out.push({ name: file.name + '/' + label(e.name), text: await _decodeBytes(e.bytes) });
  return out;
}
function _readDroppedFiles(files) {
  const myGen = ++_dropGen;
  Promise.all(files.map(f => _readDropEntries(f).catch(() => [{ name: f.name, text: '' }]))).then(lists => {
    if (myGen !== _dropGen) return;
    const items = lists.flat();
    // 彩蛋：檔名含 114514 或 1919810（第二十七輪），同一頁面只提示一次
    if (!window._smellyFileShown && items.some(it => /114514|1919810/.test(it.name || ''))) { window._smellyFileShown = true; setTimeout(() => showEggToast(tr('egg.smelly_yarimasu')), 600); }
    if (items.length === 1) { _showDropResult(items[0].name, items[0].text ? detectTool(items[0].text) : null, items[0].text); return; }
    _showDropMultiResult(items.map(it => ({ ...it, detected: it.text ? detectTool(it.text) : null })));
  });
}
function _openDropMultiItem(i) {
  const it = _dropMultiItems[i];
  if (!it) return;
  _dropPending = { name: it.name, text: it.text };
  const toolIdx = it.detected ? it.detected.idx : 2;
  const ok = _dispatchWithPending(toolIdx, it.detected ? it.detected.vendor : null, true);
  if (ok) {
    it.opened = true;
    const b = document.getElementById('drop-multi-btn-' + i);
    if (b) b.textContent = '✓ ' + b.textContent.replace(/^✓ /, '');
    _lockMultiButtonsUntilConsumed();
  }
}
// 交接競態防護（2026-09-24 新增）：交接 key 一次只存一份，若目標分頁尚未載入就再點另一個檔案，
// 新寫入會覆蓋前一份。開啟後暫停全部多檔按鈕，輪詢到目標分頁取走 key（被移除）或超過 10 秒
// 時限（與 key 本身 TTL 相同，過期後目標分頁也不會再讀取）才恢復
function _lockMultiButtonsUntilConsumed() {
  const btns = [...document.querySelectorAll('[id^="drop-multi-btn-"]')];
  btns.forEach(b => { b.disabled = true; });
  const started = Date.now();
  const timer = setInterval(() => {
    let pending = null;
    try { pending = localStorage.getItem('_netAnalyzer_pending'); } catch (e) { pending = null; }
    if (!pending || Date.now() - started > 10000) {
      clearInterval(timer);
      btns.forEach(b => { b.disabled = false; });
    }
  }, 300);
}
function _showDropMultiResult(items) {
  _dropMultiItems = items;
  _dropPending = null;
  document.getElementById('drop-box').style.display = 'none';
  const result = document.getElementById('drop-result');
  result.style.display = 'flex';
  document.getElementById('drop-chip').textContent = tr('drop.multi_found').replace('{n}', items.length);
  document.getElementById('drop-actions').innerHTML = '';
  document.getElementById('drop-manual-btn').style.display = 'none';
  document.getElementById('drop-choices').classList.remove('open');
  document.getElementById('drop-debug-toggle').style.display = 'none';
  document.getElementById('drop-debug-panel').classList.remove('open');
  const list = document.getElementById('drop-multi-list');
  list.innerHTML = '';
  list.style.display = '';
  // 依 TOOLS 順序分組，無法辨識者排最後（開啟時送往去識別化工具，與單檔「送到去識別化」一致）
  const groups = new Map();
  items.forEach((it, i) => {
    const key = it.detected ? it.detected.idx : -1;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  const keys = [...groups.keys()].sort((a, b) => (a < 0) - (b < 0) || a - b);
  keys.forEach(k => {
    const h = document.createElement('div');
    h.style.cssText = 'font-weight:600;margin:10px 0 4px';
    h.textContent = k >= 0 ? `${TOOLS[k].icon} ${tr(TOOLS[k].id + '.title')}` : `❓ ${tr('drop.unknown')}`;
    list.appendChild(h);
    groups.get(k).forEach(i => {
      const it = items[i];
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border,#334155)';
      const nm = document.createElement('span');
      nm.style.cssText = 'flex:1;word-break:break-all;font-size:13px';
      nm.textContent = it.name + (it.detected && it.detected.vendor ? `（${VENDOR_NAMES[it.detected.vendor] || it.detected.vendor}）` : '');
      const btn = document.createElement('button');
      btn.className = 'da-secondary';
      btn.id = 'drop-multi-btn-' + i;
      btn.textContent = k >= 0 ? tr('drop.open') : `🔒 ${tr('drop.to_anon')}`;
      btn.onclick = () => _openDropMultiItem(i);
      row.append(nm, btn);
      list.appendChild(row);
    });
  });
}

function _showDropResult(name, detected, text) {
  const ml = document.getElementById('drop-multi-list');
  if (ml) { ml.style.display = 'none'; ml.innerHTML = ''; }
  const dt = document.getElementById('drop-debug-toggle');
  if (dt) dt.style.display = '';
  _dropPending = { name, text };
  const box = document.getElementById('drop-box');
  const result = document.getElementById('drop-result');
  const chip = document.getElementById('drop-chip');
  const actions = document.getElementById('drop-actions');
  const choices = document.getElementById('drop-choices');
  const manualBtn = document.getElementById('drop-manual-btn');
  box.style.display = 'none';
  result.style.display = 'flex';
  choices.classList.remove('open');
  if (detected) {
    const vname = detected.vendor ? VENDOR_NAMES[detected.vendor] : null;
    chip.innerHTML = vname
      ? tr('drop.found').replace('{vendor}', `<span class="drop-vendor-badge">${vname}</span>`)
      : tr('drop.found_tool').replace('{tool}', tr(TOOLS[detected.idx].id + '.title'));
    // 2026-09-21 稽核修復：log 格式（idx:4，CEF/Syslog/WinEvent）沒有對應的去識別化轉送鏈
    // 目標——config_anonymizer 的 TOOL_HREFS 只有 3 個元素（fw/sw/gen），TOOL_HREFS[4] 為
    // undefined 會 fallback 錯誤工具，且 log_analyzer 本來就不消費 _netAnalyzer_anonThenOpen/
    // _netAnalyzer_anonResult（明確排除在匿名化轉送鏈目標之外）。故 log 格式不顯示此按鈕。
    const anonThenOpenBtn = detected.idx === 4 ? '' :
      `<button class="da-secondary" onclick='_dispatchWithAnon(${detected.idx},${JSON.stringify(detected.vendor)})'>🔒🔀 ${tr('drop.anon_then_open')}</button>`;
    actions.innerHTML = `
      <button class="da-primary" onclick='_dispatchWithPending(${detected.idx},${JSON.stringify(detected.vendor)})'>${TOOLS[detected.idx].icon} ${tr('drop.open')} ${tr(TOOLS[detected.idx].id+'.title')}</button>
      ${anonThenOpenBtn}
      <button class="da-secondary" onclick="_dispatchWithPending(2,null)">🔒 ${tr('drop.to_anon')}</button>`;
    manualBtn.textContent = tr('drop.manual');
    manualBtn.style.display = '';
  } else {
    chip.textContent = tr('drop.unknown');
    actions.innerHTML = '';
    manualBtn.style.display = 'none';
    choices.classList.add('open');
  }
  choices.innerHTML = TOOLS.map((t, i) =>
    `<button onclick="_dispatchWithPending(${i},null)">${t.icon} ${tr(t.id+'.title')}</button>`
  ).join('');
  _fillDropDebugPanel(text, detected);
}

// 任務 2（2026-09-23 新增）：拖放結果除錯面板——顯示命中規則說明（explainDetectedTool()）
// 與檔案前 8 行內容預覽。一律用 textContent 賦值（非 innerHTML），天生跳脫、無 Stored XSS
// 疑慮，比 innerHTML+esc() 更直接安全。預設收合，每次新結果一律重置為收合狀態，避免上一筆
// 展開狀態誤導使用者以為是這一筆的除錯資訊。
function _fillDropDebugPanel(text, detected) {
  const panel = document.getElementById('drop-debug-panel');
  const toggleBtn = document.getElementById('drop-debug-toggle');
  if (panel) panel.classList.remove('open');
  if (toggleBtn) toggleBtn.textContent = tr('drop.debug_toggle_show');
  const ruleLabelEl = document.getElementById('drop-debug-rule-label');
  const previewLabelEl = document.getElementById('drop-debug-preview-label');
  if (ruleLabelEl) ruleLabelEl.textContent = tr('drop.debug_rule_label');
  if (previewLabelEl) previewLabelEl.textContent = tr('drop.debug_preview_label');
  const ruleTextEl = document.getElementById('drop-debug-rule-text');
  if (ruleTextEl) {
    const reason = detected ? (explainDetectedTool(text) || tr('drop.debug_rule_fallback')) : tr('drop.unknown');
    ruleTextEl.textContent = reason;
  }
  const previewEl = document.getElementById('drop-debug-preview-text');
  if (previewEl) previewEl.textContent = text.split(/\r\n|\r|\n/).slice(0, 8).join('\n');
}
function _toggleDropDebugPanel() {
  const panel = document.getElementById('drop-debug-panel');
  const btn = document.getElementById('drop-debug-toggle');
  if (!panel) return;
  const open = panel.classList.toggle('open');
  if (btn) btn.textContent = tr(open ? 'drop.debug_toggle_hide' : 'drop.debug_toggle_show');
}

function _updateDropText() {
  const h = document.getElementById('drop-hint-txt');
  const s = document.getElementById('drop-sub-txt');
  if (h) h.textContent = tr('drop.hint');
  if (s) s.textContent = tr('drop.sub');
  const b = document.getElementById('drop-bar-txt');
  const p = document.getElementById('drop-bar-btn');
  if (b) b.textContent = tr('drop.bar');
  if (p) p.textContent = tr('drop.pick');
  // 除錯面板收合/展開按鈕文字：語言切換時也要跟著更新（比照面板未開啟的預設文案）
  const dbgBtn = document.getElementById('drop-debug-toggle');
  const dbgPanel = document.getElementById('drop-debug-panel');
  if (dbgBtn) dbgBtn.textContent = tr((dbgPanel && dbgPanel.classList.contains('open')) ? 'drop.debug_toggle_hide' : 'drop.debug_toggle_show');
}

(function(){
  let _dragCounter = 0;
  const overlay = document.getElementById('drop-overlay');
  document.addEventListener('dragenter', e => {
    if (![...e.dataTransfer.types].includes('Files')) return;
    _dragCounter++;
    overlay.classList.add('active');
    document.getElementById('drop-box').style.display = '';
    document.getElementById('drop-result').style.display = 'none';
    _dropPending = null;
  });
  document.addEventListener('dragleave', e => {
    _dragCounter--;
    if (_dragCounter <= 0) { _dragCounter = 0; overlay.classList.remove('active'); }
  });
  document.addEventListener('dragover', e => { e.preventDefault(); });
  document.addEventListener('drop', e => {
    e.preventDefault();
    _dragCounter = 0;
    const files = [...e.dataTransfer.files];
    if (!files.length) { overlay.classList.remove('active'); return; }
    _readDroppedFiles(files);
  });
})();

// 分析工具「交給入口頁判斷」（第二十九輪 NU9）：一次性交接 key `_netAnalyzer_route`（{name,text,from,ts}，TTL 30 秒），
// 取出即清除，以拖放同一套判斷（detectTool）顯示建議的工具
window.addEventListener('load', function () {
  if (/^#gl/.test(location.hash)) openGlossary();
  let d = null;
  try { d = JSON.parse(localStorage.getItem('_netAnalyzer_route') || 'null'); } catch (e) { d = null; }
  try { localStorage.removeItem('_netAnalyzer_route'); } catch (e) {}
  if (!d || typeof d.text !== 'string' || !d.text.trim() || Date.now() - d.ts > 30000) return;
  document.getElementById('drop-overlay').classList.add('active');
  _showDropResult(d.name || 'pasted.txt', detectTool(d.text), d.text);
});
document.getElementById('file-pick').addEventListener('change', function() {
  const files = [...this.files];
  if (!files.length) return;
  this.value = '';
  const overlay = document.getElementById('drop-overlay');
  overlay.classList.add('active');
  document.getElementById('drop-box').style.display = 'none';
  document.getElementById('drop-result').style.display = 'none';
  _readDroppedFiles(files);
});

setLang(loadLangPref());
checkAchievements();
autoLabelControls();

(function(){
  var _rq=0,_rqT;
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    clearTimeout(_rqT);
    _rq++;
    _rqT=setTimeout(function(){_rq=0;},1500);
    if(_rq>=3){_rq=0;showEggToast(tr('egg.rage_quit'));}
  });
})();
document.getElementById('alpaca-btn').title = tr('egg.alpaca');
checkFiles();
(function(){
  var _t = document.createElement('div');
  _t.className = 'global-tip';
  document.body.appendChild(_t);
  document.addEventListener('mouseover', function(e) {
    var el = e.target.closest('[data-tip]');
    if (!el) return;
    _t.textContent = el.dataset.tip;
    _t.style.display = 'block';
    var r = el.getBoundingClientRect(), tw = _t.offsetWidth, th = _t.offsetHeight;
    var x = r.left + r.width / 2 - tw / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
    var y = r.top - th - 8;
    _t.style.left = x + 'px';
    _t.style.top = (y < 8 ? r.bottom + 8 : y) + 'px';
  });
  document.addEventListener('mouseout', function(e) { if (e.target.closest('[data-tip]')) _t.style.display = 'none'; });
  document.addEventListener('scroll', function() { _t.style.display = 'none'; }, true);
})();
