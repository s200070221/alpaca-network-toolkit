<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src data:; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Network Analyzer Suite</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦙</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;
  --border:#1e3a5f;--text:#e2e8f0;--text-dim:#64748b;--text-mid:#94a3b8;
  --accent:#00d4ff;--accent2:#7dd3fc;
}
:root[data-theme="light"],body[data-theme="light"]{
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#f8fafc;
  --border:#cbd5e1;--text:#1e293b;--text-dim:#475569;--text-mid:#64748b;
  --accent:#0090b8;--accent2:#0284c7;
}
body{font-family:'Noto Sans TC','IBM Plex Sans TC',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

/* ── Header ────────────────────────────────────────────────── */
.header{padding:28px 40px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{font-size:32px;line-height:1}
.logo-text h1{font-size:22px;font-weight:700;
  background:linear-gradient(90deg,#00d4ff,#7dd3fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-text p{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:2px}

.lang-bar{display:flex;gap:6px}
.lang-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  padding:5px 12px;font-size:11px;color:var(--text-dim);cursor:pointer;
  transition:border-color .15s,color .15s;font-family:inherit}
.lang-btn:hover,.lang-btn.active{border-color:var(--accent);color:var(--accent)}

/* ── Hero ──────────────────────────────────────────────────── */
.hero{padding:36px 40px 0;text-align:center}
.hero-sub{font-size:13px;color:var(--text-dim);margin-top:6px}

/* ── 任務入口（XN52）────────────────────────────────────────── */
.tasks{padding:24px 40px 0}
.tasks-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
.tasks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.task-card h3{font-size:14px;font-weight:700;color:var(--text);margin:0}
.task-card p{font-size:12px;color:var(--text-mid);line-height:1.6;margin:0}
.task-links{display:flex;flex-wrap:wrap;gap:6px}
.task-links a{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);text-decoration:none}
.task-links a:hover{background:var(--accent);color:#fff}
.task-card details summary{cursor:pointer;font-size:12px;color:var(--text-dim)}
.task-card[data-task="breach"]{grid-column:1/-1}
/* 網站憑證檢查（XN101） */
.cert-card{margin:0 40px 16px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;gap:10px}
.cert-intro,.cert-hint{font-size:12px;color:var(--text-mid);line-height:1.6;margin:0}
.cert-howto summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.cert-howto[open] summary{margin-bottom:8px}
.cert-field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-mid);margin-bottom:8px}
.cert-field input{font-size:13px;padding:5px 8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;min-width:0}
.cert-inline{flex-direction:row;align-items:center;flex-wrap:wrap;margin:0}
.cert-inline input[type=number]{width:80px}
.cert-tabs{display:flex;gap:6px;margin-bottom:8px}
.cert-tabs button{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
.cert-tabs button[aria-selected=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
.cert-steps{margin:0 0 6px;padding-left:20px;font-size:12px;color:var(--text-mid);line-height:1.7}
.cert-cmd{display:flex;gap:6px;align-items:flex-start;margin:4px 0 6px}
.cert-cmd code{flex:1;min-width:0;font-size:12px;padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.cert-copy,.cert-dl,.cert-filebtn,.cert-res-bar button{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;white-space:nowrap}
.cert-primary{font-size:13px;padding:6px 16px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.cert-sub{font-size:13px;font-weight:600;color:var(--text);margin-top:4px}
#cert-paste{width:100%;box-sizing:border-box;font:12px/1.5 ui-monospace,Consolas,monospace;padding:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;resize:vertical}
.cert-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.cert-table{width:100%;border-collapse:collapse;font-size:12px}
.cert-table th,.cert-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.cert-table a{color:var(--accent)}
.cert-res-bar{display:flex;justify-content:flex-end;margin-bottom:6px}
.cert-host{border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-top:8px}
.cert-host summary{cursor:pointer;font-size:13px;font-weight:600}
.cert-findings,.cert-chain{margin:6px 0;padding-left:20px;font-size:12px;line-height:1.7;color:var(--text)}
.cert-sev{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;font-weight:600}
.cert-sev-high{background:rgba(239,68,68,.15);color:#dc2626}
.cert-sev-medium{background:rgba(245,158,11,.18);color:#b45309}
.cert-sev-low{background:rgba(59,130,246,.15);color:#2563eb}
.cert-sev-info{background:rgba(148,163,184,.2);color:var(--text-mid)}
.cert-tls{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:4px 0}
.cert-tls span{padding:2px 8px;border-radius:6px;border:1px solid var(--border)}
.cert-tls-yes{color:var(--text)}
.cert-tls-no,.cert-tls-untested{color:var(--text-dim)}
.cert-empty{font-size:13px;color:var(--text-mid)}
@media(max-width:720px){.cert-card{margin:0 16px 16px}}
/* UX35：本機儲存資料面板 */
.ls-table .ls-col-size{white-space:nowrap;word-break:normal!important}
@media(max-width:720px){.ls-table .ls-col-tool{display:none}}
.task-steps{margin:0;padding-left:18px;font-size:12px;color:var(--text-mid);line-height:1.6;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));column-gap:28px;row-gap:4px}
.task-steps li{margin:0}
.task-drop{font-size:12px;color:var(--text-dim);margin:8px 0 0}
@media (max-width:600px){.tasks{padding:20px 16px 0}}

/* ── Cards grid ────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;padding:32px 40px;flex:1}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:24px;display:flex;flex-direction:column;gap:16px;
  transition:border-color .2s,transform .2s,box-shadow .2s;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--card-color,#00d4ff),transparent)}
.card:hover{border-color:var(--card-color,#00d4ff);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4)}

.card-icon{font-size:36px;line-height:1}
.card-title{font-size:16px;font-weight:700;color:var(--text);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card-badge{font-size:11px;font-family:'JetBrains Mono',monospace;
  background:rgba(0,212,255,.12);color:var(--accent);border-radius:4px;padding:2px 6px}
.card-badge-experimental{background:rgba(245,158,11,.15);color:#f59e0b;margin-left:4px}
.card-desc{font-size:12px;color:var(--text-mid);line-height:1.7;flex:1}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-family:'JetBrains Mono',monospace;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;padding:2px 7px;color:var(--text-dim)}
.card-features{border-top:1px solid var(--border);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.feat{font-size:11px;color:var(--text-mid);display:flex;align-items:center;gap:4px}
.feat::before{content:'✓';color:var(--card-color,#00d4ff);font-size:10px;font-weight:700}

.card-open{margin-top:4px;background:linear-gradient(135deg,var(--card-color,#00d4ff) 0%,rgba(0,212,255,.6) 100%);
  border:none;border-radius:8px;padding:10px 0;font-size:12px;font-weight:600;
  color:#0a0e1a;cursor:pointer;font-family:inherit;
  transition:opacity .15s,transform .15s}
.card-open:hover{opacity:.9;transform:scale(.99)}

/* ── Footer ─────────────────────────────────────────────────── */
.footer{padding:16px 40px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.footer-note{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
.alpaca{opacity:.7;transition:opacity .2s;cursor:default;line-height:1}
.alpaca:hover{opacity:1}

/* ── Drop hint bar ──────────────────────────────────────────────── */
.drop-hint-bar{margin:0 40px 24px;border:1.5px dashed var(--border);border-radius:10px;
  padding:13px 20px;display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--text-dim);font-size:12px;cursor:pointer;
  transition:border-color .2s,background .2s,color .2s}
.drop-hint-bar:hover{border-color:var(--accent);background:rgba(0,212,255,.04);color:var(--text-mid)}
.drop-hint-bar .dhb-pick{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);
  color:var(--accent);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;
  font-family:inherit;transition:background .15s;flex-shrink:0}
.drop-hint-bar .dhb-pick:hover{background:rgba(0,212,255,.22)}
.drop-hint-hero{margin:18px 40px 0;padding:22px 20px;font-size:14px;flex-wrap:wrap}
.drop-hint-hero .dhb-pick{font-size:13px;padding:6px 16px}
.hero-steps{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin:14px 0 0;padding:0;font-size:12px;color:var(--text-mid);counter-reset:hs}
.hero-steps li{counter-increment:hs;display:flex;align-items:center;gap:6px}
.hero-steps li::before{content:counter(hs);display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(0,212,255,.15);color:var(--accent);font-weight:700;font-size:11px}
.card-actions{display:flex;gap:8px;margin-top:4px}
.card-actions .card-open{flex:1;margin-top:0}
.card-demo{background:transparent;border:1px solid var(--card-color,#00d4ff);color:var(--text-mid);border-radius:8px;padding:10px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.card-demo:hover{background:var(--surface2)}
.card-tags:not(.open) .tag:nth-of-type(n+11){display:none}
.tag-more{font-size:11px;background:none;border:1px dashed var(--border);border-radius:4px;padding:2px 7px;color:var(--accent);cursor:pointer;font-family:inherit}
@media(max-width:600px){.drop-hint-hero{margin:14px 16px 0}.hero{padding:24px 16px 0}}

/* ── Konami bounce ───────────────────────────────────────────────── */
@keyframes card-bounce{
  0%,100%{transform:translateY(0)}
  20%{transform:translateY(-14px)}
  50%{transform:translateY(-7px)}
  70%{transform:translateY(-11px)}
}
.card-bounce{animation:card-bounce .65s ease}

/* ── Alpaca parade ───────────────────────────────────────────────── */
@keyframes alpaca-run{from{transform:translateX(110vw)}to{transform:translateX(-110vw)}}
.alpaca-parade{position:fixed;bottom:24px;left:0;white-space:nowrap;
  font-size:30px;z-index:999;pointer-events:none;
  animation:alpaca-run 3.2s linear forwards}

/* ── Logo egg toast ──────────────────────────────────────────────── */
.egg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;cursor:pointer}
.egg-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--surface);border:1px solid var(--accent);border-radius:14px;
  padding:28px 36px;z-index:1001;min-width:300px;text-align:center;
  box-shadow:0 0 40px rgba(0,212,255,.25);pointer-events:none}
.egg-toast-icon{font-size:36px;margin-bottom:10px}
.egg-toast-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:18px}
.egg-stat-row{display:flex;justify-content:space-between;align-items:center;
  gap:20px;margin:7px 0;font-size:12px}
.egg-stat-val{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700}
.egg-toast-hint{margin-top:18px;font-size:10px;color:var(--text-dim);
  font-family:'JetBrains Mono',monospace}

/* ── Notice bar ─────────────────────────────────────────────────── */
.notice{margin:16px 40px 0;padding:8px 16px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);
  border-radius:8px;font-size:12px;color:#fbbf24;text-align:center;
  font-family:'JetBrains Mono',monospace;line-height:1.5}

/* ── Phase 4 第 17 項：hub 顯示 config_anonymizer 最近處理摘要 ─────────────────── */
.recent-anon-card{margin:0 40px 8px;padding:12px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;font-size:12px}
.recent-anon-title{font-weight:600;color:var(--text-dim,#94a3b8);margin-bottom:6px}
.recent-anon-item{color:var(--text);padding:2px 0}
.recent-anon-empty{color:var(--text-dim,#94a3b8)}

.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 16px}
.gl-item>summary{cursor:pointer;color:var(--text);font-weight:600;padding:3px 0}
.gl-item>div{color:var(--text-dim,#94a3b8);line-height:1.6;padding:2px 0 6px 14px}
/* ── Klingon lang btn ────────────────────────────────────────────── */
#lang-klingon{border-color:#c0392b;color:#e74c3c}
#lang-klingon:hover,#lang-klingon.active{border-color:#e74c3c;color:#ff6b6b;
  box-shadow:0 0 8px rgba(231,76,60,.4)}
/* ── Easter egg lang btns ────────────────────────────────────────── */
#lang-pirate{border-color:#b45309;color:#f59e0b}
#lang-pirate:hover,#lang-pirate.active{border-color:#f59e0b;color:#fcd34d;box-shadow:0 0 8px rgba(245,158,11,.4)}
#lang-leet{border-color:#047857;color:#10b981}
#lang-leet:hover,#lang-leet.active{border-color:#10b981;color:#6ee7b7;box-shadow:0 0 8px rgba(16,185,129,.4)}
#lang-emoji{border-color:#7c3aed;color:#a78bfa}
#lang-emoji:hover,#lang-emoji.active{border-color:#a78bfa;color:#c4b5fd;box-shadow:0 0 8px rgba(167,139,250,.4)}
#lang-uwu{border-color:#be185d;color:#f472b6}
#lang-uwu:hover,#lang-uwu.active{border-color:#f472b6;color:#fbcfe8;box-shadow:0 0 8px rgba(244,114,182,.4)}
#lang-bureau{border-color:#475569;color:#94a3b8}
#lang-bureau:hover,#lang-bureau.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.4)}
#lang-cat{border-color:#c2410c;color:#fb923c}
#lang-cat:hover,#lang-cat.active{border-color:#fb923c;color:#fdba74;box-shadow:0 0 8px rgba(251,146,60,.4)}
#lang-bean{border-color:#b45309;color:#4ade80}
#lang-bean:hover,#lang-bean.active{border-color:#fbbf24;color:#bbf7d0;box-shadow:0 0 8px rgba(74,222,128,.4)}
#lang-alpaca{border-color:#92400e;color:#fcd34d}
#lang-alpaca:hover,#lang-alpaca.active{border-color:#fcd34d;color:#fef3c7;box-shadow:0 0 8px rgba(252,211,77,.4)}#lang-yanse{border-color:#64748b;color:#94a3b8}#lang-yanse:hover,#lang-yanse.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.3)}#lang-wuxia{border-color:#7f1d1d;color:#fca5a5}#lang-wuxia:hover,#lang-wuxia.active{border-color:#fca5a5;color:#fecaca;box-shadow:0 0 8px rgba(252,165,165,.4)}
/* ── Lang egg triggers ───────────────────────────────────────────── */
.lang-egg{opacity:.25;cursor:pointer;font-size:14px;padding:2px 3px;
  user-select:none;transition:opacity .2s}
.lang-egg:hover{opacity:.7}

/* ── Qapla toast ─────────────────────────────────────────────────── */
.qapla-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:#1a0a0a;border:1px solid #e74c3c;border-radius:10px;
  padding:12px 24px;z-index:2000;font-size:13px;color:#ff6b6b;
  font-family:'JetBrains Mono',monospace;white-space:nowrap;pointer-events:none;
  box-shadow:0 0 20px rgba(231,76,60,.4);
  animation:qapla-in .3s ease,qapla-out .4s ease 2s forwards}
@keyframes qapla-in{from{opacity:0;top:0}to{opacity:1;top:24px}}
@keyframes qapla-out{to{opacity:0;top:0}}

/* ── Missing card ────────────────────────────────────────────────── */
.card-missing{opacity:.55;cursor:default}
.card-missing:hover{border-color:var(--border)!important;transform:none!important;box-shadow:none!important}
.card-warn{margin-top:4px;padding:9px 12px;
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);
  border-radius:8px;font-size:11px;color:#fbbf24;text-align:center;
  font-family:'JetBrains Mono',monospace}

@media(max-width:600px){
  .header,.cards,.hero,.footer{padding-left:20px;padding-right:20px}
  /* 手機版（2026-09-29，UC）：語言／彩蛋圖示列換行，避免主題與工具選單按鈕被推出畫面 */
  .header{flex-wrap:wrap;gap:10px}
  .lang-bar{flex-wrap:wrap}
  .notice{margin-left:20px;margin-right:20px}
  .cards{grid-template-columns:1fr}
}
.global-tip{position:fixed;display:none;z-index:99999;pointer-events:none;background:#1e2035;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:7px 11px;font-size:11px;line-height:1.6;max-width:260px;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 14px rgba(0,0,0,.45);font-weight:400;font-family:inherit;text-transform:none;letter-spacing:0}
/* ── Drop Overlay ─────────────────────────────────────────── */
.drop-overlay{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:rgba(10,14,26,.92);backdrop-filter:blur(6px)}
.drop-overlay.active{display:flex}
.drop-box{border:2px dashed #00d4ff;border-radius:16px;padding:40px 60px;text-align:center;color:#fff;font-size:18px;pointer-events:none;animation:drop-pulse 1.5s ease-in-out infinite}
.drop-box small{display:block;font-size:12px;opacity:.5;margin-top:8px}
@keyframes drop-pulse{0%,100%{border-color:#00d4ff}50%{border-color:#4ade80}}
.drop-result-chip{font-size:15px;padding:10px 24px;border-radius:10px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;text-align:center}
.drop-vendor-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:#0d1b2a;border:1px solid #00d4ff;color:#00d4ff;margin-left:6px}
.drop-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.da-primary{padding:9px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#00d4ff,#4ade80);color:#000;font-weight:700;font-size:13px;cursor:pointer}
.da-secondary{padding:9px 20px;border-radius:8px;border:1px solid #a78bfa;background:none;color:#a78bfa;font-size:13px;cursor:pointer}
.da-secondary:hover{background:#a78bfa;color:#000}
.da-primary:hover{opacity:.85}
.drop-manual-btn{font-size:11px;color:#64748b;cursor:pointer;border:none;background:none;text-decoration:underline dotted;padding:0}
.drop-manual-btn:hover{color:#e2e8f0}
.drop-choices{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
.drop-choices.open{display:flex}
.drop-choices button{padding:7px 16px;border-radius:8px;font-size:12px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer}
.drop-choices button:hover{border-color:#00d4ff;color:#00d4ff}
.drop-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;line-height:1;z-index:1}
.drop-close:hover{color:#e2e8f0}
/* ── 拖放結果除錯面板（task 2，2026-09-23 新增）：預設收合，避免洗版 ─────────── */
.drop-debug-toggle{font-size:11px;color:#64748b;cursor:pointer;border:none;background:none;text-decoration:underline dotted;padding:0}
.drop-debug-toggle:hover{color:#e2e8f0}
.drop-debug-panel{display:none;max-width:520px;width:100%;text-align:left;background:#0d1b2a;border:1px solid #334155;border-radius:10px;padding:10px 14px;font-size:12px;color:#cbd5e1}
.drop-debug-panel.open{display:block}
.drop-debug-panel .ddp-label{font-weight:600;color:#94a3b8;margin:6px 0 4px}
.drop-debug-panel .ddp-label:first-child{margin-top:0}
.drop-debug-panel pre{white-space:pre-wrap;word-break:break-all;background:#020617;border-radius:6px;padding:8px;margin:0;font-family:'JetBrains Mono',monospace;font-size:11px;max-height:160px;overflow:auto}
@media print{
  .header,.cards{page-break-inside:avoid}
  .upload-actions,.lang-bar,.drop-zone{display:none!important}
  body{background:#fff!important;color:#000!important}
  .card{border:1px solid #ccc;box-shadow:none}
  @page{margin:1.5cm}
}
/* UX29：手機寬度加大點擊目標（至少 32px）；7 頁相同，只影響 ≤720px */
@media (max-width:720px){

  #gl-search{min-height:32px}
  .fwq-btn{min-width:32px;text-align:center}
  #issues-card select,#ls-panel button{min-height:32px}
}

    <button id="theme-btn" onclick="toggleTheme()" title="切換明/暗模式" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 8px;margin-left:auto;line-height:1">☀️</button>

      <span style="display:block;padding:6px 10px;border-radius:6px;color:var(--accent);font-size:12px;margin-bottom:2px;font-weight:600">✓ <span data-i18n="nav.tool_network">總覽 / Hub</span></span>
      <a href="switch-config-parser.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_switch">交換器解析</a>
      <a href="switch-config-generator.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_gen">交換器產生器</a>
      <a href="firewall-analyzer-fixed.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_fw">防火牆分析</a>

      <a href="#glossary" onclick="openGlossary()" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px;border-top:1px solid var(--border);margin-top:4px;padding-top:8px" data-i18n="nav.glossary">📖 術語小辭典</a>

<div class="hero">
  <p class="hero-sub" id="h-hero"></p>
  <!-- 第一次使用（第二十九輪 NU4）：三步驟說明，拖放區從頁尾移到最上方 -->

</div>

<!-- 任務入口（XN52）：先問要做什麼，再給工具與取得檔案的方法 -->
<section class="tasks" id="tasks" aria-labelledby="tasks-title"><h2 class="tasks-title" id="tasks-title"></h2><div class="tasks-grid" id="tasks-grid"></div><p class="task-drop" id="tasks-drop"></p></section>

<div class="notice" id="h-notice"></div>

<div class="cards" id="cards"></div>

<!-- 網站憑證檢查（XN101）：抓取腳本＋離線分析；程式在 cert-check.js、cert-roots.js、cert-scripts.js、hub-cert.js -->
<section class="cert-card" id="certcheck" aria-labelledby="cert-title">
  <h2 class="tasks-title" id="cert-title"></h2>
  <p class="cert-intro" id="cert-intro"></p>
  <details class="cert-howto" id="cert-howto" open>
    <summary id="cert-howto-sum"></summary>
    <label class="cert-field"><span id="cert-targets-lbl"></span><input type="text" id="cert-targets" value="example.com" spellcheck="false" autocomplete="off"></label>
    <div class="cert-tabs" id="cert-tabs" role="tablist"><button type="button" role="tab" data-cert-os="win"></button><button type="button" role="tab" data-cert-os="linux"></button><button type="button" role="tab" data-cert-os="mac"></button></div>
    <div id="cert-howto-body"></div>
  </details>
  <div class="cert-sub" id="cert-step2"></div>
  <textarea id="cert-paste" rows="4" spellcheck="false"></textarea>
  <div class="cert-row">
    <button type="button" class="cert-primary" id="cert-run"></button>
    <label class="cert-filebtn"><span id="cert-upload-lbl"></span><input type="file" id="cert-file" multiple accept=".json,.txt,.pem,.crt,.cer,.der" hidden></label>
    <label class="cert-filebtn"><span id="cert-roots-lbl"></span><input type="file" id="cert-roots-file" multiple accept=".pem,.crt,.cer,.der" hidden></label>
    <span class="cert-hint" id="cert-roots-n"></span>
  </div>
  <div class="cert-row">
    <label class="cert-field cert-inline"><span id="cert-warn-lbl"></span><input type="number" id="cert-warn" value="30" min="1" max="3650"></label>
    <label class="cert-field cert-inline"><span id="cert-host-lbl"></span><input type="text" id="cert-host" spellcheck="false" autocomplete="off"></label>
  </div>
  <div id="cert-result"></div>
  <p class="cert-hint" id="cert-note"></p>
</section>

<div class="recent-anon-card" id="recent-anon-card">
  <div class="recent-anon-title" id="recent-anon-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <span id="recent-anon-title-text"></span>
    <span class="recent-anon-clear" id="recent-anon-clear-btn" onclick="clearRecentAnonHistory()" style="cursor:pointer;font-weight:400;font-size:11px;color:var(--text-dim,#94a3b8);text-decoration:underline"></span>
  </div>
  <div id="recent-anon-list"></div>
</div>

<!-- 任務 1（2026-09-23 新增）：跨工具活動時間軸——合併上方 config_anonymizer 專用的
     rolling-history 與其餘工具共用的 `_netAnalyzer_activityHistory`，統一顯示；不砍掉重寫
     上面那張既有卡片，用另一張卡片組合呈現 -->
<div class="recent-anon-card" id="activity-timeline-card">
  <div class="recent-anon-title" id="activity-timeline-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <span id="activity-timeline-title-text"></span>
    <span style="display:flex;align-items:center;gap:10px">
      <select id="activity-timeline-filter" aria-labelledby="activity-timeline-title-text" onchange="renderActivityTimeline()" style="font-size:11px;padding:1px 4px;max-width:160px"></select>
      <span class="recent-anon-clear" id="activity-timeline-export-btn" onclick="exportActivityTimeline()" style="cursor:pointer;font-weight:400;font-size:11px;color:var(--text-dim,#94a3b8);text-decoration:underline"></span>
      <span class="recent-anon-clear" id="activity-timeline-clear-btn" onclick="clearActivityTimeline()" style="cursor:pointer;font-weight:400;font-size:11px;color:var(--text-dim,#94a3b8);text-decoration:underline"></span>
    </span>
  </div>
  <div id="activity-timeline-list"></div>
</div>

<!-- 成就徽章（2026-10-14，第二十四輪 ED）：依活動紀錄解鎖，存在持續性 key `_netAnalyzer_achievements` -->
<div class="recent-anon-card" id="ach-card">
  <div class="recent-anon-title"><span id="ach-title"></span></div>
  <div id="ach-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
</div>

<!-- 綜合健檢報告（2026-09-30 新增，第八輪 XA）：彙整交換器／防火牆／log 分析工具寫入的
     `_netAnalyzer_summaries`（每台最新一筆），可下載 Markdown 報告 -->
<div class="recent-anon-card" id="health-summary-card">
  <div class="recent-anon-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <span id="health-summary-title"></span>
    <span style="display:flex;align-items:center;gap:10px">
      <span class="recent-anon-clear" id="health-summary-dl-btn" role="button" tabindex="0" onclick="downloadHubHealthReport()" style="cursor:pointer;font-weight:400;font-size:11px;color:var(--text-dim,#94a3b8);text-decoration:underline"></span>
      <span class="recent-anon-clear" id="health-summary-clear-btn" role="button" tabindex="0" onclick="clearHealthSummary()" style="cursor:pointer;font-weight:400;font-size:11px;color:var(--text-dim,#94a3b8);text-decoration:underline"></span>
    </span>
  </div>
  <div id="health-summary-list"></div>
</div>

<!-- 工作區打包（2026-10-07，第十二輪 MH）：各工具存在本機瀏覽器的設定匯出成一個 JSON 檔，換電腦或交接時還原 -->
<div class="recent-anon-card" id="workspace-card">
  <div class="recent-anon-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <span id="ws-title"></span>
    <span style="display:flex;align-items:center;gap:10px">
      <span class="recent-anon-clear" id="ws-export-btn" role="button" tabindex="0" onclick="exportWorkspace()" style="cursor:pointer;font-weight:400;font-size:11px;color:var(--text-dim,#94a3b8);text-decoration:underline"></span>
      <span class="recent-anon-clear" id="ws-import-btn" role="button" tabindex="0" onclick="document.getElementById('ws-import-input').click()" style="cursor:pointer;font-weight:400;font-size:11px;color:var(--text-dim,#94a3b8);text-decoration:underline"></span>
      <input type="file" id="ws-import-input" accept=".json,application/json" style="display:none" onchange="loadWorkspaceFile(this.files[0]);this.value=''">
    </span>
  </div>
  <div id="ws-desc" style="font-size:12px;color:var(--text-dim,#94a3b8);margin-bottom:6px"></div>
  <label style="font-size:12px;display:flex;gap:6px;align-items:flex-start"><input type="checkbox" id="ws-include-content" onchange="document.getElementById('ws-attach-row').style.display=this.checked?'':'none'"><span id="ws-include-content-lbl"></span></label>
  <div id="ws-attach-row" style="display:none;font-size:12px;margin:6px 0 0 22px">
    <span id="ws-attach-lbl"></span> <input type="file" id="ws-attach-input" multiple accept=".json,.csv,.txt">
    <div id="ws-attach-hint" style="color:var(--yellow,#f59e0b);margin-top:2px"></div>
  </div>
  <div id="ws-result" style="font-size:12px;margin-top:6px"></div>
  <!-- 本機儲存資料盤點與清除（XN104）：只列 key 與大小，不顯示內容 -->
  <details id="ls-panel" style="margin-top:8px;font-size:12px" ontoggle="if(this.open)renderLsPanel()">
    <summary id="ls-summary" style="cursor:pointer"></summary>
    <div id="ls-desc" style="color:var(--text-dim,#94a3b8);margin:4px 0"></div>
    <div id="ls-body" style="overflow-x:auto"></div>
    <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
      <button type="button" id="ls-clear-sel" style="font-size:12px" onclick="lsClearSelected()"></button>
      <button type="button" id="ls-clear-all" style="font-size:12px" onclick="lsClearAll()"></button>
      <span id="ls-status" style="color:var(--green,#22c55e)"></span>
    </div>
  </details>
</div>


<!-- 術語小辭典（第二十九輪 NU8）：各工具常見名詞的白話說明，可搜尋；#glossary 或 #gl-<id> 直接開啟 -->
<div class="recent-anon-card" id="glossary">
  <div class="recent-anon-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
    <span id="gl-title"></span>

  <div id="gl-intro" style="font-size:12px;color:var(--text-dim,#94a3b8);margin-bottom:6px"></div>
  <div id="gl-list" class="gl-list"></div>

</div>
