# 推送 v* tag 時自動發版：檢查版號一致 → build-standalone.ps1 產生單檔 → SHA256SUMS（LF）→ 建立 GitHub Release
# 發版前先在 toolkit-version.js 改 TOOLKIT_VERSION、CHANGELOG 第一筆、sw.js 的 CACHE（三者與 tag 相同），推上 main 後再推 tag。
# 手動執行（workflow_dispatch）預設為試跑：只檢查版號、打包、驗證雜湊，不建立 Release；勾選 publish 時由 workflow 在該 commit 建立 tag 與 Release
# （雲端工作階段不能推 tag 也不能呼叫建立 Release 的 API，改用這個方式發版）。
# 只用 actions/checkout（已釘 commit SHA）；在 Windows runner 以 Windows PowerShell 5.1 執行，產物格式與本機發版相同。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '試跑用的版號 tag（例如 v2026.10.22.1，須與 toolkit-version.js 一致）'
        required: true
      publish:
        description: '正式發布（建立 tag 與 Release）；不勾為試跑'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 's200070221/alpaca-network-toolkit'
    runs-on: windows-latest
    permissions:
      contents: write
      # 建置來源證明（XN86）：以 GitHub OIDC 簽署 dist 單檔的來源，使用者可用 gh attestation verify 驗證檔案確實由本 workflow 產出
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: 檢查版號一致並產生 Release 說明
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/notes.js" <<'EOF'
          const fs = require('fs');
          const tag = process.env.TAG, ver = tag.replace(/^v/, '');
          const src = fs.readFileSync('toolkit-version.js', 'utf8').replace(/\r\n/g, '\n');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const tv = (src.match(/const TOOLKIT_VERSION = '([^']+)'/) || [])[1];
          const first = (src.match(/const CHANGELOG = \[\s*\{\s*version: '([^']+)'/) || [])[1];
          const cache = (sw.match(/const CACHE = 'alpaca-toolkit-([^']+)'/) || [])[1];
          const bad = [['TOOLKIT_VERSION', tv], ['CHANGELOG 第一筆', first], ['sw.js CACHE', cache]].filter(([, v]) => v !== ver);
          if (bad.length) { console.error(`tag ${tag} 與 ${bad.map(([k, v]) => k + '=' + v).join('、')} 不一致`); process.exit(1); }
          const start = src.indexOf(`version: '${ver}'`), next = src.indexOf("version: '", start + 10);
          const block = src.slice(start, next < 0 ? undefined : next);
          const items = lang => { const m = block.match(new RegExp(lang + ':\\s*\\[([\\s\\S]*?)\\]')); return m ? [...m[1].matchAll(/'((?:[^'\\]|\\.)*)'/g)].map(x => x[1].replace(/\\'/g, "'")) : []; };
          const zh = items('zhTW'), en = items('en');
          if (!zh.length || !en.length) { console.error('CHANGELOG 第一筆缺少 zhTW 或 en 條目'); process.exit(1); }
          const notes = '下載下方任一 `.html` 單檔即可離線使用（已把所有 `.js` 合併進單一檔案），或直接使用 [GitHub Pages](https://s200070221.github.io/alpaca-network-toolkit/)（開過一次後斷網也能使用，並可安裝成桌面 App）。\n\n' +
            '## 本版新增\n' + zh.map(x => '- ' + x).join('\n') + '\n\n## What\'s new\n' + en.map(x => '- ' + x).join('\n') + '\n';
          fs.writeFileSync(process.env.RUNNER_TEMP + '/notes.md', notes);
          console.log(notes);
          EOF
          node "$RUNNER_TEMP/notes.js"

      - name: 產生單檔（build-standalone.ps1）
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build-standalone.ps1

      - name: 計算 SHA256（LF 換行、不含 index.html）並驗證
        run: |
          cd dist
          rm -f index.html
          ls *.html
          sha256sum *.html | sed 's/ \*/  /' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          if grep -q $'\r' SHA256SUMS.txt; then echo 'SHA256SUMS.txt 含 CR'; exit 1; fi
          { cat "$RUNNER_TEMP/notes.md"
            printf '\n## SHA256\n驗證方式（PowerShell）：`Get-FileHash 檔名 -Algorithm SHA256`；Linux／macOS：`sha256sum -c SHA256SUMS.txt`\n'
            printf '確認檔案由本專案的發版流程產出（需要 GitHub CLI）：`gh attestation verify 檔名 --repo %s`\n\n```\n' "$GITHUB_REPOSITORY"
            cat SHA256SUMS.txt
            printf '```\n'; } > "$RUNNER_TEMP/body.md"

      # 發佈分三段：先建草稿並上傳全部單檔 → 產生建置來源證明 → 最後才發佈。
      # Release 設為不可變更（immutable releases）時，檔案只能在草稿階段上傳；來源證明失敗時 Release 停在草稿、不會公開
      - name: 建立 Release 草稿並上傳單檔
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # 推 tag 觸發時 tag 已存在；手動發布時在這次執行的 commit 建立 tag（草稿發佈時才建立）
          if [ "$GITHUB_EVENT_NAME" = push ]; then opt=--verify-tag; else opt="--target $GITHUB_SHA"; fi
          gh release create "$TAG" dist/*.html dist/SHA256SUMS.txt --draft --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/body.md" $opt
          # 確認草稿上的檔案數與 dist 一致再往下（7 個單檔＋SHA256SUMS.txt）
          want=$(ls dist/*.html dist/SHA256SUMS.txt | wc -l)
          got=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "草稿檔案：$got／$want"
          [ "$got" = "$want" ] || { echo '草稿上的檔案數不符'; exit 1; }

      - name: 建置來源證明（build provenance）
        if: github.event_name == 'push' || inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.html'

      - name: 發佈 Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
