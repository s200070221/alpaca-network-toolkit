<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src data:; img-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<!-- preload:begin（scripts/sync_preload.py 產生，勿手改） -->
<link rel="preload" as="script" href="toolkit-version.js">
<link rel="preload" as="script" href="switch-generator-device-models.js">
<link rel="preload" as="script" href="switch-generator-models.js">
<link rel="preload" as="script" href="panel-svg.js">
<link rel="preload" as="script" href="switch-analyzer-panel.js">
<link rel="preload" as="script" href="topo-designer-i18n.js">
<link rel="preload" as="script" href="topo-designer.js">
<!-- preload:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拓樸設計（試作）</title>
<style>
:root{--surface:var(--card);--text-dim:var(--dim);--bg:#f5f6f8;--card:#fff;--text:#1f2328;--dim:#59636e;--border:#d0d7de;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--chip:#eef1f4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--text:#e6edf3;--dim:#9198a1;--border:#30363d;--accent:#4493f8;--green:#3fb950;--red:#f85149;--yellow:#d29922;--chip:#21262d}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--dim:#9198a1;--border:#30363d;--accent:#4493f8;--green:#3fb950;--red:#f85149;--yellow:#d29922;--chip:#21262d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card)}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 8px}
.hint{color:var(--dim);font-size:13px;margin:4px 0 8px}
.notice{border-left:4px solid var(--yellow);padding:8px 12px;background:var(--chip);border-radius:4px;font-size:13px}
.btn{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin:6px 0}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--dim);gap:2px;min-width:0}
.txt,select{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:5px 8px;font:inherit;max-width:100%}
#td-model{max-width:min(420px,100%)}
.end{border:1px solid var(--border);border-radius:6px;padding:6px 10px}
.end b{font-size:12px}
.exp-badge{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;font-weight:600;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;vertical-align:middle}
[hidden]{display:none!important}
.msg{min-height:1.4em;font-size:13px;color:var(--green)}
.msg.bad{color:var(--red)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600;white-space:nowrap}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
#td-canvas{overflow-x:auto}
footer{color:var(--dim);font-size:12px;text-align:center;padding:16px}
a{color:var(--accent)}
/* UX40：寬螢幕兩欄（畫布在左、操作面板在右且固定），窄螢幕單欄依 td-o* 順序 */
main.td-grid{max-width:1500px;display:flex;flex-direction:column}
.td-col{display:contents}
.td-o1{order:1}.td-o2{order:2}.td-o3{order:3}.td-o4{order:4}.td-o5{order:5}.td-o6{order:6}.td-o7{order:7}
main.td-grid>.notice{order:0}
@media (min-width:1180px){
  main.td-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0 14px;align-items:start}
  main.td-grid>.notice{grid-column:1/-1}
  .td-col{display:block;min-width:0}
  .td-side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
  .td-side .row label{flex:1 1 140px}
  .td-side .end{flex:1 1 100%}
}
.td-tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin:0 0 8px}
.td-tab{border:1px solid transparent;border-bottom:none;background:none;color:var(--dim);padding:6px 12px;border-radius:6px 6px 0 0;font:inherit;cursor:pointer}
.td-tab[aria-selected="true"]{border-color:var(--border);background:var(--card);color:var(--text);font-weight:600;margin-bottom:-1px}
.td-out{font-size:13px;display:flex;flex-direction:column;gap:4px}
details>summary{cursor:pointer}
tr[data-td-lag-head] td{background:var(--chip);font-size:12px}
@media (max-width:600px){main{padding:10px}.card{padding:12px}}
/* UX29：手機寬度加大點擊目標（至少 32px）；8 頁相同，只影響 ≤720px */
@media (max-width:720px){
  .lang-btn,.theme-btn,#theme-btn,.tools-nav-btn,#tools-nav-btn,.sb-toggle,.howto-copy,.rm-btn,.note-btn,.btn-sm,#t-back,#t-intel-builder,#send-to-tool-select,#filter-preset-select{min-height:32px;min-width:32px}
  .actor-link,.fwq-btn,.rel-btn,#t-intel-builder,.tag-more,#ws-export-btn,#ws-import-btn{display:inline-block;padding:6px 4px;min-height:32px;box-sizing:border-box}
  #gl-search{min-height:32px}
  .fwq-btn{min-width:32px;text-align:center}
  #issues-card select,#ls-panel button{min-height:32px}
}
</style>
<script src="toolkit-version.js"></script>
</head>
<body>
<header>
  <h1><span data-td-i18n="td.title"></span> <span class="exp-badge" data-experimental>🧪 <span data-td-i18n="td.experimental"></span></span></h1>
  <label><span data-td-i18n="td.lang"></span> <select id="td-lang-sel"></select></label>
  <a href="network-analyzer.html" id="t-back" data-td-i18n="td.back"></a>
</header>
<main class="td-grid">
  <div class="notice" id="td-draft-bar" hidden><span data-td-i18n="td.draft_found"></span> <button class="btn btn-sm primary" id="td-draft-restore" data-td-i18n="td.draft_restore"></button> <button class="btn btn-sm" id="td-draft-discard" data-td-i18n="td.draft_discard"></button></div>
  <p class="notice"><span data-td-i18n="td.intro"></span> <span data-td-i18n="td.next_step"></span></p>
  <div class="td-col td-main">
<section class="card td-o1">
    <h2 data-td-i18n="td.sec_canvas"></h2>
    <div class="hint" data-td-i18n="td.canvas_hint"></div>
    <div id="td-canvas"></div>
    <div class="row">
      <button class="btn" id="td-save" data-td-i18n="td.save"></button>
      <label class="btn" style="flex-direction:row;color:var(--text);font-size:14px"><span data-td-i18n="td.load"></span><input type="file" id="td-load" accept=".json,application/json" hidden></label>
      <button class="btn" id="td-clear" data-td-i18n="td.clear"></button>
      <button class="btn" id="td-layout" data-td-i18n="td.layout"></button>
      <button class="btn" id="td-demo" data-td-i18n="td.demo"></button>
      <button class="btn" id="td-undo" data-td-i18n="td.undo"></button>
      <button class="btn" id="td-redo" data-td-i18n="td.redo"></button>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="td-draft-on"> <span data-td-i18n="td.draft_label"></span></label>
    </div>
    <div class="hint" data-td-i18n="td.undo_hint"></div>
    <div class="row">
      <button class="btn" id="td-exp-svg" data-td-i18n="td.exp_svg"></button>
      <button class="btn" id="td-exp-drawio" data-td-i18n="td.exp_drawio"></button>
      <button class="btn" id="td-exp-mmd" data-td-i18n="td.exp_mmd"></button>
    </div>
    <div class="hint" data-td-i18n="td.exp_hint"></div>
  </section>
  <section class="card td-o6" id="td-l2">
    <h2 data-td-i18n="td.l2_sec"></h2>
    <div class="td-tabs" role="tablist">
      <button class="td-tab" role="tab" data-td-tab="vlan"></button>
      <button class="td-tab" role="tab" data-td-tab="stp"></button>
      <button class="td-tab" role="tab" data-td-tab="spof"></button>
      <button class="td-tab" role="tab" data-td-tab="path"></button>
    </div>
    <div data-td-pane="vlan">
      <div class="hint" data-td-i18n="td.l2_hint"></div>
      <div class="row"><label><span data-td-i18n="td.l2_vlan"></span><select id="td-l2-vlan"></select></label></div>
      <div id="td-l2-out" class="td-out"></div>
    </div>
    <div data-td-pane="stp" hidden>
      <div class="hint" data-td-i18n="td.stp_hint"></div>
      <div id="td-stp-out" class="td-out"></div>
    </div>
    <div data-td-pane="spof" hidden>
      <div class="hint" data-td-i18n="td.spof_hint"></div>
      <div id="td-spof-out" class="td-out"></div>
    </div>
    <div data-td-pane="path" hidden>
      <div class="row">
        <label><span data-td-i18n="td.l2p_from"></span><select id="td-l2p-from"></select></label>
        <label><span data-td-i18n="td.l2p_to"></span><select id="td-l2p-to"></select></label>
        <label><span data-td-i18n="td.l2p_vlan"></span><select id="td-l2p-vlan"></select></label>
        <button class="btn primary" id="td-l2p-run" data-td-i18n="td.l2p_run"></button>
        <button class="btn" id="td-l2p-clear" data-td-i18n="td.l2p_clear"></button>
      </div>
      <label style="display:flex;gap:6px;align-items:center;margin:4px 0;font-size:13px"><input type="checkbox" id="td-stp-on"><span data-td-i18n="td.l2p_use_stp"></span></label>
      <div id="td-l2p-out" style="font-size:13px"></div>
    </div>
  </section>
<section class="card td-o7">
    <h2 data-td-i18n="td.sec_list"></h2>
    <p class="notice" data-td-i18n="td.send_hint"></p>
    <div class="tbl-wrap" id="td-dev-list"></div>
    <div id="td-dev-edit" class="end" hidden>
      <b id="td-de-title"></b>
      <div class="row">
        <label><span data-td-i18n="td.host"></span><input id="td-de-host" class="txt" maxlength="32" autocomplete="off" spellcheck="false"></label>
        <label><span data-td-i18n="td.vendor"></span><select id="td-de-vendor"></select></label>
        <label style="flex:1 1 260px"><span data-td-i18n="td.model"></span><select id="td-de-model"></select></label>
        <label><span data-td-i18n="td.members"></span><input id="td-de-members" class="txt" type="number" min="1" max="9" style="width:70px"></label>
        <button class="btn primary" id="td-de-apply" data-td-i18n="td.dev_apply"></button>
        <button class="btn" id="td-de-cancel" data-td-i18n="td.end_cancel"></button>
      </div>
      <div class="row" id="td-de-member-models" hidden></div>
      <div class="msg bad" id="td-de-drop" hidden></div>
      <button class="btn" id="td-de-confirm" data-td-i18n="td.dev_confirm" hidden></button>
    </div>
    <div class="end" id="td-lag-box" style="margin-top:10px" hidden>
      <b id="td-lag-picked"></b>
      <div class="hint" data-td-i18n="td.lag_hint"></div>
      <div class="row">
        <label><span id="td-lag-a-lbl"></span><input id="td-lag-a" class="txt" inputmode="numeric" maxlength="4" style="width:90px" autocomplete="off"></label>
        <label><span id="td-lag-b-lbl"></span><input id="td-lag-b" class="txt" inputmode="numeric" maxlength="4" style="width:90px" autocomplete="off"></label>
        <label><span data-td-i18n="td.lag_mode"></span><select id="td-lag-mode"></select></label>
        <button class="btn primary" id="td-lag-add" data-td-i18n="td.lag_add"></button>
      </div>
    </div>
    <div class="tbl-wrap" id="td-link-list" style="margin-top:10px"></div>
    <details id="td-lag-sec" style="margin-top:10px"><summary><b data-td-i18n="td.lag_sec"></b></summary>
      <div class="tbl-wrap" id="td-lag-list"></div>
    </details>
  </section>
  </div>
  <aside class="td-col td-side">
<section class="card td-o2" id="td-link-card">
    <h2 data-td-i18n="td.sec_link"></h2>
    <div class="row">
      <div class="end"><b data-td-i18n="td.end_a"></b><div class="row">
        <label><span data-td-i18n="td.device"></span><select id="td-a-dev"></select></label>
        <label><span data-td-i18n="td.port"></span><select id="td-a-port"></select></label></div></div>
      <div class="end"><b data-td-i18n="td.end_b"></b><div class="row">
        <label><span data-td-i18n="td.device"></span><select id="td-b-dev"></select></label>
        <label><span data-td-i18n="td.port"></span><select id="td-b-port"></select></label></div></div>
    </div>
    <div class="row">
      <label><span data-td-i18n="td.link_mode"></span><select id="td-l-mode"></select></label>
      <label data-td-show="l-access" hidden><span data-td-i18n="td.access_vlan"></span><select id="td-l-vlan"></select></label>
      <label data-td-show="l-trunk" hidden><span data-td-i18n="td.allowed"></span><input id="td-l-allowed" class="txt" maxlength="200" autocomplete="off" spellcheck="false" placeholder="10,20-30 / all"></label>
      <label data-td-show="l-trunk" hidden><span data-td-i18n="td.native"></span><select id="td-l-native"></select></label>
      <button class="btn primary" id="td-link-add" data-td-i18n="td.add_link"></button>
    </div>
    <div class="hint" data-td-i18n="td.mode_hint"></div>
    <div id="td-end-edit" class="end" hidden>
      <b id="td-end-title"></b>
      <div class="row">
      <label><span data-td-i18n="td.link_mode"></span><select id="td-e-mode"></select></label>
      <label data-td-show="e-access" hidden><span data-td-i18n="td.access_vlan"></span><select id="td-e-vlan"></select></label>
      <label data-td-show="e-trunk" hidden><span data-td-i18n="td.allowed"></span><input id="td-e-allowed" class="txt" maxlength="200" autocomplete="off" spellcheck="false" placeholder="10,20-30 / all"></label>
      <label data-td-show="e-trunk" hidden><span data-td-i18n="td.native"></span><select id="td-e-native"></select></label>
        <button class="btn primary" id="td-e-save" data-td-i18n="td.end_save"></button>
        <button class="btn" id="td-e-cancel" data-td-i18n="td.end_cancel"></button>
      </div>
    </div>
    <div id="td-msg" class="msg" role="status"></div>
  </section>
<section class="card td-o3">
    <h2 data-td-i18n="td.sec_add"></h2>
    <div class="row">
      <label><span data-td-i18n="td.host"></span><input id="td-host" class="txt" maxlength="32" autocomplete="off" spellcheck="false"></label>
      <label><span data-td-i18n="td.vendor"></span><select id="td-vendor"></select></label>
      <label style="flex:1 1 260px"><span data-td-i18n="td.model"></span><select id="td-model"></select></label>
      <label><span data-td-i18n="td.members"></span><input id="td-members" class="txt" type="number" min="1" max="9" value="1" style="width:70px"></label>
      <button class="btn primary" id="td-dev-add" data-td-i18n="td.add_dev"></button>
    </div>
    <div class="row" id="td-member-models" hidden></div>
    <div class="hint" data-td-i18n="td.stack_hint"></div>
    <div class="hint" id="td-model-hint" hidden></div>
    <div id="td-custom"></div>
  </section>
<section class="card td-o4">
    <h2 data-td-i18n="td.sec_vlan"></h2>
    <div class="hint" data-td-i18n="td.vlan_hint"></div>
    <div class="row">
      <label><span data-td-i18n="td.vlan_id"></span><input id="td-vlan-id" class="txt" inputmode="numeric" maxlength="4" style="width:90px" autocomplete="off"></label>
      <label><span data-td-i18n="td.vlan_name"></span><input id="td-vlan-name" class="txt" maxlength="32" autocomplete="off" spellcheck="false"></label>
      <button class="btn" id="td-vlan-add" data-td-i18n="td.vlan_add"></button>
    </div>
    <div class="tbl-wrap" id="td-vlan-list"></div>
  </section>
  <section class="card td-o5">
    <details id="td-pair-sec">
      <summary><b data-td-i18n="td.pair_sec"></b></summary>
      <div id="td-pair-box">
      <div class="hint" data-td-i18n="td.pair_hint"></div>
      <div class="row">
        <label><span data-td-i18n="td.pair_a"></span><select id="td-pair-a"></select></label>
        <label><span data-td-i18n="td.pair_b"></span><select id="td-pair-b"></select></label>
        <label><span data-td-i18n="td.pair_domain"></span><input id="td-pair-domain" class="txt" inputmode="numeric" maxlength="4" style="width:80px" placeholder="1" autocomplete="off"></label>
        <button class="btn primary" id="td-pair-add" data-td-i18n="td.pair_add"></button>
      </div>
      <div class="tbl-wrap" id="td-pair-list"></div>
      </div>
    </details>
  </section>
  </aside>
</main>
<footer data-toolkit-version></footer>
<script src="switch-generator-device-models.js"></script>
<script src="switch-generator-models.js"></script>
<script src="panel-svg.js"></script>
<script src="switch-analyzer-panel.js"></script>
<script src="topo-designer-i18n.js"></script>
<script src="topo-designer.js"></script>
</body>
</html>
