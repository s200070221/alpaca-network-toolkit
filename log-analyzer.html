<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log 分析與去識別化工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦙</text></svg>">
<style>
:root{
  --bg:#080c17;--surface:#0f1629;--surface2:#162035;--surface3:#1e2d4a;
  --border:#1e3a5f;--border2:#243d63;
  --accent:#00c8f0;--accent2:#0ea5e9;--accent3:#38bdf8;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#a78bfa;--orange:#fb923c;
  --text:#dde8f5;--text-dim:#64748b;--text-muted:#2c3e58;
  --radius:12px;
}
body[data-theme="light"]{
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#f8fafc;--surface3:#e8f0f8;
  --border:#cbd5e1;--border2:#94a3b8;
  --text:#1e293b;--text-dim:#475569;--text-muted:#94a3b8;
  --accent:#0090b8;--accent2:#0284c7;--accent3:#0369a1;
  --green:#059669;--red:#dc2626;--yellow:#d97706;--purple:#7c3aed;--orange:#ea580c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans TC',system-ui,sans-serif;font-size:13px;min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
#topbar h1{font-size:16px;font-weight:700;flex:1}
#topbar .sub{font-size:11px;color:var(--text-dim);width:100%;order:99}
.lang-bar{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.lang-btn{padding:3px 7px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text-dim);font-size:10px;font-family:inherit;cursor:pointer;transition:all .15s}
.lang-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.lang-btn.hidden{display:none}
#lang-tlh{border-color:#c0392b;color:#e74c3c}
#lang-tlh:hover,#lang-tlh.active{border-color:#e74c3c;color:#ff6b6b;box-shadow:0 0 8px rgba(231,76,60,.4)}
#lang-pirate{border-color:#b45309;color:#f59e0b}
#lang-pirate:hover,#lang-pirate.active{border-color:#f59e0b;color:#fcd34d;box-shadow:0 0 8px rgba(245,158,11,.4)}
#lang-leet{border-color:#047857;color:#10b981}
#lang-leet:hover,#lang-leet.active{border-color:#10b981;color:#6ee7b7;box-shadow:0 0 8px rgba(16,185,129,.4)}
#lang-emoji{border-color:#7c3aed;color:#a78bfa}
#lang-emoji:hover,#lang-emoji.active{border-color:#a78bfa;color:#c4b5fd;box-shadow:0 0 8px rgba(167,139,250,.4)}
#lang-uwu{border-color:#be185d;color:#f472b6}
#lang-uwu:hover,#lang-uwu.active{border-color:#f472b6;color:#fbcfe8;box-shadow:0 0 8px rgba(244,114,182,.4)}
#lang-bureau{border-color:#475569;color:#94a3b8}
#lang-bureau:hover,#lang-bureau.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.4)}
#lang-cat{border-color:#c2410c;color:#fb923c}
#lang-cat:hover,#lang-cat.active{border-color:#fb923c;color:#fdba74;box-shadow:0 0 8px rgba(251,146,60,.4)}
#lang-bean{border-color:#b45309;color:#4ade80}
#lang-bean:hover,#lang-bean.active{border-color:#fbbf24;color:#bbf7d0;box-shadow:0 0 8px rgba(74,222,128,.4)}
#lang-alpaca{border-color:#92400e;color:#fcd34d}
#lang-alpaca:hover,#lang-alpaca.active{border-color:#fcd34d;color:#fef3c7;box-shadow:0 0 8px rgba(252,211,77,.4)}
#lang-yanse{border-color:#64748b;color:#94a3b8}
#lang-yanse:hover,#lang-yanse.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.3)}
.lang-egg{opacity:.25;cursor:pointer;font-size:14px;padding:2px 3px;user-select:none;transition:opacity .2s}
.lang-egg:hover{opacity:.7}
.egg-toast{position:fixed;top:-60px;left:50%;transform:translateX(-50%);z-index:99999;background:var(--surface2);border:1px solid var(--accent);border-radius:10px;padding:12px 22px;font-size:14px;font-weight:600;color:var(--text);box-shadow:0 4px 24px rgba(0,200,240,.3);pointer-events:none;white-space:nowrap;transition:top .4s cubic-bezier(.34,1.56,.64,1),opacity .4s}
.egg-toast.show{top:70px}
#disclaimer{background:rgba(245,158,11,.12);border-bottom:1px solid var(--border);color:var(--yellow);font-size:11px;padding:6px 20px}
#content{max-width:1100px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.card h2{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hint{font-size:11px;color:var(--text-dim);margin-bottom:10px;line-height:1.6}
#deid-summary{display:none;flex-wrap:wrap;gap:8px;padding:10px 14px;margin-top:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-dim)}
#deid-summary .sum-item{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:rgba(0,200,240,.08);color:var(--accent);font-weight:600}
#deid-summary .sum-label{color:var(--text-dim);font-weight:400}
textarea.paste{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;resize:vertical}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:11px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121c;font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#04121c}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:9px;letter-spacing:.5px}
th.sortable-col{cursor:pointer;user-select:none}
th.sortable-col:hover{color:var(--accent)}
.tbl-wrap{max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:9px;font-weight:700}
.badge.Critical{background:rgba(239,68,68,.18);color:var(--red)}
.badge.High{background:rgba(251,146,60,.18);color:var(--orange)}
.badge.Medium{background:rgba(245,158,11,.18);color:var(--yellow)}
.badge.Low{background:rgba(56,189,248,.18);color:var(--accent3)}
.badge.Info{background:var(--surface3);color:var(--text-dim)}
/* 淺色模式對比度修復（2026-08-13，比照 switch_analyzer/firewall_analyzer 同款修法）：
   Critical/High/Medium 實測分別僅 3.80/3.07/2.78:1（WCAG AA 要求 4.5:1）不合格；
   Low／Info 實測已達 5.16/6.59:1，維持不變不重複覆寫 */
body[data-theme="light"] .badge.Critical{background:rgba(239,68,68,.2);color:#b91c1c}
body[data-theme="light"] .badge.High{background:rgba(251,146,60,.2);color:#9a3412}
body[data-theme="light"] .badge.Medium{background:rgba(245,158,11,.22);color:#92400e}
.conf-tag{font-size:9px;padding:1px 6px;border-radius:4px}
.conf-tag.confirmed{background:rgba(16,185,129,.15);color:var(--green)}
.conf-tag.heuristic{background:rgba(167,139,250,.15);color:var(--purple)}
.note-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(251,146,60,.15);color:var(--orange);margin-right:3px;white-space:nowrap}
.summary-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.summary-chip{padding:4px 10px;border-radius:8px;background:var(--surface2);font-size:11px;display:flex;gap:6px;align-items:center}
.empty{color:var(--text-muted);font-size:11px;padding:14px 0;text-align:center}
.intel-row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface2);border-radius:6px;margin-bottom:6px;font-size:11px}
.intel-row .n{flex:1}
.geo-risk-checks{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;padding:6px 8px;background:var(--surface2);border-radius:6px}
.geo-risk-group-title{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.geo-risk-group-items{display:flex;flex-wrap:wrap;gap:2px 14px}
.geo-risk-item{white-space:nowrap;cursor:pointer}
input.txt{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:11px;padding:5px 8px;font-family:inherit}
.guide-body{font-size:11px;color:var(--text-dim);line-height:1.8;white-space:pre-line}
.progress-indicator{display:none;align-items:center;gap:6px;font-size:11px;color:var(--accent)}
.progress-indicator.active{display:inline-flex}
.progress-spinner{width:10px;height:10px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:log-spin .6s linear infinite;flex-shrink:0}
@keyframes log-spin{to{transform:rotate(360deg)}}
.large-file-notice{font-size:11px;color:var(--text-dim);padding:8px 10px;background:var(--surface2);border:1px dashed var(--border2);border-radius:8px;margin-bottom:8px}
.timeline-wrap{margin-bottom:10px}
.timeline-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
#timeline-chart svg{width:100%;height:70px;display:block}
#timeline-chart .tl-axis{font-size:9px;fill:var(--text-muted)}
.mini-alpaca{position:fixed;bottom:20px;right:20px;z-index:9999;font-size:32px;cursor:pointer;user-select:none;transition:transform .3s ease,filter .3s ease;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.mini-alpaca:hover{transform:scale(1.2) rotate(10deg);filter:drop-shadow(0 4px 12px var(--accent)) drop-shadow(0 0 4px var(--accent))}
</style>
</head>
<body data-theme="dark">
<header id="topbar">
  <h1 id="app-title" class="tb-title">Log 分析與去識別化工具</h1>
  <div class="lang-bar lang-switcher" id="lang-bar"></div>
  <span class="lang-egg" id="egg-pirate">⚓</span>
  <span class="lang-egg" id="egg-leet">💾</span>
  <span class="lang-egg" id="egg-emoji">🌈</span>
  <span class="lang-egg" id="egg-uwu">🐾</span>
  <span class="lang-egg" id="egg-bureau">📋</span>
  <span class="lang-egg" id="egg-cat">🐱</span>
  <span class="lang-egg" id="egg-bean">🫛</span>
  <span class="lang-egg" id="egg-alpaca">🦙</span>
  <span class="lang-egg" id="egg-yanse">😮‍💨</span>
  <span class="lang-egg" id="egg-wuxia">⚔️</span>
  <button id="theme-btn" onclick="toggleTheme()" title="切換明/暗模式" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 8px;margin-left:6px;line-height:1">☀️</button>
  <button id="tools-nav-btn" onclick="toggleToolsNav(event)" title="切換工具" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 8px;margin-left:6px;line-height:1">🧭</button>
  <div id="tools-nav-panel" style="display:none;position:fixed;top:44px;right:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:2000;min-width:170px">
    <span style="display:block;padding:6px 10px;border-radius:6px;color:var(--accent);font-size:12px;margin-bottom:2px;font-weight:600">✓ <span data-i18n="nav.tool_log">日誌分析</span></span>
    <a href="network-analyzer.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_network">總覽 / Hub</a>
    <a href="switch-config-parser.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_switch">交換器解析</a>
    <a href="switch-config-generator.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_gen">交換器產生器</a>
    <a href="firewall-analyzer-fixed.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_fw">防火牆分析</a>
    <a href="config-anonymizer.html" style="display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;margin-bottom:2px" data-i18n="nav.tool_ca">設定去識別化</a>
  </div>
  <div class="sub" id="app-sub"></div>
</header>
<div id="disclaimer"></div>
<div id="content">

  <section class="card" id="import-card">
    <h2 id="t-import-title"></h2>
    <div class="hint" id="t-import-hint"></div>
    <div id="large-file-notice" class="large-file-notice" style="display:none"></div>
    <textarea class="paste" id="paste-area"></textarea>
    <div class="btn-row">
      <input type="file" id="file-input" style="display:none" accept=".log,.txt,.csv,.json,.ndjson,.jsonl" multiple>
      <button class="btn" id="btn-upload"></button>
      <button class="btn primary" id="btn-analyze"></button>
      <button class="btn" id="btn-clear"></button>
      <span id="file-loaded-label" style="font-size:11px;color:var(--text-dim)"></span>
      <span id="progress-label" class="progress-indicator"><span class="progress-spinner"></span><span id="progress-text"></span></span>
    </div>
    <div class="btn-row" style="font-size:11px;color:var(--text-dim)">
      <span id="lbl-freq-window"></span> <input type="number" id="opt-freq-window" class="txt" style="width:56px" value="60" min="1">
      <span id="lbl-freq-threshold"></span> <input type="number" id="opt-freq-threshold" class="txt" style="width:48px" value="5" min="2">
      <span id="lbl-scan-threshold"></span> <input type="number" id="opt-scan-threshold" class="txt" style="width:48px" value="5" min="2">
      <span id="lbl-volume-threshold"></span> <input type="number" id="opt-volume-threshold" class="txt" style="width:56px" value="50" min="1">
      <span id="lbl-chain-window"></span> <input type="number" id="opt-chain-window" class="txt" style="width:56px" value="30" min="1">
    </div>
    <div class="btn-row" style="font-size:11px;color:var(--text-dim);align-items:flex-start">
      <span id="lbl-geo-risk"></span>
      <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px">
        <input type="text" id="geo-risk-filter" class="txt" style="max-width:220px">
        <div id="geo-risk-checks" class="geo-risk-checks"></div>
      </div>
    </div>
    <div class="btn-row" style="font-size:11px;color:var(--text-dim);align-items:flex-start">
      <span id="lbl-asn-risk"></span>
      <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px">
        <input type="text" id="asn-risk-filter" class="txt" style="max-width:220px">
        <div id="asn-risk-checks" class="geo-risk-checks"></div>
      </div>
    </div>
  </section>

  <!-- 顯示順序調整：④⑤⑥（情資/安全/GeoIP 資料來源設定）搬到②③（結果）之前，因為這些
       是分析所需的輸入資料，理應在跑分析前就備妥；純粹搬動 DOM 順序，卡片標題圈碼數字刻意
       不跟著重編（使用者要求先只調整顯示順序，避免牽動 11 語言 i18n 圈碼與交叉引用文字） -->
  <section class="card" id="intel-card">
    <h2 id="t-intel-title"></h2>
    <div class="hint" id="t-intel-hint"></div>
    <div class="btn-row">
      <input class="txt" id="intel-name-input" style="flex:1;min-width:140px">
      <input class="txt" id="intel-date-input" style="width:130px">
      <input type="file" id="intel-file-input" style="display:none" accept=".txt,.csv,.json,.ndjson,.jsonl">
      <button class="btn primary" id="btn-intel-add"></button>
    </div>
    <div id="intel-list" style="margin-top:10px"></div>
  </section>

  <section class="card" id="safelist-card">
    <h2 id="t-safelist-title"></h2>
    <div class="hint" id="t-safelist-hint"></div>
    <div class="btn-row">
      <input class="txt" id="safelist-name-input" style="flex:1;min-width:140px">
      <input type="file" id="safelist-file-input" style="display:none" accept=".txt,.csv,.json,.ndjson,.jsonl">
      <button class="btn" id="btn-safelist-template"></button>
      <button class="btn primary" id="btn-safelist-add"></button>
    </div>
    <div id="safelist-list" style="margin-top:10px"></div>
  </section>

  <section class="card" id="geo-card">
    <h2 id="t-geo-title"></h2>
    <div class="hint" id="t-geo-hint"></div>
    <div class="btn-row">
      <input class="txt" id="geo-name-input" style="flex:1;min-width:140px">
      <input type="file" id="geo-file-input" style="display:none" accept=".txt,.csv,.json,.ndjson,.jsonl,.dat">
      <button class="btn primary" id="btn-geo-add"></button>
    </div>
    <div id="geo-list" style="margin-top:10px"></div>
  </section>

  <section class="card" id="asn-card">
    <h2 id="t-asn-title"></h2>
    <div class="hint" id="t-asn-hint"></div>
    <div class="btn-row">
      <input class="txt" id="asn-name-input" style="flex:1;min-width:140px">
      <input type="file" id="asn-file-input" style="display:none" accept=".txt,.csv,.tsv">
      <button class="btn primary" id="btn-asn-add"></button>
    </div>
    <div id="asn-list" style="margin-top:10px"></div>
  </section>

  <section class="card" id="results-card">
    <h2 id="t-results-title"></h2>
    <div class="summary-row" id="results-summary"></div>
    <div class="timeline-wrap" id="timeline-wrap">
      <div class="timeline-label" id="lbl-timeline"></div>
      <div id="timeline-chart"></div>
    </div>
    <div class="btn-row" style="font-size:11px;color:var(--text-dim)">
      <span id="lbl-optional-cols"></span>
      <label><input type="checkbox" id="col-src"> <span id="lbl-col-src"></span></label>
      <label><input type="checkbox" id="col-dst"> <span id="lbl-col-dst"></span></label>
      <label><input type="checkbox" id="col-port"> <span id="lbl-col-port"></span></label>
      <label><input type="checkbox" id="col-proto"> <span id="lbl-col-proto"></span></label>
      <label><input type="checkbox" id="col-url"> <span id="lbl-col-url"></span></label>
      <button class="btn" id="btn-export-events-csv"></button>
      <input type="text" id="results-search" class="txt" style="margin-left:auto;width:180px">
    </div>
    <div class="tbl-wrap"><table id="results-table"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="card" id="issues-card">
    <h2 id="t-issues-title"></h2>
    <div class="btn-row" style="font-size:11px;color:var(--text-dim)">
      <span id="lbl-issues-source-filter"></span>
      <select id="issues-source-filter" class="txt"></select>
    </div>
    <div class="tbl-wrap"><table id="issues-table"><thead></thead><tbody></tbody></table></div>
    <div class="btn-row">
      <button class="btn" id="btn-html-report" style="margin-left:auto"></button>
      <button class="btn" id="btn-print-report"></button>
    </div>
  </section>

  <!-- 疑似關聯攻擊鏈：標題刻意不加圈碼數字，比照既有卡片排序調整慣例，避免牽動 11 語言
       i18n 圈碼交叉引用文字（見上方 issues-card 前一則卡片順序調整的既有註解） -->
  <section class="card" id="correlation-card">
    <h2 id="t-correlation-title"></h2>
    <div class="tbl-wrap"><table id="correlation-table"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="card" id="guide-card">
    <h2 id="t-guide-title"></h2>
    <div class="guide-body" id="guide-body"></div>
  </section>

  <section class="card" id="deid-card">
    <h2 id="t-deid-title"></h2>

  const v = obj[key];
  return (typeof v === 'string' || typeof v === 'number') ? String(v) : null;

// 子網域比對規則因情資清單格式而異，查無統一標準，比照專案「不猜測」慣例先做最小可用版本）。

  return (typeof v === 'string' || typeof v === 'number') ? String(v) : null;

// 通用 JSON/NDJSON 解析，情資清單與主要 log 匯入共用。涵蓋兩種常見形態：

// 「整段文字剛好是單一 JSON 物件」的情況回傳於 singleObj，是否要當作 1 筆資料處理交給呼叫端
// 各自判斷（情資清單看有沒有 IP 欄位，log 匯入看像不像一筆事件），避免把判斷邏輯耦合在共用函式裡。

      const val = extractIPFieldFromObj(item) || extractDomainFieldFromObj(item);

// 代碼查不到時（表格未收錄，或匯入資料庫本身用非 ISO 碼的其他寫法）優雅降級：continent 歸
// 'other'，name 原樣顯示輸入字串，不會因表格不完整而整個功能壞掉。CSV 型資料庫可能直接用
// 全名而非 ISO 碼（如既有 GEO_COUNTRY_GROUPS 的 aliases 本身就有全名），故查不到代碼時再嘗試
// 用名稱反查一次
function resolveCountryInfo(raw) {
  const code = String(raw).trim().toUpperCase();
  if (COUNTRY_INFO[code]) return { code, name: COUNTRY_INFO[code].name, continent: COUNTRY_INFO[code].continent };
  const hit = Object.entries(COUNTRY_INFO).find(([, info]) => info.name.toLowerCase() === code.toLowerCase());
  if (hit) return { code: hit[0], name: hit[1].name, continent: hit[1].continent };
  return { code: null, name: String(raw), continent: 'other' };
}

    'guide.title':'⑦ How to Get External Threat Intel','guide.body':'This tool only matches locally — it never fetches or sends data over the network.\nCommon public sources (purpose only — verify current official URLs yourself):\n• Spamhaus DROP/EDROP — known malicious netblocks (CIDR)\n• Emerging Threats / Proofpoint compromised-ips — known compromised host IPs\n• abuse.ch Feodo Tracker / URLhaus / ThreatFox — malware C2 related IOCs\n• FireHOL Level 1 — aggregates Spamhaus/DShield/Abuse.ch and more: https://iplists.firehol.org/files/firehol_level1.netset (plain text, # comments, paste directly into this page)\n• EmergingThreats Block List — attacker IPs commonly used for IDS/IPS: https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt (plain text, paste directly)\n• CINS Army List — high-reputation attacker IPs: https://cinsscore.com/list/ci-badguys.txt (plain text, one IP per line, paste directly)\n• Blocklist.de — attacker IPs aggregated from honeypot/IDS reports: https://www.blocklist.de/downloads/export-ips_all.txt (plain text, one IP per line, paste directly)\n• DShield/SANS ISC Block List — most active attacking netblocks over the last 3 days: https://www.dshield.org/block.txt (⚠️ tab-delimited table, not a plain CIDR list — pasting it as-is only captures each row\'s first column, the block\'s start IP, as a single exact-match IP; it will NOT expand to the full /24, so coverage drops sharply. Pre-process it into CIDR notation before importing.)\nAll of the above are public plain-text files — download and paste, or save the file and use "Upload List" on this page. Services requiring registration/an API key (e.g. AbuseIPDB) are not included.\nMost public lists carry their own usage terms (some are non-commercial/personal use only) — check before downloading. Recommended refresh: at least monthly, stale lists lose value.',

    'guide.title':'⑦ 外部脅威インテリジェンスの入手方法','guide.body':'本ツールはローカル照合のみを行い、データを外部に取得・送信することはありません。\n代表的な公開情報源（用途のみ記載、正式なダウンロード URL は公式ページでご確認ください）：\n• Spamhaus DROP/EDROP — 既知の悪意あるネットブロック（CIDR）\n• Emerging Threats / Proofpoint compromised-ips — 既知の侵害済みホスト IP\n• abuse.ch Feodo Tracker / URLhaus / ThreatFox — マルウェア C2 関連 IOC\n• FireHOL Level 1 — Spamhaus/DShield/Abuse.ch 等を統合：https://iplists.firehol.org/files/firehol_level1.netset （プレーンテキスト、# コメント、このページに直接貼り付け可）\n• EmergingThreats Block List — IDS/IPS 向け攻撃者 IP リスト：https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt （プレーンテキスト、直接貼り付け可）\n• CINS Army List — 高信頼度の攻撃元 IP：https://cinsscore.com/list/ci-badguys.txt （プレーンテキスト、1 行 1 IP、直接貼り付け可）\n• Blocklist.de — ハニーポット/IDS 報告を集約した攻撃元 IP：https://www.blocklist.de/downloads/export-ips_all.txt （プレーンテキスト、1 行 1 IP、直接貼り付け可）\n• DShield/SANS ISC Block List — 直近 3 日間の攻撃元ネットブロック：https://www.dshield.org/block.txt （⚠️ タブ区切りの表形式で単純な CIDR リストではありません。そのまま貼り付けると各行の先頭列（ブロック開始 IP）のみが単一 IP として厳密一致比較の対象になり、/24 全体には展開されないため命中率が大幅に低下します。事前に CIDR 形式へ加工してから取り込んでください）\n上記はすべて公開のプレーンテキストファイルです。ダウンロードして貼り付けるか、ファイルを保存して本ページの「リストをアップロード」から取り込めます。登録や API キーが必要なサービス（AbuseIPDB 等）は含まれていません。\n多くの公開リストには独自の利用規約があります（非商用/個人利用限定の場合あり）。ダウンロード前にご確認ください。月 1 回以上の更新を推奨します。',

function leetify(s) { return s.replace(/[aeiostl]/gi, c => ({a:'4',e:'3',i:'1',o:'0',s:'5',t:'7',l:'|'}[c.toLowerCase()] || c)); }
function uwuify(s) { return s.replace(/th/gi,'d').replace(/[rl]/gi,'w').replace(/n([aeiou])/gi,'ny$1'); }
const BEAN_MAP = { a:'🫘', e:'🥦', i:'🥕', o:'🥔', u:'🍆' };
function beanify(s) { return s.replace(/[aeiou]/gi, c => BEAN_MAP[c.toLowerCase()] || c); }

  const p = document.getElementById('tools-nav-panel');
  if (!p) return;
  p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';
}

// 自己的寫法、跟預設別名對不上導致永遠比對不到」的問題。isKnownRiskCountry() 只用來決定
// 這些實際字串裡哪些該預設打勾，大小寫不敏感比對 GEO_COUNTRY_GROUPS 的風險別名聯集
const GEO_RISK_ALIAS_SET = new Set(GEO_COUNTRY_GROUPS.filter(g => g.risk).flatMap(g => g.aliases).map(s => s.toLowerCase()));
function isKnownRiskCountry(str) { return GEO_RISK_ALIAS_SET.has(String(str).trim().toLowerCase()); }
function getImportedGeoCountries() {
  const set = new Set();
  GEO_LISTS.forEach(l => (l.index.countries || []).forEach(c => { if (c) set.add(c); }));
  return Array.from(set).sort();
}
// 雙模式渲染：未匯入 GeoIP 資料庫時用預設 26 國分組清單（checkbox value 為 group id，讀取
// 時展開 aliases）；已匯入時改用該資料庫實際涵蓋的國家字串（checkbox value 就是原始字串，
// 不需展開）。重繪前先讀出目前已勾選的值，重繪後對新清單裡仍存在的值還原勾選，避免每次
// 匯入/移除清單都把使用者已調整過的勾選整組重置
// 分組順序固定：高風險獨立一組排最前，其餘依洲別（亞/歐/非/北美/南美/大洋洲/其他）；純
// UI 排列依據，不影響 getRiskCountries() 的比對邏輯
const GEO_CONTINENT_ORDER = ['asia', 'europe', 'africa', 'namerica', 'samerica', 'oceania', 'other'];
function renderGeoRiskChecks() {
  const box = document.getElementById('geo-risk-checks');
  const prevMode = box.dataset.mode;
  const imported = getImportedGeoCountries();
  const usingImported = imported.length > 0;
  const newMode = usingImported ? 'imported' : 'default';
  // 「保留使用者已調整過的勾選」只在同一種模式下才有意義（value 命名空間相同：預設模式是
  // group id、匯入模式是原始國家字串）；模式切換當下（例如剛匯入、或移除到 0 筆）舊的勾選
  // 值屬於另一套命名空間，不該拿來比對，一律改用該筆項目自己的 risk 旗標決定預設勾選
  const prevChecked = prevMode === newMode
    ? new Set(Array.from(box.querySelectorAll('input:checked')).map(el => el.value))
    : null;
  // label 不再寫死，統一透過 resolveCountryInfo() 動態解析成「名稱 (代碼)」，未匯入/已匯入
  // 兩種模式共用同一份對照表，確保呈現一致
  const items = usingImported
    ? imported.map(c => {
        const info = resolveCountryInfo(c);
        return { value: c, label: `${info.name}${info.code ? ' (' + info.code + ')' : ''}`, risk: isKnownRiskCountry(c), continent: info.continent };
      })
    : GEO_COUNTRY_GROUPS.map(g => {
        const info = resolveCountryInfo(g.id);
        return { value: g.id, label: `${info.name} (${info.code || g.id.toUpperCase()})`, risk: g.risk, continent: info.continent };
      });
  box.dataset.mode = newMode;
  const groups = [{ key: 'risk', title: tr('geo.riskGroupLabel'), items: items.filter(it => it.risk) }];
  GEO_CONTINENT_ORDER.forEach(c => groups.push({ key: c, title: tr('geo.continent.' + c), items: items.filter(it => !it.risk && it.continent === c) }));
  box.innerHTML = groups.filter(g => g.items.length).map(g => {
    const rows = g.items.map(it => {
      const checked = prevChecked ? prevChecked.has(it.value) : it.risk;
      return `<label class="geo-risk-item"><input type="checkbox" class="geo-risk-check" value="${esc(it.value)}"${checked ? ' checked' : ''}> ${esc(it.label)}</label>`;
    }).join('');
    return `<div class="geo-risk-group" data-group="${g.key}"><div class="geo-risk-group-title">${esc(g.title)}</div><div class="geo-risk-group-items">${rows}</div></div>`;
  }).join('');
  filterGeoRiskChecks(document.getElementById('geo-risk-filter').value);
}
// 篩選需連帶處理群組：某群組內所有項目都被篩掉時，該群組（含標題）也要一併隱藏，避免篩選
// 結果出現一堆空標題
function filterGeoRiskChecks(q) {
  const needle = String(q || '').trim().toLowerCase();
  document.querySelectorAll('#geo-risk-checks .geo-risk-group').forEach(group => {
    let anyVisible = false;
    group.querySelectorAll('.geo-risk-item').forEach(label => {
      const hit = !needle || label.textContent.toLowerCase().includes(needle);
      label.style.display = hit ? '' : 'none';
      if (hit) anyVisible = true;
    });
    group.style.display = anyVisible ? '' : 'none';
  });
}
// riskCountries 讀取：未匯入模式下 checkbox value 是 group id，需展開成該 group 的 aliases；
// 已匯入模式下 checkbox value 本身就是要比對的字串，直接回傳即可
function getRiskCountries() {
  const box = document.getElementById('geo-risk-checks');
  const checkedValues = Array.from(box.querySelectorAll('input:checked')).map(el => el.value);
  if (box.dataset.mode === 'imported') return checkedValues;
  const idSet = new Set(checkedValues);
  return GEO_COUNTRY_GROUPS.filter(g => idSet.has(g.id)).flatMap(g => g.aliases);
}
// 事件時間軸：純前端 SVG 堆疊長條圖，不引入圖表函式庫（比照全套工具零依賴、單一 HTML 檔的
// 既有原則）。v1 固定反映全部 EVENTS，不隨搜尋框篩選連動，避免範圍擴大；資料運算由
// buildTimelineBuckets() 負責（純函式，另有獨立測試），這裡只做視覺呈現
const TL_SEV_ORDER = ['Critical', 'High', 'Medium', 'Low', 'Info'];
const TL_SEV_COLOR = { Critical: 'var(--red)', High: 'var(--orange)', Medium: 'var(--yellow)', Low: 'var(--accent3)', Info: 'var(--text-dim)' };
function tlFmtTime(ms) {
  return new Date(ms).toLocaleString(undefined, { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function renderTimeline() {
  document.getElementById('lbl-timeline').textContent = tr('results.timeline_label');
  const chart = document.getElementById('timeline-chart');
  const { buckets, startTime, endTime, bucketMs } = buildTimelineBuckets(EVENTS);
  if (!buckets.length) { chart.innerHTML = `<div class="empty">${tr('results.empty')}</div>`; return; }
  const n = buckets.length;
  const barAreaH = 50, chartW = 1000, gap = 1;
  const barW = chartW / n - gap;
  const maxTotal = Math.max(1, ...buckets.map(b => b.total));
  const bars = buckets.map((b, i) => {
    const x = i * (chartW / n);
    let y = barAreaH;
    const segs = TL_SEV_ORDER.map(sev => {
      const h = (b[sev] / maxTotal) * barAreaH;
      y -= h;
      return h > 0 ? `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${TL_SEV_COLOR[sev]}"/>` : '';
    }).join('');
    const bucketStart = startTime + i * bucketMs;
    const title = `${tlFmtTime(bucketStart)}\n${TL_SEV_ORDER.map(s => `${s}: ${b[s]}`).join(' / ')}`;
    return `<g><title>${esc(title)}</title>${segs}</g>`;
  }).join('');
  const axis = `<text class="tl-axis" x="0" y="64" text-anchor="start">${esc(tlFmtTime(startTime))}</text>
    <text class="tl-axis" x="${chartW / 2}" y="64" text-anchor="middle">${esc(tlFmtTime((startTime + endTime) / 2))}</text>
    <text class="tl-axis" x="${chartW}" y="64" text-anchor="end">${esc(tlFmtTime(endTime))}</text>`;
  chart.innerHTML = `<svg viewBox="0 0 ${chartW} 70" preserveAspectRatio="none">${bars}${axis}</svg>`;
}

// ============================================================
// [9] 事件綁定
// ============================================================
// yieldToUI() 已搬到前面「[1] 中介格式與共用常數」區塊（靠近 buildIntelIndex()，且本身是
// 不依賴 document 的純函式，屬於測試沙箱可抽取範圍，見該處註解）；doAnalyze() 沿用同一份
// 定義讓「階段之間」有機會畫面更新，各階段內部仍是單次同步呼叫，行為不變
function showProgress(labelKey) {
  const el = document.getElementById('progress-label');
  el.classList.add('active');
  document.getElementById('progress-text').textContent = tr(labelKey);
}
function hideProgress() {
  document.getElementById('progress-label').classList.remove('active');
}
// 2026-08-09 稽核修復：doAnalyze() 是 async 函式，過程中多次 await yieldToUI() 讓出主執行緒，
// 依序覆寫模組層級共享狀態（RAW_TEXT/EVENTS/ISSUES/ANON_EVENTS）；按鈕本身沒有在執行期間
// disable，快速連點或上傳新檔後又再次點擊會讓兩次呼叫交錯執行，較新一次可能在較舊一次的
// await 空檔被覆寫，最終畫面可能是兩次執行結果的混合。比照 network_analyzer 既有的
// _dropGen 世代計數器防呆模式：每次呼叫遞增世代號，await 之後比對是否仍是最新一次呼叫，
// 不是則靜默中止（不覆寫任何狀態、不隱藏可能屬於新一次呼叫的進度條）
let _analyzeGen = 0;
async function doAnalyze() {
  const text = PENDING_LARGE_TEXT !== null ? PENDING_LARGE_TEXT : document.getElementById('paste-area').value;
  if (!text.trim()) return;
  const myGen = ++_analyzeGen;
  const btn = document.getElementById('btn-analyze');
  if (btn) btn.disabled = true;
  try {
    RAW_TEXT = text;
    showProgress('import.progress_parsing');
    await yieldToUI();
    if (myGen !== _analyzeGen) return;
    const { events } = parseLogText(text);
    EVENTS = events;
    showProgress('import.progress_analyzing');
    await yieldToUI();
    if (myGen !== _analyzeGen) return;
    const indexes = INTEL_LISTS.map(l => l.index);
    const safeIndexes = SAFE_LISTS.map(l => l.index);
    const geoIndexes = GEO_LISTS.map(l => l.index);
    const asnIndexes = ASN_LISTS.map(l => l.index);
    // 2026-08-09 稽核修復：原本用 `||` 取預設值，使用者刻意填 0（HTML min 屬性只是 UI 提示，
    // 手動輸入不受限制）時，`0 || default` 會把合法的 0 當成「未填」而換回預設值，明確設定
    // 被靜默忽略且畫面無任何提示；改用顯式判斷，僅在非有限數字或 ≤0 時才 fallback
    const numOr = (id, def) => { const n = Number(document.getElementById(id).value); return Number.isFinite(n) && n > 0 ? n : def; };
    const windowSec = numOr('opt-freq-window', 60);
    const freqThreshold = numOr('opt-freq-threshold', 5);
    const scanThreshold = numOr('opt-scan-threshold', 5);
    const volumeThreshold = numOr('opt-volume-threshold', 50) * 1024 * 1024;
    const riskCountries = getRiskCountries();
    const riskAsns = getRiskAsns();
    ISSUES = buildIssueList(EVENTS, indexes, { windowMs: windowSec * 1000, freqThreshold, scanThreshold, safeIndexes, volumeThreshold, riskCountries, geoIndexes, riskAsns, asnIndexes });
    ANON_EVENTS = null;
    showProgress('import.progress_correlating');
    await yieldToUI();
    if (myGen !== _analyzeGen) return;
    const chainWindowMin = numOr('opt-chain-window', 30);
    CHAINS = detectCorrelationChains(ISSUES, { chainWindowMs: chainWindowMin * 60000 });
    showProgress('import.progress_rendering');
    await yieldToUI();
    if (myGen !== _analyzeGen) return;
    renderResults();
    renderIssues();
    renderChains();
    renderTimeline();
  } finally {
    if (myGen === _analyzeGen) { hideProgress(); if (btn) btn.disabled = false; }
  }
}
function doClear() {
  document.getElementById('paste-area').value = '';
  document.getElementById('file-loaded-label').textContent = '';
  document.getElementById('large-file-notice').style.display = 'none';

// 支援一次選取/拖放多個檔案：依原始順序平行讀取後 join 成單一文字餵給既有分析流程，
// 大檔案門檻判斷改用合併後的總行數/總位元組數；file 參數同時相容單一 File（Array.isArray
// 防呆），呼叫端一律傳陣列
// 2026-08-09 稽核修復：連續兩次選檔/拖放時，較慢的一次（如較大檔案）晚完成會覆蓋較快一次
// 已寫入的 PENDING_LARGE_TEXT／file-loaded-label，造成顯示與實際暫存內容不一致；比照
// doAnalyze() 與 network_analyzer 既有的 _dropGen 模式加上世代計數器
let _uploadGen = 0;
function doUploadFile(files) {
  const fileList = Array.isArray(files) ? files : [files];
  const myGen = ++_uploadGen;
  Promise.all(fileList.map(f => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(f);
  }))).then(contents => {
    if (myGen !== _uploadGen) return;
    const text = contents.map(c => c.replace(/\s+$/, '')).join('\n');
    const totalSize = fileList.reduce((sum, f) => sum + f.size, 0);
    const lineCount = (text.match(/\n/g) || []).length + 1;
    const names = fileList.map(f => f.name).join(', ');
    const notice = document.getElementById('large-file-notice');
    const textarea = document.getElementById('paste-area');
    if (lineCount > LARGE_FILE_LINE_THRESHOLD || totalSize > LARGE_FILE_BYTE_THRESHOLD) {
      PENDING_LARGE_TEXT = text;
      textarea.value = '';
      notice.textContent = tr('import.large_file_notice').replace('{name}', names).replace('{lines}', lineCount.toLocaleString());
      notice.style.display = 'block';
    } else {
      PENDING_LARGE_TEXT = null;
      textarea.value = text;
      notice.style.display = 'none';
    }
    document.getElementById('file-loaded-label').textContent = tr('import.file_loaded') + names;
  });
}
// 2026-08-10 稽核修復：三個上傳函式先前完全同步執行（含 buildIntelIndex() 建索引），大型
// 清單會讓畫面凍結、看起來像當掉；改為 async + await buildIntelIndex()（本身已分段 yield），
// 並在處理期間 disable 對應按鈕當作「處理中」的視覺回饋（比照 doAnalyze() 既有 disabled 寫法，
// 不新增文字/UI 元素以避免觸發 11 語言 i18n 新增 key 的額外工作量）
// 2026-08-10 稽核修復：真實規模 GeoIP/情資清單即使已分段 yield 仍需數秒到十餘秒處理時間，
// 純 disabled 按鈕沒有任何「還在動」的視覺回饋，容易被誤以為卡死；改把百分比數字直接附加在
// 按鈕自己的文字後面（如「上傳清單 47%」），完成後還原——數字語言中立，不需另外新增 i18n key
function doIntelUpload(file, name, date) {
  const reader = new FileReader();
  reader.onload = async () => {
    const btn = document.getElementById('btn-intel-add');
    const origLabel = btn ? btn.textContent : '';
    if (btn) btn.disabled = true;
    try {
      const list = parseIntelList(reader.result, name || file.name);
      const index = await buildIntelIndex(list, (done, total) => { if (btn) btn.textContent = origLabel + ' ' + Math.floor(done / total * 100) + '%'; });
      INTEL_LISTS.push({ name: list.name, date: date || '', index });
      renderIntelList();
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = origLabel; }
    }
  };
  reader.readAsText(file);
}
function doSafelistUpload(file, name) {
  const reader = new FileReader();
  reader.onload = async () => {
    const btn = document.getElementById('btn-safelist-add');
    const origLabel = btn ? btn.textContent : '';
    if (btn) btn.disabled = true;
    try {
      const list = parseIntelList(reader.result, name || file.name);
      const index = await buildIntelIndex(list, (done, total) => { if (btn) btn.textContent = origLabel + ' ' + Math.floor(done / total * 100) + '%'; });
      SAFE_LISTS.push({ name: list.name, index });
      renderSafeList();
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = origLabel; }
    }
  };
  reader.readAsText(file);
}
// 方案 A（純文字/CSV，表頭需含 country 欄位）走既有 parseIntelList()＋readAsText；方案 B
// （v2fly/Xray geoip.dat 二進位）依副檔名 .dat 走 parseGeoIPDat()＋readAsArrayBuffer，兩條路徑
// 最終都餵給同一個 buildIntelIndex()，索引結構與後續查詢完全共用
function doGeoUpload(file, name) {
  const isDat = /\.dat$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = async () => {
    const btn = document.getElementById('btn-geo-add');
    const origLabel = btn ? btn.textContent : '';
    if (btn) btn.disabled = true;
    try {
      const list = isDat ? parseGeoIPDat(reader.result) : parseIntelList(reader.result, name || file.name);
      if (name) list.name = name;
      const index = await buildIntelIndex(list, (done, total) => { if (btn) btn.textContent = origLabel + ' ' + Math.floor(done / total * 100) + '%'; });
      GEO_LISTS.push({ name: list.name, index });
      renderGeoList();
      renderGeoRiskChecks();
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = origLabel; }
    }
  };
  if (isDat) reader.readAsArrayBuffer(file); else reader.readAsText(file);
}

    [stats.ip, tr('deid.stat_ip')],

const REPORT_SEV_COLOR = { Critical: '#ef4444', High: '#fb923c', Medium: '#f59e0b', Low: '#38bdf8', Info: '#64748b' };

function buildReportTimelineSVG(events) {
  const { buckets, startTime, endTime, bucketMs } = buildTimelineBuckets(events);
  if (!buckets.length) return `<div class="empty">${esc(tr('results.empty'))}</div>`;
  const n = buckets.length, barAreaH = 60, chartW = 1000, gap = 1;
  const barW = chartW / n - gap;
  const maxTotal = Math.max(1, ...buckets.map(b => b.total));
  const bars = buckets.map((b, i) => {
    const x = i * (chartW / n);
    let y = barAreaH;
    return TL_SEV_ORDER.map(sev => {
      const h = (b[sev] / maxTotal) * barAreaH;
      y -= h;
      return h > 0 ? `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${REPORT_SEV_COLOR[sev]}"/>` : '';
    }).join('');
  }).join('');
  const axis = `<text x="0" y="76" font-size="10" fill="#888" text-anchor="start">${esc(tlFmtTime(startTime))}</text>
    <text x="${chartW / 2}" y="76" font-size="10" fill="#888" text-anchor="middle">${esc(tlFmtTime((startTime + endTime) / 2))}</text>
    <text x="${chartW}" y="76" font-size="10" fill="#888" text-anchor="end">${esc(tlFmtTime(endTime))}</text>`;
  return `<svg viewBox="0 0 ${chartW} 84" preserveAspectRatio="none" style="width:100%;height:100px">${bars}${axis}</svg>`;
}

// 記住上次的門檻／可選欄位設定（僅此工具本機儲存，不涉及任何伺服器傳輸）
const LS_SETTINGS_KEY = 'log_analyzer_settings_v1';
const SETTINGS_TEXT_IDS = ['opt-freq-window', 'opt-freq-threshold', 'opt-scan-threshold', 'opt-volume-threshold'];
const SETTINGS_CHECK_IDS = ['col-src', 'col-dst', 'col-port', 'col-proto', 'col-url'];
// 地理位置勾選清單持久化：僅有意義於「未匯入模式」（GEO_LISTS 跟 INTEL_LISTS/SAFE_LISTS 一樣
// 不會存進 localStorage，重新整理頁面一定會回到未匯入狀態，已匯入模式的勾選本來就無法跨
// 重整存活）；checkbox 由 renderGeoRiskChecks() 動態產生，用容器上的事件委派而非逐一綁定
function saveSettings() {
  const s = {};
  SETTINGS_TEXT_IDS.forEach(id => { s[id] = document.getElementById(id).value; });
  SETTINGS_CHECK_IDS.forEach(id => { s[id] = document.getElementById(id).checked; });
  s['geo-risk-checked'] = Array.from(document.querySelectorAll('#geo-risk-checks input:checked')).map(el => el.value);
  try { localStorage.setItem(LS_SETTINGS_KEY, JSON.stringify(s)); } catch (e) { /* 私密瀏覽模式等情況下 localStorage 可能不可用，靜默略過即可，非核心功能 */ }
}
function loadSettings() {
  let s;
  try { s = JSON.parse(localStorage.getItem(LS_SETTINGS_KEY) || 'null'); } catch (e) { s = null; }
  if (!s) return;
  SETTINGS_TEXT_IDS.forEach(id => { if (s[id] !== undefined) document.getElementById(id).value = s[id]; });
  SETTINGS_CHECK_IDS.forEach(id => { document.getElementById(id).checked = !!s[id]; });
  const box = document.getElementById('geo-risk-checks');
  if (Array.isArray(s['geo-risk-checked']) && box.dataset.mode !== 'imported') {
    const set = new Set(s['geo-risk-checked']);
    document.querySelectorAll('#geo-risk-checks input').forEach(el => { el.checked = set.has(el.value); });
  }
}
renderGeoRiskChecks();
renderAsnRiskChecks();
[...SETTINGS_TEXT_IDS, ...SETTINGS_CHECK_IDS].forEach(id => document.getElementById(id).addEventListener('change', saveSettings));
document.getElementById('geo-risk-checks').addEventListener('change', saveSettings);
document.getElementById('geo-risk-filter').addEventListener('input', e => filterGeoRiskChecks(e.target.value));
document.getElementById('asn-risk-filter').addEventListener('input', e => filterAsnRiskChecks(e.target.value));
loadSettings();

renderAll();

// analyzer/config_anonymizer/switch_config_generator 既有各自獨立實作的慣例，非共用函式）
(function(){
  var _p = localStorage.getItem('_netAnalyzer_pending');
  if (!_p) return;
  try {
    var d = JSON.parse(_p);
    if (Date.now() - d.ts > 10000) { localStorage.removeItem('_netAnalyzer_pending'); return; }
    localStorage.removeItem('_netAnalyzer_pending');
    var pa = document.getElementById('paste-area');
    if (pa) pa.value = d.text;
    doAnalyze();
  } catch(e) {}
})();

// 主題切換（2026-08-25 新增，比照其餘 5 工具既有的 setTheme()/toggleTheme() 慣例搬過來，
// 本工具先前完全沒有主題切換機制，CSS 已用 body[data-theme=...] 選擇器，零 CSS 改動即可相容）
function setTheme(t){document.body.dataset.theme=t;const b=document.getElementById('theme-btn');if(b)b.textContent=t==='light'?'🌙':'☀️';localStorage.setItem('cw_theme',t);}
function toggleTheme(){setTheme(document.body.dataset.theme==='light'?'dark':'light');}
(function(){const s=localStorage.getItem('cw_theme');const p=s||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');if(p==='light')setTheme('light');})();
</script>
