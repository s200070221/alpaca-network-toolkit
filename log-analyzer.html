<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src data:; img-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log 分析與去識別化工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦙</text></svg>">
<style>
:root{
  --bg:#080c17;--surface:#0f1629;--surface2:#162035;--surface3:#1e2d4a;
  --border:#1e3a5f;--border2:#243d63;
  --accent:#00c8f0;--accent2:#0ea5e9;--accent3:#38bdf8;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#a78bfa;--orange:#fb923c;
  --text:#dde8f5;--text-dim:#64748b;--text-muted:#2c3e58;
  --radius:12px;
}
body[data-theme="light"]{
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#f8fafc;--surface3:#e8f0f8;
  --border:#cbd5e1;--border2:#94a3b8;
  --text:#1e293b;--text-dim:#475569;--text-muted:#94a3b8;
  --accent:#0090b8;--accent2:#0284c7;--accent3:#0369a1;
  --green:#059669;--red:#dc2626;--yellow:#d97706;--purple:#7c3aed;--orange:#ea580c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans TC',system-ui,sans-serif;font-size:13px;min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
#topbar h1{font-size:16px;font-weight:700;flex:1}
#topbar .sub{font-size:11px;color:var(--text-dim);width:100%;order:99}
.lang-bar{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){#topbar h1{flex:1 1 100%}}
.lang-btn{padding:3px 7px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text-dim);font-size:11px;font-family:inherit;cursor:pointer;transition:all .15s}
.lang-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.lang-btn.hidden{display:none}
#lang-tlh{border-color:#c0392b;color:#e74c3c}
#lang-tlh:hover,#lang-tlh.active{border-color:#e74c3c;color:#ff6b6b;box-shadow:0 0 8px rgba(231,76,60,.4)}
#lang-pirate{border-color:#b45309;color:#f59e0b}
#lang-pirate:hover,#lang-pirate.active{border-color:#f59e0b;color:#fcd34d;box-shadow:0 0 8px rgba(245,158,11,.4)}
#lang-leet{border-color:#047857;color:#10b981}
#lang-leet:hover,#lang-leet.active{border-color:#10b981;color:#6ee7b7;box-shadow:0 0 8px rgba(16,185,129,.4)}
#lang-emoji{border-color:#7c3aed;color:#a78bfa}
#lang-emoji:hover,#lang-emoji.active{border-color:#a78bfa;color:#c4b5fd;box-shadow:0 0 8px rgba(167,139,250,.4)}
#lang-uwu{border-color:#be185d;color:#f472b6}
#lang-uwu:hover,#lang-uwu.active{border-color:#f472b6;color:#fbcfe8;box-shadow:0 0 8px rgba(244,114,182,.4)}
#lang-bureau{border-color:#475569;color:#94a3b8}
#lang-bureau:hover,#lang-bureau.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.4)}
#lang-cat{border-color:#c2410c;color:#fb923c}
#lang-cat:hover,#lang-cat.active{border-color:#fb923c;color:#fdba74;box-shadow:0 0 8px rgba(251,146,60,.4)}
#lang-bean{border-color:#b45309;color:#4ade80}
#lang-bean:hover,#lang-bean.active{border-color:#fbbf24;color:#bbf7d0;box-shadow:0 0 8px rgba(74,222,128,.4)}
#lang-alpaca{border-color:#92400e;color:#fcd34d}
#lang-alpaca:hover,#lang-alpaca.active{border-color:#fcd34d;color:#fef3c7;box-shadow:0 0 8px rgba(252,211,77,.4)}
#lang-yanse{border-color:#64748b;color:#94a3b8}
#lang-yanse:hover,#lang-yanse.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.3)}
.lang-egg{opacity:.25;cursor:pointer;font-size:14px;padding:2px 3px;user-select:none;transition:opacity .2s}
.lang-egg:hover{opacity:.7}
.egg-toast{position:fixed;top:-60px;left:50%;transform:translateX(-50%);z-index:99999;background:var(--surface2);border:1px solid var(--accent);border-radius:10px;padding:12px 22px;font-size:14px;font-weight:600;color:var(--text);box-shadow:0 4px 24px rgba(0,200,240,.3);pointer-events:none;white-space:nowrap;transition:top .4s cubic-bezier(.34,1.56,.64,1),opacity .4s}
.egg-toast.show{top:70px}
.matrix-overlay{position:fixed;inset:0;z-index:9998;overflow:hidden;background:rgba(8,12,23,.9);cursor:pointer}
.matrix-col{position:absolute;top:0;display:flex;flex-direction:column;gap:4px;font-family:'JetBrains Mono',monospace;font-size:10px;white-space:nowrap;line-height:1.4}
@keyframes matrixDrop{0%{transform:translateY(-120%)}100%{transform:translateY(110vh)}}
#disclaimer{background:rgba(245,158,11,.12);border-bottom:1px solid var(--border);color:var(--yellow);font-size:11px;padding:6px 20px}
#content{max-width:1100px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.card h2{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hint{font-size:11px;color:var(--text-dim);margin-bottom:10px;line-height:1.6}
.hint-more{margin:-4px 0 10px}
.next-bar{flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:12px}
.hint-more>summary{cursor:pointer;font-size:11px;color:var(--accent);margin-bottom:6px}
.optional-sources>summary{cursor:pointer;padding:12px 18px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);font-size:13px;font-weight:600;color:var(--text-dim)}
.optional-sources>section{margin-top:16px}
#deid-summary{display:none;flex-wrap:wrap;gap:8px;padding:10px 14px;margin-top:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-dim)}
#deid-summary .sum-item{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:rgba(0,200,240,.08);color:var(--accent);font-weight:600}
#deid-summary .sum-label{color:var(--text-dim);font-weight:400}
textarea.paste{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;resize:vertical}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:11px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121c;font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#04121c}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
th.sortable-col{cursor:pointer;user-select:none}
th.sortable-col:hover{color:var(--accent)}
.tbl-wrap{max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:8px}
/* UX28：問題清單表頭不斷行、範例欄保留寬度；手機寬度改成一個問題一張卡片 */
#issues-table th,#issues-table .badge,#issues-table .conf-tag{white-space:nowrap}
#issues-table td.is-sample{min-width:260px}
@media (max-width:720px){
  #issues-table thead{display:none}
  #issues-table,#issues-table tbody,#issues-table tr{display:block;width:100%}
  #issues-table tr{border-bottom:1px solid var(--border);padding:8px 6px}
  #issues-table td{display:block;border:0;padding:2px 0;min-width:0}
  #issues-table td.is-cat{font-weight:600}
  #issues-table td.is-inl{display:inline-block;margin-right:10px;vertical-align:middle}
  #issues-table td[data-label]::before{content:attr(data-label) "："; color:var(--text-dim); font-size:11px}
  #issues-table td.empty{text-align:left}
}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700}
.badge.Critical{background:rgba(239,68,68,.18);color:var(--red)}
.badge.High{background:rgba(251,146,60,.18);color:var(--orange)}
.badge.Medium{background:rgba(245,158,11,.18);color:var(--yellow)}
.badge.Low{background:rgba(56,189,248,.18);color:var(--accent3)}
.badge.Info{background:var(--surface3);color:var(--text-dim)}
/* 淺色模式對比度修復（2026-08-13，比照 switch_analyzer/firewall_analyzer 同款修法）：
   Critical/High/Medium 實測分別僅 3.80/3.07/2.78:1（WCAG AA 要求 4.5:1）不合格；
   Low／Info 實測已達 5.16/6.59:1，維持不變不重複覆寫 */
body[data-theme="light"] .badge.Critical{background:rgba(239,68,68,.2);color:#b91c1c}
body[data-theme="light"] .badge.High{background:rgba(251,146,60,.2);color:#9a3412}
body[data-theme="light"] .badge.Medium{background:rgba(245,158,11,.22);color:#92400e}
.conf-tag{font-size:9px;padding:1px 6px;border-radius:4px}
.conf-tag.confirmed{background:rgba(16,185,129,.15);color:var(--green)}
.conf-tag.heuristic{background:rgba(167,139,250,.15);color:var(--purple)}
.note-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(251,146,60,.15);color:var(--orange);margin-right:3px;white-space:nowrap}
.mitre-badge{display:inline-block;font-size:9px;padding:1px 6px;border-radius:4px;background:rgba(96,165,250,.15);color:#60a5fa;margin-left:4px;white-space:nowrap;cursor:help;font-family:monospace}
.next-step{margin-top:4px;font-size:11px}
.next-step summary{cursor:pointer;color:var(--accent,#3b82f6)}
.next-step div{margin-top:3px;line-height:1.5;color:var(--text,inherit);max-width:420px;white-space:normal}
.summary-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.summary-chip{padding:4px 10px;border-radius:8px;background:var(--surface2);font-size:11px;display:flex;gap:6px;align-items:center}
.empty{color:var(--text-muted);font-size:11px;padding:14px 0;text-align:center}
.intel-row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface2);border-radius:6px;margin-bottom:6px;font-size:11px}
.intel-row .n{flex:1}
.geo-risk-checks{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;padding:6px 8px;background:var(--surface2);border-radius:6px}
.geo-risk-group-title{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.geo-risk-group-items{display:flex;flex-wrap:wrap;gap:2px 14px}
.geo-risk-item{white-space:nowrap;cursor:pointer}
input.txt{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:11px;padding:5px 8px;font-family:inherit}
.guide-body{font-size:11px;color:var(--text-dim);line-height:1.8;white-space:pre-line}
.progress-indicator{display:none;align-items:center;gap:6px;font-size:11px;color:var(--accent)}
.progress-indicator.active{display:inline-flex}
.progress-spinner{width:10px;height:10px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:log-spin .6s linear infinite;flex-shrink:0}
@keyframes log-spin{to{transform:rotate(360deg)}}
#import-card .import-compact{display:none;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-mid);margin:-2px 0 8px}
#import-card.compact .import-compact{display:flex}
#import-card.compact > .hint,#import-card.compact > details,#import-card.compact > .large-file-notice{display:none}
#import-card.compact #paste-area{height:44px;min-height:44px}
.large-file-notice{font-size:11px;color:var(--text-dim);padding:8px 10px;background:var(--surface2);border:1px dashed var(--border2);border-radius:8px;margin-bottom:8px}
.timeline-wrap{margin-bottom:10px}
.timeline-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
#timeline-chart{position:relative}
#timeline-chart svg{width:100%;height:70px;display:block;user-select:none}
#timeline-chart .tl-axis{font-size:9px;fill:var(--text-muted)}
#timeline-drag-overlay{position:absolute;top:0;height:50px;background:rgba(100,181,246,.25);border:1px solid var(--accent);pointer-events:none;display:none}
.mini-alpaca{position:fixed;bottom:20px;right:20px;z-index:9999;font-size:32px;cursor:pointer;user-select:none;transition:transform .3s ease,filter .3s ease;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.mini-alpaca:hover{transform:scale(1.2) rotate(10deg);filter:drop-shadow(0 4px 12px var(--accent)) drop-shadow(0 0 4px var(--accent))}
/* 自訂偵測規則卡片（2026-09-16 新增，樣式比照 config_anonymizer 既有 customRules 編輯器） */
.opts-add-btn{width:100%;padding:5px 0;background:none;border:1px dashed var(--border2);border-radius:5px;color:var(--text-dim);font-size:11px;cursor:pointer;margin-top:4px}
.opts-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.rule-row{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-bottom:1px solid var(--border)}
.rule-row:last-child{border-bottom:none}
.rule-row-head{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rule-input,.rule-select{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-size:10px;padding:3px 6px;font-family:monospace;min-width:80px}
.rule-input.invalid{border-color:var(--red)}
.rule-badge{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface3);color:var(--text-muted);white-space:nowrap;flex-shrink:0}
.rule-badge.hit{background:rgba(0,212,255,.15);color:var(--accent)}
.rule-badge.err{background:rgba(239,68,68,.15);color:var(--red)}
.rule-del{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0 2px;font-size:12px;flex-shrink:0}
.rule-del:hover{color:var(--red)}
.rule-toggle{position:relative;display:inline-block;width:28px;height:16px;flex-shrink:0}
.rule-toggle input{opacity:0;width:0;height:0}
.rule-toggle .slider{position:absolute;inset:0;background:var(--border2);border-radius:8px;transition:.2s;cursor:pointer}
.rule-toggle .slider::before{content:'';position:absolute;width:12px;height:12px;left:2px;top:2px;background:#888;border-radius:50%;transition:.2s}
.rule-toggle input:checked+.slider{background:var(--accent)}
.rule-toggle input:checked+.slider::before{transform:translateX(12px);background:var(--bg)}
.note-btn{background:none;border:none;cursor:pointer;font-size:13px;opacity:.35;padding:0 2px}
.fwq-btn{background:none;border:none;cursor:pointer;font-size:12px;opacity:.45;padding:0 2px}
.fwq-btn:hover{opacity:1}
.note-btn:hover{opacity:.8}
.note-btn.has-note{opacity:1;filter:drop-shadow(0 0 2px var(--accent))}
.tour{box-sizing:border-box;width:100%;max-width:860px;margin:8px auto;padding:10px 14px;border:1px solid var(--accent);border-radius:8px;background:var(--surface2);color:var(--text);font-size:12.5px;line-height:1.6;text-align:left}
.tour[hidden]{display:none}
.tour-title{font-weight:600;color:var(--accent)}
.tour-steps{margin:4px 0 8px;padding-left:22px}
.tour-ok{font-size:12px;padding:3px 10px;border:1px solid var(--border);border-radius:5px;background:none;color:var(--text);cursor:pointer}
/* UX36：分析前不顯示空的結果卡片；結果列固定在頂端並附區段導覽；匯出選單 */
body.no-results #issues-card,body.no-results #health-card,body.no-results #results-card,body.no-results #topn-card,body.no-results #baseline-card,body.no-results #correlation-card,body.no-results #actor-card,body.no-results #deid-card{display:none}
.next-bar{position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.nb-nav{display:flex;gap:4px;align-items:center;margin-left:auto}
.nb-nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--accent);font-size:12px;cursor:pointer;padding:4px 6px;font-family:inherit;white-space:nowrap}
.nb-nav button:hover,.nb-nav button:focus-visible{border-bottom-color:var(--accent)}
section.card{scroll-margin-top:64px}
.exp-menu{position:relative}
.exp-menu>summary{list-style:none;user-select:none;display:inline-block}
.exp-menu>summary::-webkit-details-marker{display:none}
.exp-menu-panel{position:absolute;left:0;top:calc(100% + 4px);z-index:40;width:min(340px,calc(100vw - 56px));background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px}
.exp-menu-panel button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--text);font-family:inherit;font-size:12px;font-weight:600}
.exp-menu-panel button:hover,.exp-menu-panel button:focus-visible{background:var(--surface2)}
.exp-menu-panel small{display:block;font-size:11px;font-weight:400;color:var(--text-dim);margin-top:2px;white-space:normal}
@media (max-width:720px){.next-bar{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}.next-bar>*{flex:none}.nb-nav{margin-left:0}.nb-nav button{min-height:32px}.exp-menu[open]{flex-basis:100%}.exp-menu-panel{position:static;width:auto;margin-top:6px;box-shadow:none}.exp-menu-panel button{min-height:32px}}
/* UX29：手機寬度加大點擊目標（至少 32px）；7 頁相同，只影響 ≤720px */
@media (max-width:720px){
  .lang-btn,.theme-btn,#theme-btn,.tools-nav-btn,#tools-nav-btn,.sb-toggle,.howto-copy,.rm-btn,.note-btn,.btn-sm,#t-back,#t-intel-builder,#send-to-tool-select,#filter-preset-select{min-height:32px;min-width:32px}
  .actor-link,.fwq-btn,#t-intel-builder,.tag-more,#ws-export-btn,#ws-import-btn{display:inline-block;padding:6px 4px;min-height:32px;box-sizing:border-box}
  #gl-search{min-height:32px}
  .fwq-btn{min-width:32px;text-align:center}
  #issues-card select,#ls-panel button{min-height:32px}
}
</style>

<body data-theme="dark" class="no-results">
<header id="topbar">
  <h1 id="app-title" class="tb-title">Log 分析與去識別化工具</h1>
  <div class="lang-bar lang-switcher" id="lang-bar"></div>
  <span class="lang-egg" id="egg-pirate">⚓</span>
  <span class="lang-egg" id="egg-leet">💾</span>
  <span class="lang-egg" id="egg-emoji">🌈</span>
  <span class="lang-egg" id="egg-uwu">🐾</span>
  <span class="lang-egg" id="egg-bureau">📋</span>
  <span class="lang-egg" id="egg-cat">🐱</span>
  <span class="lang-egg" id="egg-bean">🫛</span>
  <span class="lang-egg" id="egg-alpaca">🦙</span>
  <span class="lang-egg" id="egg-yanse">😮‍💨</span>
  <span class="lang-egg" id="egg-wuxia">⚔️</span>
  <button id="theme-btn" onclick="toggleTheme()" title="切換明/暗模式" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 8px;margin-left:6px;line-height:1">☀️</button>

      <div id="lbl-case-issues" style="font-size:11px;color:var(--text-dim);margin-top:6px"></div>
      <div id="case-issues" class="geo-risk-checks" style="max-height:180px"></div>
      <div class="btn-row"><span id="lbl-case-actors" style="font-size:11px;color:var(--text-dim)"></span><input type="text" id="case-actors" class="txt" list="case-actor-list" style="flex:1;min-width:200px"><datalist id="case-actor-list"></datalist></div>
      <div id="lbl-case-summary" style="font-size:11px;color:var(--text-dim)"></div>
      <textarea id="case-summary" aria-labelledby="lbl-case-summary" class="txt" style="width:100%;height:60px;box-sizing:border-box"></textarea>
      <div class="btn-row"><label style="font-size:12px"><input type="checkbox" id="case-deid" checked> <span id="lbl-case-deid"></span></label><button class="btn" id="btn-case-export" style="margin-left:auto"></button></div>
      <div class="hint" id="case-msg"></div>
    </details>
  </section>

  <!-- 憑證處置清單（XN91）：有憑證類問題時顯示，只列識別碼 -->
  <section class="card" id="rotation-card" style="display:none">
    <h2 id="t-rotation-title"></h2>
    <div id="rotation-body"></div>
  </section>

  <section class="card" id="health-card">
    <h2 id="t-health-title"></h2>
    <button id="health-btn" onclick="_doLogHealthCheck()" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 18px;font-size:13px;cursor:pointer"></button>
    <div id="health-result" style="margin-top:12px"></div>
  </section>

  <section class="card" id="results-card">
    <h2 id="t-results-title"></h2>
    <!-- 無法解析 log 回報提示（2026-09-29 新增，RC）：renderReportBar() 依 logReportTrigger() 顯示 -->
    <div id="report-bar" style="display:none;margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--yellow);background:var(--surface2);border-radius:4px;font-size:12px"></div>
    <div class="summary-row" id="results-summary"></div>
    <div class="timeline-wrap" id="timeline-wrap">
      <div class="timeline-label" id="lbl-timeline"></div>
      <span id="timeline-filter-status" style="margin-left:8px;cursor:pointer;font-size:11px;color:var(--accent);display:none" onclick="clearTimelineRangeFilter()"></span>
      <div id="timeline-chart"></div>
      <div class="hint" id="timeline-chain-hint" style="display:none"></div>
    </div>
    <div class="btn-row" style="font-size:11px;color:var(--text-dim)">
      <span id="lbl-optional-cols"></span>
      <label><input type="checkbox" id="col-src"> <span id="lbl-col-src"></span></label>
      <label><input type="checkbox" id="col-dst"> <span id="lbl-col-dst"></span></label>
      <label><input type="checkbox" id="col-port"> <span id="lbl-col-port"></span></label>
      <label><input type="checkbox" id="col-proto"> <span id="lbl-col-proto"></span></label>
      <label><input type="checkbox" id="col-url"> <span id="lbl-col-url"></span></label>
      <button class="btn" id="btn-export-events-csv"></button>
      <button class="btn" id="btn-fw-batch"></button>
      <select id="results-file-filter" class="txt" style="display:none"></select>
      <input type="text" id="results-search" class="txt" style="margin-left:auto;width:180px">
    </div>
    <div class="tbl-wrap"><table id="results-table"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="card" id="topn-card">
    <h2 id="t-topn-title"></h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <div id="lbl-topn-src" style="font-size:12px;color:var(--text-dim);margin-bottom:4px"></div>
        <div class="tbl-wrap"><table id="topn-src-table"><thead></thead><tbody></tbody></table></div>
      </div>
      <div style="flex:1;min-width:200px">
        <div id="lbl-topn-user" style="font-size:12px;color:var(--text-dim);margin-bottom:4px"></div>
        <div class="tbl-wrap"><table id="topn-user-table"><thead></thead><tbody></tbody></table></div>
      </div>
      <div style="flex:1;min-width:200px">
        <div id="lbl-topn-category" style="font-size:12px;color:var(--text-dim);margin-bottom:4px"></div>
        <div class="tbl-wrap"><table id="topn-category-table"><thead></thead><tbody></tbody></table></div>
      </div>
    </div>
  </section>


  <section class="card" id="baseline-card">
    <h2 id="t-baseline-title"></h2>
    <div class="btn-row">
      <button class="btn" id="btn-baseline-export"></button>
      <button class="btn" id="btn-baseline-import" onclick="document.getElementById('baseline-import-input').click()"></button>
      <input type="file" id="baseline-import-input" accept=".json" style="display:none">
      <button class="btn" id="btn-prev-log" onclick="document.getElementById('prev-log-input').click()"></button>
      <input type="file" id="prev-log-input" multiple accept=".log,.txt,.csv,.json,.ndjson,.jsonl,.gz,.zip" style="display:none">
      <span id="baseline-import-status" class="hint" style="font-size:11px"></span>
    </div>
    <div id="baseline-diff-result" style="margin-top:12px"></div>
  </section>

  <!-- 疑似關聯攻擊鏈：標題刻意不加圈碼數字，比照既有卡片排序調整慣例，避免牽動 11 語言
       i18n 圈碼交叉引用文字（見上方 issues-card 前一則卡片順序調整的既有註解） -->
  <section class="card" id="correlation-card">
    <h2 id="t-correlation-title"></h2>
    <div class="hint" id="chains-empty" style="display:none;margin-bottom:0"></div>
    <div class="tbl-wrap"><table id="correlation-table"><thead></thead><tbody></tbody></table></div>
  </section>

  <!-- 主機登入關係（第三十一輪 HX1）：只有 Windows 事件產生關係時顯示 -->
  <section class="card" id="hostgraph-card" style="display:none">
    <h2 id="t-hostgraph-title"></h2>
    <p class="hint" id="t-hostgraph-hint"></p>
    <div class="btn-row">
      <button class="btn" id="btn-hostgraph-csv"></button>
      <button class="btn" id="btn-hostgraph-mermaid"></button>
      <button class="btn" id="btn-hostgraph-drawio"></button>
      <span id="hostgraph-count" style="font-size:12px;color:var(--text-dim)"></span>
    </div>
    <div class="tbl-wrap"><table id="hostgraph-table"><thead></thead><tbody></tbody></table></div>
  </section>

  <!-- 服務健康（XN16）：SLAPD／389 DS／FreeRADIUS 的啟停、當機、上游 RADIUS 狀態與建議一併匯入的 log -->
  <section class="card" id="svchealth-card" style="display:none">
    <h2 id="t-svchealth-title"></h2>
    <p class="hint" id="t-svchealth-hint"></p>
    <div class="tbl-wrap"><table id="svchealth-table"><thead></thead><tbody></tbody></table></div>
    <div id="svchealth-homes"></div>
    <div id="svchealth-advice"></div>
    <details style="margin-top:10px"><summary id="t-svchealth-cmds" style="cursor:pointer"></summary>
      <p class="hint" id="t-svchealth-cmds-hint"></p>
      <div class="tbl-wrap"><table id="svchealth-cmds-table"><thead></thead><tbody></tbody></table></div>
    </details>
  </section>

  <!-- 建議一併匯入的 log（XN16 使用者調整）：依目前匯入的來源列出建議，另附完整對照表 -->
  <section class="card" id="companion-card" style="display:none">
    <h2 id="t-companion-title"></h2>
    <p class="hint" id="t-companion-hint"></p>
    <div id="companion-body"></div>
    <details style="margin-top:10px"><summary id="t-companion-all" style="cursor:pointer"></summary>
      <div class="tbl-wrap"><table id="companion-all-table"><thead></thead><tbody></tbody></table></div>
    </details>
  </section>

  <!-- 行為者檢視（2026-09-24 新增）：輸入或點選攻擊鏈中的行為者，彙整相關事件／問題／攻擊鏈 -->
  <section class="card" id="actor-card">
    <h2 id="t-actor-title"></h2>
    <div class="btn-row">
      <input type="text" id="actor-input" class="txt" list="actor-list" style="width:240px">
      <datalist id="actor-list"></datalist>
      <button class="btn" id="btn-actor-show"></button>
      <button class="btn" id="btn-actor-export-md" disabled></button>
      <button class="btn" id="btn-actor-export-csv" disabled></button>
    </div>
    <div id="actor-result"></div>
  </section>

  <section class="card" id="deid-card">
    <h2 id="t-deid-title"></h2>
    <div class="hint" id="t-deid-hint"></div>
    <div class="btn-row" style="margin-bottom:8px">
      <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="deid-preserve-last-octet"><span id="t-deid-preserve-last-octet"></span>
      </label>
      <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer" id="t-deid-preserve-subnet-wrap">
        <input type="checkbox" id="deid-preserve-subnet"><span id="t-deid-preserve-subnet"></span>
      </label>
    </div>
    <div class="btn-row" style="margin-bottom:8px;flex-direction:column;align-items:flex-start;gap:4px">
      <button class="btn" id="btn-import-map" onclick="document.getElementById('mapping-import-input').click()"></button>
      <input type="file" id="mapping-import-input" accept=".json" style="display:none">
      <span id="mapping-import-status" class="hint" style="display:none;font-size:11px"></span>
      <span class="hint" id="t-hint-cross-tool-mapping" style="font-size:11px"></span>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btn-deid-run"></button>
      <button class="btn" id="btn-deid-download"></button>
      <button class="btn" id="btn-export-map"></button>
      <button class="btn" id="btn-export-csv"></button>
    </div>
    <div id="deid-summary"></div>
  </section>

  <div style="text-align:center;font-size:11px;color:var(--text-muted);padding:10px 0" id="footer-note"></div>
  <div style="text-align:center;font-size:11px;color:var(--text-muted);padding:0 0 10px" data-toolkit-version></div>
</div>
<div class="mini-alpaca" id="mini-alpaca" title="🦙×3">🦙</div>

<script src="log-analyzer-core.js"></script>
<script src="log-analyzer-parse.js"></script>
<script src="log-analyzer-analysis.js"></script>
<script src="log-analyzer-intel.js"></script>
<script src="log-analyzer-detect.js"></script>
<script src="log-analyzer-anon.js"></script>
<script src="log-analyzer-i18n.js"></script>
<script src="log-analyzer-ui.js"></script>
<script src="log-analyzer-app.js"></script>
</body>
</html>
