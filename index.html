<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Network Analyzer Suite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;
  --border:#1e3a5f;--text:#e2e8f0;--text-dim:#64748b;--text-mid:#94a3b8;
  --accent:#00d4ff;--accent2:#7dd3fc;
}
:root[data-theme="light"],body[data-theme="light"]{
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#f8fafc;
  --border:#cbd5e1;--text:#1e293b;--text-dim:#475569;--text-mid:#64748b;
  --accent:#0090b8;--accent2:#0284c7;
}
body{font-family:'Noto Sans TC','IBM Plex Sans TC',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

/* ── Header ────────────────────────────────────────────────── */
.header{padding:28px 40px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{font-size:32px;line-height:1}
.logo-text h1{font-size:22px;font-weight:700;
  background:linear-gradient(90deg,#00d4ff,#7dd3fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-text p{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:2px}

.lang-bar{display:flex;gap:6px}
.lang-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  padding:5px 12px;font-size:11px;color:var(--text-dim);cursor:pointer;
  transition:border-color .15s,color .15s;font-family:inherit}
.lang-btn:hover,.lang-btn.active{border-color:var(--accent);color:var(--accent)}

/* ── Hero ──────────────────────────────────────────────────── */
.hero{padding:36px 40px 0;text-align:center}
.hero-sub{font-size:13px;color:var(--text-dim);margin-top:6px}

/* ── Cards grid ────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;padding:32px 40px;flex:1}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:24px;display:flex;flex-direction:column;gap:16px;
  transition:border-color .2s,transform .2s,box-shadow .2s;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--card-color,#00d4ff),transparent)}
.card:hover{border-color:var(--card-color,#00d4ff);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4)}

.card-icon{font-size:36px;line-height:1}
.card-title{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.card-badge{font-size:10px;font-family:'JetBrains Mono',monospace;
  background:rgba(0,212,255,.12);color:var(--accent);border-radius:4px;padding:2px 6px}
.card-desc{font-size:12px;color:var(--text-mid);line-height:1.7;flex:1}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;font-family:'JetBrains Mono',monospace;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;padding:2px 7px;color:var(--text-dim)}
.card-features{border-top:1px solid var(--border);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.feat{font-size:11px;color:var(--text-mid);display:flex;align-items:center;gap:4px}
.feat::before{content:'✓';color:var(--card-color,#00d4ff);font-size:10px;font-weight:700}

.card-open{margin-top:4px;background:linear-gradient(135deg,var(--card-color,#00d4ff) 0%,rgba(0,212,255,.6) 100%);
  border:none;border-radius:8px;padding:10px 0;font-size:12px;font-weight:600;
  color:#0a0e1a;cursor:pointer;font-family:inherit;
  transition:opacity .15s,transform .15s}
.card-open:hover{opacity:.9;transform:scale(.99)}

/* ── Footer ─────────────────────────────────────────────────── */
.footer{padding:16px 40px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.footer-note{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
.alpaca{opacity:.7;transition:opacity .2s;cursor:default;line-height:1}
.alpaca:hover{opacity:1}

/* ── Drop hint bar ──────────────────────────────────────────────── */
.drop-hint-bar{margin:0 40px 24px;border:1.5px dashed var(--border);border-radius:10px;
  padding:13px 20px;display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--text-dim);font-size:12px;cursor:pointer;
  transition:border-color .2s,background .2s,color .2s}
.drop-hint-bar:hover{border-color:var(--accent);background:rgba(0,212,255,.04);color:var(--text-mid)}
.drop-hint-bar .dhb-pick{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);
  color:var(--accent);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;
  font-family:inherit;transition:background .15s;flex-shrink:0}
.drop-hint-bar .dhb-pick:hover{background:rgba(0,212,255,.22)}

/* ── Konami bounce ───────────────────────────────────────────────── */
@keyframes card-bounce{
  0%,100%{transform:translateY(0)}
  20%{transform:translateY(-14px)}
  50%{transform:translateY(-7px)}
  70%{transform:translateY(-11px)}
}
.card-bounce{animation:card-bounce .65s ease}

/* ── Alpaca parade ───────────────────────────────────────────────── */
@keyframes alpaca-run{from{transform:translateX(110vw)}to{transform:translateX(-110vw)}}
.alpaca-parade{position:fixed;bottom:24px;left:0;white-space:nowrap;
  font-size:30px;z-index:999;pointer-events:none;
  animation:alpaca-run 3.2s linear forwards}

/* ── Logo egg toast ──────────────────────────────────────────────── */
.egg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;cursor:pointer}
.egg-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--surface);border:1px solid var(--accent);border-radius:14px;
  padding:28px 36px;z-index:1001;min-width:300px;text-align:center;
  box-shadow:0 0 40px rgba(0,212,255,.25);pointer-events:none}
.egg-toast-icon{font-size:36px;margin-bottom:10px}
.egg-toast-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:18px}
.egg-stat-row{display:flex;justify-content:space-between;align-items:center;
  gap:20px;margin:7px 0;font-size:12px}
.egg-stat-val{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700}
.egg-toast-hint{margin-top:18px;font-size:10px;color:var(--text-dim);
  font-family:'JetBrains Mono',monospace}

/* ── Notice bar ─────────────────────────────────────────────────── */
.notice{margin:16px 40px 0;padding:8px 16px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);
  border-radius:8px;font-size:12px;color:#fbbf24;text-align:center;
  font-family:'JetBrains Mono',monospace;line-height:1.5}

/* ── Klingon lang btn ────────────────────────────────────────────── */
#lang-klingon{border-color:#c0392b;color:#e74c3c}
#lang-klingon:hover,#lang-klingon.active{border-color:#e74c3c;color:#ff6b6b;
  box-shadow:0 0 8px rgba(231,76,60,.4)}
/* ── Easter egg lang btns ────────────────────────────────────────── */
#lang-pirate{border-color:#b45309;color:#f59e0b}
#lang-pirate:hover,#lang-pirate.active{border-color:#f59e0b;color:#fcd34d;box-shadow:0 0 8px rgba(245,158,11,.4)}
#lang-leet{border-color:#047857;color:#10b981}
#lang-leet:hover,#lang-leet.active{border-color:#10b981;color:#6ee7b7;box-shadow:0 0 8px rgba(16,185,129,.4)}
#lang-emoji{border-color:#7c3aed;color:#a78bfa}
#lang-emoji:hover,#lang-emoji.active{border-color:#a78bfa;color:#c4b5fd;box-shadow:0 0 8px rgba(167,139,250,.4)}
#lang-uwu{border-color:#be185d;color:#f472b6}
#lang-uwu:hover,#lang-uwu.active{border-color:#f472b6;color:#fbcfe8;box-shadow:0 0 8px rgba(244,114,182,.4)}
#lang-bureau{border-color:#475569;color:#94a3b8}
#lang-bureau:hover,#lang-bureau.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.4)}
#lang-cat{border-color:#c2410c;color:#fb923c}
#lang-cat:hover,#lang-cat.active{border-color:#fb923c;color:#fdba74;box-shadow:0 0 8px rgba(251,146,60,.4)}
#lang-bean{border-color:#b45309;color:#4ade80}
#lang-bean:hover,#lang-bean.active{border-color:#fbbf24;color:#bbf7d0;box-shadow:0 0 8px rgba(74,222,128,.4)}
#lang-alpaca{border-color:#92400e;color:#fcd34d}
#lang-alpaca:hover,#lang-alpaca.active{border-color:#fcd34d;color:#fef3c7;box-shadow:0 0 8px rgba(252,211,77,.4)}#lang-yanse{border-color:#64748b;color:#94a3b8}#lang-yanse:hover,#lang-yanse.active{border-color:#94a3b8;color:#cbd5e1;box-shadow:0 0 8px rgba(148,163,184,.3)}
/* ── Lang egg triggers ───────────────────────────────────────────── */
.lang-egg{opacity:.25;cursor:pointer;font-size:14px;padding:2px 3px;
  user-select:none;transition:opacity .2s}
.lang-egg:hover{opacity:.7}

/* ── Qapla toast ─────────────────────────────────────────────────── */
.qapla-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:#1a0a0a;border:1px solid #e74c3c;border-radius:10px;
  padding:12px 24px;z-index:2000;font-size:13px;color:#ff6b6b;
  font-family:'JetBrains Mono',monospace;white-space:nowrap;pointer-events:none;
  box-shadow:0 0 20px rgba(231,76,60,.4);
  animation:qapla-in .3s ease,qapla-out .4s ease 2s forwards}
@keyframes qapla-in{from{opacity:0;top:0}to{opacity:1;top:24px}}
@keyframes qapla-out{to{opacity:0;top:0}}

/* ── Missing card ────────────────────────────────────────────────── */
.card-missing{opacity:.55;cursor:default}
.card-missing:hover{border-color:var(--border)!important;transform:none!important;box-shadow:none!important}
.card-warn{margin-top:4px;padding:9px 12px;
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);
  border-radius:8px;font-size:11px;color:#fbbf24;text-align:center;
  font-family:'JetBrains Mono',monospace}

@media(max-width:600px){
  .header,.cards,.hero,.footer{padding-left:20px;padding-right:20px}
  .notice{margin-left:20px;margin-right:20px}
  .cards{grid-template-columns:1fr}
}
.global-tip{position:fixed;display:none;z-index:99999;pointer-events:none;background:#1e2035;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:7px 11px;font-size:11px;line-height:1.6;max-width:260px;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 14px rgba(0,0,0,.45);font-weight:400;font-family:inherit;text-transform:none;letter-spacing:0}
/* ── Drop Overlay ─────────────────────────────────────────── */
.drop-overlay{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:rgba(10,14,26,.92);backdrop-filter:blur(6px)}
.drop-overlay.active{display:flex}
.drop-box{border:2px dashed #00d4ff;border-radius:16px;padding:40px 60px;text-align:center;color:#fff;font-size:18px;pointer-events:none;animation:drop-pulse 1.5s ease-in-out infinite}
.drop-box small{display:block;font-size:12px;opacity:.5;margin-top:8px}
@keyframes drop-pulse{0%,100%{border-color:#00d4ff}50%{border-color:#4ade80}}
.drop-result-chip{font-size:15px;padding:10px 24px;border-radius:10px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;text-align:center}
.drop-vendor-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:#0d1b2a;border:1px solid #00d4ff;color:#00d4ff;margin-left:6px}
.drop-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.da-primary{padding:9px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#00d4ff,#4ade80);color:#000;font-weight:700;font-size:13px;cursor:pointer}
.da-secondary{padding:9px 20px;border-radius:8px;border:1px solid #a78bfa;background:none;color:#a78bfa;font-size:13px;cursor:pointer}
.da-secondary:hover{background:#a78bfa;color:#000}
.da-primary:hover{opacity:.85}
.drop-manual-btn{font-size:11px;color:#64748b;cursor:pointer;border:none;background:none;text-decoration:underline dotted;padding:0}
.drop-manual-btn:hover{color:#e2e8f0}
.drop-choices{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
.drop-choices.open{display:flex}
.drop-choices button{padding:7px 16px;border-radius:8px;font-size:12px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer}
.drop-choices button:hover{border-color:#00d4ff;color:#00d4ff}
.drop-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;line-height:1;z-index:1}
.drop-close:hover{color:#e2e8f0}
@media print{
  .header,.tool-grid{page-break-inside:avoid}
  .upload-actions,.lang-bar,.drop-zone{display:none!important}
  body{background:#fff!important;color:#000!important}
  .tool-card{border:1px solid #ccc;box-shadow:none}
  @page{margin:1.5cm}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo" id="logo-btn" style="cursor:pointer" title="">
    <div class="logo-icon">🌐</div>
    <div class="logo-text">
      <h1 id="h-suite">Network Analyzer Suite</h1>
      <p id="h-sub">Pure JS · 零伺服器 · 單檔執行</p>
    </div>
  </div>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="zhTW" onclick="setLang('zhTW')">繁中</button>
    <button class="lang-btn"        data-lang="en"   onclick="setLang('en')">EN</button>
    <button class="lang-btn"        data-lang="ja"   onclick="setLang('ja')">日本語</button>

    <button class="lang-btn" id="lang-uwu"    data-lang="uwu"   onclick="setLang('uwu')"   style="display:none">UwU</button>
    <button class="lang-btn" id="lang-bureau" data-lang="bureau" onclick="setLang('bureau')" style="display:none">公文</button>
    <button class="lang-btn" id="lang-cat"    data-lang="cat"    onclick="setLang('cat')"    style="display:none">nyaa</button>
    <button class="lang-btn" id="lang-bean"   data-lang="bean"   onclick="setLang('bean')"   style="display:none">🥕🫛🌽</button><button class="lang-btn" id="lang-alpaca" data-lang="alpaca" onclick="setLang('alpaca')" style="display:none">🦙咩</button><button class="lang-btn" id="lang-yanse" data-lang="yanse" onclick="setLang('yanse')" style="display:none">😮‍💨 算了</button>

    <span class="lang-egg" id="egg-leet"   title="">💾</span>
    <span class="lang-egg" id="egg-emoji"  title="">🌈</span>
    <span class="lang-egg" id="egg-uwu"    title="">🐾</span>
    <span class="lang-egg" id="egg-bureau" title="">📋</span>
    <span class="lang-egg" id="egg-cat"    title="">🐱</span>
    <span class="lang-egg" id="egg-bean"   title="">🫛</span><span class="lang-egg" id="egg-alpaca">🦙</span><span class="lang-egg" id="egg-yanse">😮‍💨</span>
    <button id="theme-btn" onclick="toggleTheme()" title="切換明/暗模式" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 8px;margin-left:auto;line-height:1">☀️</button>
  </div>
</div>

<div class="hero">
  <p class="hero-sub" id="h-hero"></p>
</div>

<div class="notice" id="h-notice"></div>

<div class="cards" id="cards"></div>

<div class="drop-hint-bar" id="drop-hint-bar" onclick="document.getElementById('file-pick').click()">
  <span id="drop-bar-txt"></span>
  <button class="dhb-pick" id="drop-bar-btn" onclick="event.stopPropagation();document.getElementById('file-pick').click()"></button>
  <input type="file" id="file-pick" style="display:none" accept=".conf,.cfg,.txt,.xml,.log,.json,.ini,text/*">
</div>

<div class="footer">
  <span class="footer-note" id="h-footer">Pure JS Firewall / Switch / Config Anonymizer | Network Analyzer Suite</span>
  <span class="alpaca" id="alpaca-btn" title="">🦙</span>
</div>

// ── tr / setLang ───────────────────────────────────────────────────
let _lang = 'zhTW';
function tr(k){
  if(_lang==='leet'){const s=LANG.en[k]||LANG.zhTW[k]||k;return s.replace(/a/gi,'4').replace(/e/gi,'3').replace(/i/gi,'1').replace(/o/gi,'0').replace(/s/gi,'5').replace(/t/gi,'7').replace(/l/gi,'|');}
  if(_lang==='uwu'){const s=LANG.en[k]||LANG.zhTW[k]||k;return s.replace(/r/g,'w').replace(/R/g,'W').replace(/l/g,'w').replace(/L/g,'W').replace(/th/g,'d').replace(/Th/g,'D').replace(/n([aeiou])/g,'ny$1').replace(/N([AEIOU])/g,'Ny$1');}
  if(_lang==='cat'){const d=LANG.cat&&LANG.cat[k];if(d)return d;const base=LANG.zhTW[k]||LANG.en[k]||k;return base+(/[一-鿿]$/.test(base)?'喵~':' nyaa~');}
  if(_lang==='bean'){const d=LANG.bean&&LANG.bean[k];if(d)return d;const base=LANG.en[k]||LANG.zhTW[k]||k;const vg=['🥕','🫛','🌽'];return base.split('').map(c=>c===' '?' ':vg[c.charCodeAt(0)%3]).join('');}
  return (LANG[_lang]||LANG.zhTW)[k]||LANG.en[k]||k;
}

function tip(key, label) {
  const t = tr(key);
  if (!t || t === key) return label;
  return `<span data-tip="${t.replace(/"/g,'&quot;')}">${label}<sup style="font-size:8px;opacity:.45;margin-left:2px;cursor:help">ⓘ</sup></span>`;
}
function setLang(lang) {
  _lang = lang;
  document.documentElement.lang = lang === 'zhTW' ? 'zh-TW' : lang;
  document.querySelectorAll('.lang-btn[data-lang]').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.getElementById('h-sub').textContent = tr('suite.sub');
  document.getElementById('h-hero').textContent = tr('suite.hero');
  document.getElementById('h-notice').textContent = tr('notice.place');
  document.getElementById('h-footer').innerHTML = tip('tip.footer', tr('suite.footer'));
  document.getElementById('alpaca-btn').title = tr('egg.alpaca');
  document.getElementById('logo-btn').title = tr('egg.logo_hint');
  _updateDropText();
  renderCards();
}

// ── renderCards ───────────────────────────────────────────────────
const _missing = new Set();

function renderCards() {
  const wrap = document.getElementById('cards');
  wrap.innerHTML = TOOLS.map(t => {
    const miss = _missing.has(t.id);
    return `
    <div class="card${miss ? ' card-missing' : ''}" style="--card-color:${t.color}"${miss ? '' : ` onclick="openTool('${t.href}')"`}>
      <div class="card-icon">${t.icon}</div>
      <div>
        <div class="card-title">
          ${tip('tip.' + (t.id==='fw'?'fw_analyzer':t.id==='sw'?'sw_analyzer':'cfg_anon'), tr(t.id + '.title'))}
          <span class="card-badge">${tr(t.id + '.badge')}</span>
        </div>
      </div>
      <p class="card-desc">${tr(t.id + '.desc')}</p>
      <div class="card-tags">
        ${t.vendors.map(v => {
          const label = v.startsWith('$') ? tr(v.slice(1)) : v;
          const slug = VENDOR_PERSONA_KEY[v];
          const persona = slug ? tr('egg.vendor_' + slug) : '';
          return persona ? `<span class="tag" data-tip="${persona.replace(/"/g,'&quot;')}">${label}</span>` : `<span class="tag">${label}</span>`;
        }).join('')}
      </div>
      <div class="card-features">
        ${t.features.map(f => `<span class="feat">${tr(f)}</span>`).join('')}
      </div>
      ${miss
        ? `<div class="card-warn">⚠ ${tr('warn.missing')}</div>`
        : `<button class="card-open">${tr('suite.open')}</button>`}
    </div>`;
  }).join('');
}

function openTool(href) { window.open(href, '_blank'); }

async function checkFiles() {
  if (location.protocol === 'file:') {
    document.getElementById('h-notice').style.display = 'none';
    renderCards();
    return;
  }
  await Promise.all(TOOLS.map(async t => {
    try {
      const r = await fetch(t.href, { method: 'HEAD' });
      if (!r.ok) _missing.add(t.id);
    } catch { _missing.add(t.id); }
  }));
  renderCards();
  document.getElementById('h-notice').style.display = _missing.size === 0 ? 'none' : '';
}

// ── 拖入自動分派 ──────────────────────────────────────────────────
const VENDOR_NAMES = {f:'FortiGate',s:'Sophos XG',c:'Check Point',p:'Palo Alto',j:'Juniper SRX',x:'pfSense',w:'SonicWall',m:'MikroTik',a:'Cisco ASA',arista:'Arista EOS'};
let _dropPending = null;
// 快速連續拖放/選檔的競態防呆：每次啟動新的 FileReader 讀取時遞增，onload 觸發時比對
// 是否仍是最新一次讀取的世代號，避免較舊、讀取較慢（如檔案較大）的結果晚於較新的讀取
// 完成，反而覆蓋畫面上顯示/寫入 _dropPending 的較新結果
let _dropGen = 0;

function detectTool(text) {
  const t = text.slice(0, 8000);
  if (/config firewall policy|config vdom/i.test(t))                        return {idx:0, vendor:'f'};
  if (/set security policies/i.test(t))                                      return {idx:0, vendor:'j'};
  if (/^set hostname\s+\S+/m.test(t) && /^set interface\s+\S+\s+ipv4-address/m.test(t)) return {idx:0, vendor:'c'};
  if (/<config>[\s\S]{0,300}<devices>/m.test(t))                             return {idx:0, vendor:'p'};
  // MikroTik 防火牆訊號：僅認 /ip firewall（真正的防火牆規則區塊）。原本連 /interface bridge
  // 也一併判定為防火牆，但 /interface bridge 是純交換器功能（VLAN filtering／橋接），純交換器
  // 匯出檔（無任何 /ip firewall 規則）會被誤導向防火牆分析器；/interface bridge 判斷改移到
  // 下方與其餘交換器廠牌訊號同一批次（見下方 idx:1 區塊）
  if (/\/ip firewall/i.test(t))                                              return {idx:0, vendor:'m'};
  if (/nameif\s+\w+/i.test(t) && /access-list/i.test(t))                    return {idx:0, vendor:'a'};
  if (/firewall-policy\s*\{/im.test(t))                                      return {idx:0, vendor:'s'};
  if (/<SonicWALL/i.test(t))                                                 return {idx:0, vendor:'w'};
  if (/pfctl\b|set filterip/i.test(t))                                       return {idx:0, vendor:'x'};
  // Arista EOS: unique signatures (must check before generic Cisco patterns)
  if (/^!\s*device:\s*\S+.*\(Arista\s/m.test(t) || /^!\s*Software image version:\s*EOS/m.test(t) ||
      (/^interface\s+Ethernet\d+(?:\/\d+)*\s*$/m.test(t) && /^ip routing$/m.test(t)))
    return {idx:1, vendor:'arista'};
  if (/spanning-tree|interface\s+(GigabitEthernet|FastEthernet|TenGigabitEthernet)/i.test(t)) return {idx:1, vendor:null};
  if (/^feature\s+\w+/m.test(t) && (/Cisco\s+Nexus/i.test(t)||/^vdc\s+\S+\s+id/m.test(t))) return {idx:1, vendor:null};
  if (/^;\s*(?:HP\s|Aruba\s|J\d{4}[A-Z])/m.test(t)||/^oobm$/m.test(t)||/^trunk\s+\S+\s+[Tt]rk\d+/m.test(t)) return {idx:1, vendor:null};
  if (/feature\s+(vpc|lacp)|vlan database/i.test(t))                        return {idx:1, vendor:null};
  if (/sysname\s+\w|irf domain/i.test(t))                                   return {idx:1, vendor:null};
  // MikroTik RouterOS 純交換器訊號（VLAN filtering／橋接，無 /ip firewall 規則時走到這裡）
  if (/\/interface bridge/i.test(t))                                        return {idx:1, vendor:null};
  return null;
}

// 2026-07-24 修復既有隱患：真實設定檔（尤其含大量位址/服務物件的 FortiGate 匯出）可能達數 MB，
// 超過瀏覽器單一來源 localStorage 容量上限（多數瀏覽器 5-10MB）時 setItem() 會拋出
// QuotaExceededError，若未接住會讓後面的 window.open() 完全不執行，使用者看起來就是「按鈕沒反應」。
// 补上 try/catch：交接失敗時仍正常開啟工具分頁（只是不會自動帶入該檔案，使用者需手動上傳），並提示原因
function _dispatchWithPending(toolIdx, vendor) {
  if (!_dropPending) return;
  try {
    localStorage.setItem('_netAnalyzer_pending', JSON.stringify({
      name: _dropPending.name, text: _dropPending.text, ts: Date.now(), vendor: vendor || null
    }));
  } catch(e) { alert(tr('drop.pending_too_large')); }
  window.open(TOOLS[toolIdx].href, '_blank');
  setTimeout(() => document.getElementById('drop-overlay').classList.remove('active'), 350);
  _dropPending = null;
}
function _dispatchWithAnon(toolIdx, vendor) {
  if (!_dropPending) return;
  try {
    localStorage.setItem('_netAnalyzer_anonThenOpen', JSON.stringify({
      name: _dropPending.name, text: _dropPending.text, ts: Date.now(), toolIdx, vendor: vendor || null
    }));
  } catch(e) { alert(tr('drop.pending_too_large')); }
  window.open(TOOLS[2].href, '_blank');
  setTimeout(() => document.getElementById('drop-overlay').classList.remove('active'), 350);
  _dropPending = null;
}

function _showDropResult(name, detected, text) {
  _dropPending = { name, text };
  const box = document.getElementById('drop-box');
  const result = document.getElementById('drop-result');
  const chip = document.getElementById('drop-chip');
  const actions = document.getElementById('drop-actions');
  const choices = document.getElementById('drop-choices');
  const manualBtn = document.getElementById('drop-manual-btn');
  box.style.display = 'none';
  result.style.display = 'flex';
  choices.classList.remove('open');
  if (detected) {
    const vname = detected.vendor ? VENDOR_NAMES[detected.vendor] : null;
    chip.innerHTML = vname
      ? `🔍 偵測到 <span class="drop-vendor-badge">${vname}</span> 設定`
      : `🔍 偵測到交換機設定`;
    actions.innerHTML = `
      <button class="da-primary" onclick='_dispatchWithPending(${detected.idx},${JSON.stringify(detected.vendor)})'>${TOOLS[detected.idx].icon} ${tr('drop.open')} ${tr(TOOLS[detected.idx].id+'.title')}</button>
      <button class="da-secondary" onclick='_dispatchWithAnon(${detected.idx},${JSON.stringify(detected.vendor)})'>🔒🔀 ${tr('drop.anon_then_open')}</button>
      <button class="da-secondary" onclick="_dispatchWithPending(2,null)">🔒 ${tr('drop.to_anon')}</button>`;
    manualBtn.textContent = tr('drop.manual');
    manualBtn.style.display = '';
  } else {
    chip.textContent = tr('drop.unknown');
    actions.innerHTML = '';
    manualBtn.style.display = 'none';
    choices.classList.add('open');
  }
  choices.innerHTML = TOOLS.map((t, i) =>
    `<button onclick="_dispatchWithPending(${i},null)">${t.icon} ${tr(t.id+'.title')}</button>`
  ).join('');
}

function _updateDropText() {
  const h = document.getElementById('drop-hint-txt');
  const s = document.getElementById('drop-sub-txt');
  if (h) h.textContent = tr('drop.hint');

  const b = document.getElementById('drop-bar-txt');
  const p = document.getElementById('drop-bar-btn');
  if (b) b.textContent = tr('drop.bar');
  if (p) p.textContent = tr('drop.pick');
}

(function(){
  let _dragCounter = 0;
  const overlay = document.getElementById('drop-overlay');
  document.addEventListener('dragenter', e => {
    if (![...e.dataTransfer.types].includes('Files')) return;
    _dragCounter++;
    overlay.classList.add('active');
    document.getElementById('drop-box').style.display = '';
    document.getElementById('drop-result').style.display = 'none';
    _dropPending = null;
  });
  document.addEventListener('dragleave', e => {
    _dragCounter--;
    if (_dragCounter <= 0) { _dragCounter = 0; overlay.classList.remove('active'); }
  });
  document.addEventListener('dragover', e => { e.preventDefault(); });
  document.addEventListener('drop', e => {
    e.preventDefault();
    _dragCounter = 0;
    const file = e.dataTransfer.files[0];
    if (!file) { overlay.classList.remove('active'); return; }
    const myGen = ++_dropGen;
    const reader = new FileReader();
    reader.onload = ev => { if (myGen !== _dropGen) return; _showDropResult(file.name, detectTool(ev.target.result), ev.target.result); };
    reader.readAsText(file, 'UTF-8');
  });
})();

document.getElementById('file-pick').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  this.value = '';
  const overlay = document.getElementById('drop-overlay');
  overlay.classList.add('active');
  document.getElementById('drop-box').style.display = 'none';
  document.getElementById('drop-result').style.display = 'none';
  const myGen = ++_dropGen;
  const reader = new FileReader();
  reader.onload = ev => { if (myGen !== _dropGen) return; _showDropResult(file.name, detectTool(ev.target.result), ev.target.result); };
  reader.readAsText(file, 'UTF-8');
});

(function(){
  var _t = document.createElement('div');
  _t.className = 'global-tip';
  document.body.appendChild(_t);
  document.addEventListener('mouseover', function(e) {
    var el = e.target.closest('[data-tip]');
    if (!el) return;
    _t.textContent = el.dataset.tip;
    _t.style.display = 'block';
    var r = el.getBoundingClientRect(), tw = _t.offsetWidth, th = _t.offsetHeight;
    var x = r.left + r.width / 2 - tw / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
    var y = r.top - th - 8;
    _t.style.left = x + 'px';
    _t.style.top = (y < 8 ? r.bottom + 8 : y) + 'px';
  });
  document.addEventListener('mouseout', function(e) { if (e.target.closest('[data-tip]')) _t.style.display = 'none'; });
  document.addEventListener('scroll', function() { _t.style.display = 'none'; }, true);
})();
